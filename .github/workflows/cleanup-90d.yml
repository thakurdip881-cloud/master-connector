# 3 महीने (90 दिन) से पुराना डेटा अपने-आप हटाना — रोज़ रात, फ़्री
# हटता है: ड्यूटी, हाज़िरी रिकॉर्डिंग, रिपोर्ट, कमांड/जवाब, पुराने बुलावे। वर्कर और उनकी KYC नहीं हटती।
# repo public है इसलिए log में सिर्फ़ गिनती छपती है।
name: Cleanup 90 days
on:
  workflow_dispatch:
  schedule:
    - cron: '11 21 * * *'   # रोज़ रात 2:41 IST
permissions:
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: पुराना डेटा हटाएँ
        env: { SA: '${{ secrets.FIREBASE_SA }}' }
        run: |
          [ -z "$SA" ] && { echo "सेवा खाता नहीं"; exit 0; }
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npm i --silent --no-save firebase-admin@12 >/dev/null 2>&1
          node -e '
          const a=require("firebase-admin"); a.initializeApp({credential:a.credential.applicationDefault(),projectId:"master-connector-f2a0d"});
          const db=a.firestore(), cut=a.firestore.Timestamp.fromMillis(Date.now()-90*864e5);
          const plan=[["dutyVid","at"],["scrRec","at"],["reports","at"],["acks","at"],["commands","createdAt"],["duty","start"],["invites","createdAt"]];
          (async()=>{ const out={}; let total=0;
            for(const [c,f] of plan){ let n=0;
              for(;;){ const s=await db.collection(c).where(f,"<",cut).limit(400).get(); if(s.empty) break;
                const b=db.batch(); s.docs.forEach(d=>b.delete(d.ref)); await b.commit(); n+=s.size; }
              out[c]=n; total+=n; }
            await db.doc("meta/cleanup").set({at:a.firestore.FieldValue.serverTimestamp(),total,detail:out,keepDays:90});
            console.log("DELETED:",total,JSON.stringify(out));
            if(total>0){ try{ await fetch("https://formsubmit.co/ajax/thakurdip881@gmail.com",{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json",Origin:"https://thakurdip881-cloud.github.io",Referer:"https://thakurdip881-cloud.github.io/master-connector/"},body:JSON.stringify({_subject:"🧹 MASTER CONNECTOR — 3 महीने पुराना डेटा हटाया",_template:"table",_captcha:"false","कुल हटे":total,"हाज़िरी रिकॉर्डिंग":out.dutyVid,"रिपोर्ट":out.reports,"ड्यूटी":out.duty,"कमांड":out.commands,"जवाब":out.acks,"पुराने बुलावे":out.invites,"नियम":"90 दिन से पुराना डेटा अपने-आप हटता है; वर्कर और KYC बने रहते हैं"})}); console.log("MAIL: sent"); }catch(e){ console.log("MAIL: failed"); } }
          })().catch(e=>{console.log("ERR",e.code||"");process.exit(1)});'
          rm -f "$RUNNER_TEMP/sa.json"
