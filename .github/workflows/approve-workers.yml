# ✅ वर्करों को मंज़ूरी / खाता बनाना (मालिक के कहने पर) — हाथ से Run।
# input "data" = [{"n":"नाम","m":"10 अंक मोबाइल"}] — event फ़ाइल से पढ़ा जाता है, log में नहीं छपता।
# खाता है → मंज़ूरी + लॉगिन चालू। नहीं है → नया लॉगिन + users में जोड़ना + पासवर्ड secrets में (मालिक ऐप में देखे)।
# repo public है: log में सिर्फ़ 1/2/3 और क्या हुआ।
name: Approve workers
on:
  workflow_dispatch:
    inputs:
      data: { description: 'वर्कर JSON', required: true }
permissions:
  contents: read
jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: मंज़ूरी
        env: { SA: '${{ secrets.FIREBASE_SA }}' }
        run: |
          [ -z "$SA" ] && { echo "सेवा खाता नहीं"; exit 1; }
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npm i --silent --no-save firebase-admin@12 >/dev/null 2>&1
          node -e '
          const a=require("firebase-admin"), cr=require("crypto"); a.initializeApp({credential:a.credential.applicationDefault(),projectId:"master-connector-f2a0d"});
          const db=a.firestore(), auth=a.auth(), DOM="worker.masterconnector.app", TS=a.firestore.FieldValue.serverTimestamp();
          const gen=()=>{ const A="abcdefghjkmnpqrstuvwxyz"; let t="Dip-"; for(let i=0;i<4;i++) t+=A[cr.randomInt(A.length)]; for(let i=0;i<4;i++) t+=cr.randomInt(10); return t; };
          const W=JSON.parse((JSON.parse(require("fs").readFileSync(process.env.GITHUB_EVENT_PATH,"utf8")).inputs||{}).data||"[]"), last=m=>String(m||"").replace(/\D/g,"").slice(-10);
          (async()=>{ const us=(await db.collection("users").get()).docs;
            for(let i=0;i<W.length;i++){ const w=W[i], mob=last(w.m), email=mob+"@"+DOM;
              try{ const ds=us.filter(d=>last(d.data().mobile)===mob || d.data().email===email);
                if(ds.length){ for(const d of ds){ const u=d.data();
                    await d.ref.set({active:true,status:(u.status==="pending"||u.status==="blocked"||u.active===false)?"approved":(u.status||"approved"),approvedAt:TS},{merge:true});
                    try{ await auth.updateUser(d.id,{disabled:false}); }catch(e){}
                    console.log("WORKER",i+1,"पहले से था → मंज़ूर, लॉगिन चालू"); } continue; }
                let au=null, pw=null; try{ au=await auth.getUserByEmail(email); }catch(e){}
                if(au){ pw=gen(); await auth.updateUser(au.uid,{password:pw,disabled:false}); }
                else { pw=gen(); au=await auth.createUser({email,password:pw}); }
                await db.doc("users/"+au.uid).set({name:String(w.n||"वर्कर").slice(0,60),email,mobile:mob,role:"worker",canEdit:false,active:true,status:"approved",shift:"morning",createdAt:TS,approvedAt:TS},{merge:true});
                await db.doc("secrets/"+au.uid).set({pw,at:TS,by:"approve"});
                console.log("WORKER",i+1,"नया खाता बना → मंज़ूर, पासवर्ड ऐप में (KYC/🔑)");
              }catch(e){ console.log("WORKER",i+1,"नहीं हुआ:",e.code||"error"); } }
          })().catch(e=>{console.log("ERR",e.code||"");process.exit(1)});'
          rm -f "$RUNNER_TEMP/sa.json"
