name: Build APK
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK check
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" ; echo "::notice::ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" | tr '\n' ' ' | xargs -I{} echo "::notice::platforms {}"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null || echo "::warning::sdkmanager failed"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle -p android assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Show errors
        if: failure()
        run: grep -n -i -E "error|what went wrong|failed" build.log | head -40 | while read l; do echo "::error::$l"; done
      - run: cp android/app/build/outputs/apk/release/app-release.apk MasterConnector.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ github.run_number }}
          name: MASTER CONNECTOR APK v${{ github.run_number }}
          files: MasterConnector.apk
          make_latest: true
