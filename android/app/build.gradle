plugins { id 'com.android.application' }
android {
    namespace 'com.masterconnector.app'
    compileSdk 34
    defaultConfig {
        applicationId 'com.masterconnector.app'
        minSdk 24
        targetSdk 34
        versionCode (System.getenv("VERSION_CODE") ?: "1").toInteger()
        versionName "1." + (System.getenv("VERSION_CODE") ?: "1")
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.debug }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
