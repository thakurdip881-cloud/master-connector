plugins { id 'com.android.application' }

def vcode = (project.findProperty('vcode') ?: '1').toString().toInteger()

android {
    namespace 'com.masterconnector.app'
    compileSdk 34
    defaultConfig {
        applicationId 'com.masterconnector.app'
        minSdk 24
        targetSdk 34
        versionCode vcode
        versionName "1.${vcode}"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
