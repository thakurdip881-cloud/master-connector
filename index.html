<!DOCTYPE html>
<html lang="hi">
<head>

<style>
.req::after{content:" *";color:#e11;font-weight:700}

:root{--bg:#f3f5f9;--card:#fff;--ink:#14213d;--muted:#667085;--line:#e3e7ee;--pri:#0f3d6e;--pri2:#1d64b0;--ok:#12805c;--okbg:#e3f6ee;--bad:#c0392b;--badbg:#fdecea;--warn:#a46300;--warnbg:#fff4de}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif;background:var(--bg);color:var(--ink);font-size:16px}
header{background:var(--pri);color:#fff;padding:14px 16px calc(14px);position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:18px;margin:0;letter-spacing:.5px}
header small{display:block;font-size:12px;opacity:.8;font-weight:400}
main{padding:14px 14px 90px;max-width:720px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:16px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff;color:var(--ink)}
textarea{min-height:80px;resize:vertical}
button{font:inherit;border:0;border-radius:10px;padding:11px 14px;background:var(--pri2);color:#fff;cursor:pointer}
button.sec{background:#e8eef7;color:var(--pri)}
button.bad{background:var(--bad)}
button.ok{background:var(--ok)}
button.sm{padding:7px 10px;font-size:13px}
button:disabled{opacity:.5}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.muted{color:var(--muted);font-size:13px}
.pill{display:inline-block;font-size:12px;padding:3px 9px;border-radius:99px;background:#eef1f6;color:var(--muted)}
.pill.ok{background:var(--okbg);color:var(--ok)}
.pill.bad{background:var(--badbg);color:var(--bad)}
.pill.warn{background:var(--warnbg);color:var(--warn)}
.list>div{padding:10px 0;border-top:1px solid var(--line)}
.list>div:first-child{border-top:0}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;background:none;color:var(--muted);border-radius:0;padding:10px 2px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button b{font-size:20px;font-weight:400}
nav button.on{color:var(--pri2)}
.big{font-size:22px;padding:18px;width:100%;border-radius:14px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{font-size:24px;display:block}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#14213d;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;max-width:90%}
.hidden{display:none!important}
.popup{position:fixed;inset:0;background:rgba(10,20,40,.55);z-index:30;display:flex;align-items:center;justify-content:center;padding:20px}
.popup .card{max-width:420px;width:100%}
a{color:var(--pri2);word-break:break-all}
.switch{width:64px;height:36px;border-radius:99px;background:#cfd6e2;position:relative;flex:none;padding:0}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:28px;height:28px;border-radius:50%;background:#fff;transition:.2s}
.switch.on{background:var(--ok)}
.switch.on::after{left:32px}
.diya{position:relative;display:inline-block;width:var(--s);height:var(--s);border-radius:50%;overflow:hidden;flex:none;vertical-align:middle}
.diya img.b{width:100%;height:100%;display:block}
.diya .g{position:absolute;left:50%;top:37%;width:62%;height:62%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,205,120,.6),rgba(255,150,60,.2) 45%,transparent 70%);mix-blend-mode:screen;pointer-events:none;animation:dglow 2.6s ease-in-out infinite}
.diya img.f{position:absolute;left:41.6%;top:21.9%;width:16.4%;height:22.5%;transform-origin:50% 100%;filter:drop-shadow(0 0 5px rgba(255,190,90,.85));animation:dsway 3.2s ease-in-out infinite}
@keyframes dsway{0%,100%{transform:rotate(-3deg) scaleY(1)}25%{transform:rotate(2deg) scaleY(1.06)}50%{transform:rotate(4deg) scaleY(.96)}75%{transform:rotate(-1.5deg) scaleY(1.04)}}
@keyframes dglow{0%,100%{opacity:.5;transform:translate(-50%,-50%) scale(.88)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}}
@media (prefers-reduced-motion:reduce){.diya img.f,.diya .g{animation:none}}
.diyaBig{text-align:center;margin:4px 0 10px}
</style>
</head>
<body>
<header><div style="display:flex;align-items:center"><span class="diya" style="--s:44px;margin-right:10px"><img class="b" src="img/diya-base.png" alt=""><span class="g"></span><img class="f" src="img/flame.png" alt=""></span><h1>MASTER CONNECTOR<small id="who">लोड हो रहा है…</small></h1></div><button class="sec sm hidden" id="logoutBtn">लॉग आउट</button></header>

<div id="toast" class="toast hidden"></div>
<div id="popup" class="popup hidden"></div>

<script type="module">

import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, createUserWithEmailAndPassword, sendPasswordResetEmail, GoogleAuthProvider, signInWithPopup, linkWithCredential, EmailAuthProvider, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { initializeFirestore, getFirestore, writeBatch, persistentLocalCache, persistentMultipleTabManager, collection, doc, getDoc, getDocs, setDoc, addDoc, updateDoc, deleteDoc, onSnapshot, query, where, orderBy, limit, serverTimestamp, Timestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyApw_GttyXeEmHFvKlJjoQFI11KuL4ahxI",
  authDomain: "master-connector-f2a0d.firebaseapp.com",
  projectId: "master-connector-f2a0d",
  storageBucket: "master-connector-f2a0d.firebasestorage.app",
  messagingSenderId: "542800382335",
  appId: "1:542800382335:web:8bf9d3ac9ad3b7906bb24a"
};
const OWNER_UID = "Y7u25ODNNLOFBiiePyM7oR7Ts6n2";

const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
setPersistence(auth, browserLocalPersistence).catch(()=>{});
let db;
try { db = initializeFirestore(fbApp, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) }); }
catch(e){ db = initializeFirestore(fbApp, {}); }

const $ = s => document.querySelector(s);
const app = $("#app"), nav = $("#nav");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const linkify = s => esc(s).replace(/(https?:\/\/[^\s]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.remove("hidden"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.add("hidden"),2600); }
const toD = v => v?.toDate ? v.toDate() : (v instanceof Date ? v : null);
const fmtT = v => { const d=toD(v); return d ? d.toLocaleTimeString("hi-IN",{hour:"2-digit",minute:"2-digit"}) : "—"; };
const fmtD = v => { const d=toD(v); return d ? d.toLocaleDateString("hi-IN",{day:"numeric",month:"short"}) : ""; };
const fmtDur = (a,b) => { const s=toD(a), e=toD(b)||new Date(); if(!s) return ""; const m=Math.max(0,Math.round((e-s)/60000)); return `${Math.floor(m/60)} घं ${m%60} मि`; };
const shiftName = s => s==="evening" ? "शाम" : "सुबह";
// मोबाइल नंबर से लॉगिन (DIP Master AI के हायरिंग लिंक से जुड़े वर्कर) — वही तरीका जो DIP Control Panel में है
const MOB_DOMAIN = "worker.masterconnector.app";
const mobDigits = x => { let d=String(x||"").replace(/[\s\-+]/g,""); if(/^91\d{10}$/.test(d)) d=d.slice(2); if(/^0\d{10}$/.test(d)) d=d.slice(1); return /^[6-9]\d{9}$/.test(d) ? d : ""; };
const loginId = x => { const d=mobDigits(x); return d ? d+"@"+MOB_DOMAIN : String(x||"").trim(); };
const showId = e => String(e||"").endsWith("@"+MOB_DOMAIN) ? "📱 "+e.split("@")[0] : (e||"");
const APK_URL = "https://github.com/thakurdip881-cloud/master-connector/releases/latest/download/MasterConnector.apk";
const JOIN_CODE = new URLSearchParams(location.search).get("join") || "";
const newCode = () => { const a=new Uint8Array(15); crypto.getRandomValues(a); return btoa(String.fromCharCode(...a)).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); };
// फ़ोटो छोटी करके (कम डेटा) base64 — Firebase Storage नहीं (वो फ़्री नहीं)
const shrink = (file, max=640, q=0.6) => new Promise((res,rej) => { if(!file) return rej(new Error("no file")); const r=new FileReader(); r.onload=()=>{ const im=new Image(); im.onload=()=>{ const k=Math.min(1,max/Math.max(im.width,im.height)); const c=document.createElement("canvas"); c.width=Math.round(im.width*k); c.height=Math.round(im.height*k); c.getContext("2d").drawImage(im,0,0,c.width,c.height); res(c.toDataURL("image/jpeg",q)); }; im.onerror=rej; im.src=r.result; }; r.onerror=rej; r.readAsDataURL(file); });
const ageYears = d => { const b=new Date(d); if(isNaN(b)) return -1; const n=new Date(); let a=n.getFullYear()-b.getFullYear(); if(n<new Date(n.getFullYear(),b.getMonth(),b.getDate())) a--; return a; };
const ID_TYPES = {aadhaar:"आधार कार्ड", pan:"PAN कार्ड", voter:"वोटर ID", dl:"ड्राइविंग लाइसेंस"};
const DIYA = sz => `<div class="diyaBig"><span class="diya" style="--s:${sz}px"><img class="b" src="img/diya-base.png" alt=""><span class="g"></span><img class="f" src="img/flame.png" alt=""></span></div>`;
const DIP_PANEL = "https://github-netlify-deploy-0cc412.netlify.app/admin.html";
const NATIVE = window.MCNative || null;   // Android ऐप के अंदर: फ़ोन लॉक होने पर भी duty location जाँच
const LIMIT_KM = 2;
const kmBetween = (a,b,c,d) => { const R=6371, r=x=>x*Math.PI/180; const h=Math.sin(r(c-a)/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(r(d-b)/2)**2; return 2*R*Math.asin(Math.sqrt(h)); };
const getPos = () => new Promise(res => { if(!navigator.geolocation) return res(null); navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lng:p.coords.longitude}), ()=>res(null), {enableHighAccuracy:true,timeout:15000,maximumAge:60000}); });
const errMsg = e => { const c=e?.code||""; if(c.includes("invalid-credential")||c.includes("wrong-password")||c.includes("user-not-found")) return "ईमेल या पासवर्ड गलत है"; if(c.includes("email-already-in-use")) return "ये ईमेल पहले से इस्तेमाल में है"; if(c.includes("weak-password")) return "पासवर्ड कम से कम 6 अक्षर का रखें"; if(c.includes("invalid-email")) return "ईमेल सही नहीं है"; if(c.includes("permission-denied")) return "इसकी अनुमति नहीं है"; if(c.includes("network")) return "इंटरनेट नहीं है"; return e?.message || "कुछ गड़बड़ हुई"; };

let me = null, profile = null, isOwner = false, canEdit = false, tab = null, unsubs = [];
const clearSubs = () => { unsubs.forEach(u=>{try{u()}catch(e){}}); unsubs = []; };
const sub = u => unsubs.push(u);

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});

$("#logoutBtn").onclick = async () => { if(confirm("लॉग आउट करें?")) { clearSubs(); await signOut(auth); } };

function showLogin(){
  try{ window.DipVoiceAI?.remove(); }catch(e){}
  clearSubs(); nav.classList.add("hidden"); $("#logoutBtn").classList.add("hidden"); $("#who").textContent = "लॉगिन करें";
  app.innerHTML = `<div class="card">${DIYA(140)}<h3>लॉगिन</h3>
    <label>मोबाइल नंबर या ईमेल</label><input id="em" autocomplete="username">
    <label>पासवर्ड</label><input id="pw" type="password" autocomplete="current-password">
    <div style="margin-top:14px"><button id="go" style="width:100%">लॉगिन करें</button></div>
    <div style="margin-top:10px"><button id="gl" style="width:100%;background:#fff;color:#1a56a8;border:2px solid #1a56a8">🔗 Google से लॉगिन</button></div>
    <p class="muted" style="margin-top:12px">नए वर्कर: एडमिन से हायरिंग लिंक लेकर अकाउंट बनाएँ, फिर उसी मोबाइल नंबर और पासवर्ड से यहाँ लॉगिन करें। पासवर्ड भूल गए? <a href="#" id="fp">रीसेट लिंक भेजें</a></p></div>`;
  $("#go").onclick = async () => { const b=$("#go"); b.disabled=true; try{ await signInWithEmailAndPassword(auth,loginId($("#em").value),$("#pw").value); }catch(e){ toast(errMsg(e)); } b.disabled=false; };
  $("#gl").onclick = async () => { try{ await signInWithPopup(auth, new GoogleAuthProvider()); }catch(e){ if(!String(e.code||"").includes("popup-closed")) toast(String(e.code||"").includes("web-storage")||String(e.code||"").includes("operation-not-supported") ? "ऐप में Google लॉगिन नहीं चलता — Chrome में साइट खोलकर करें, या एडमिन से पासवर्ड लें" : errMsg(e)); } };
  $("#pw").onkeydown = e => { if(e.key==="Enter") $("#go").click(); };
  $("#fp").onclick = async e => { e.preventDefault(); const em=$("#em").value.trim(); if(!em) return toast("पहले ईमेल लिखें"); if(mobDigits(em)) return toast("मोबाइल वाले अकाउंट का पासवर्ड एडमिन से बदलवाएँ"); try{ await sendPasswordResetEmail(auth,em); toast("रीसेट लिंक ईमेल पर भेजा गया"); }catch(err){ toast(errMsg(err)); } };
}

/* ---------- वर्कर खुद जुड़े: WhatsApp वाला लिंक (?join=CODE) ---------- */
async function showJoin(){
  clearSubs(); nav.classList.add("hidden"); $("#logoutBtn").classList.add("hidden"); $("#who").textContent = "नया वर्कर";
  app.innerHTML = `<div class="card">लिंक जाँच रहा है…</div>`;

  try{ const s = await getDoc(doc(db,"invites",JOIN_CODE)); inv = s.exists() ? s.data() : null; }catch(e){}

  if(!inv || expired){ app.innerHTML = `<div class="card"><h3>लिंक काम नहीं कर रहा</h3><p class="muted">${!inv?"यह लिंक सही नहीं है।":inv.used?"यह लिंक पहले ही इस्तेमाल हो चुका है।":"इस लिंक का समय खत्म हो गया।"} एडमिन से नया लिंक माँगें।</p><button class="sec" id="toLogin" style="width:100%">लॉगिन पेज</button></div>`; $("#toLogin").onclick=()=>{ location.href=location.pathname; }; return; }

  app.innerHTML = `<div class="card">${DIYA(140)}<h3>👋 MASTER CONNECTOR में जुड़ें</h3>

    <label class="req">ईमेल ID (Gmail — एक बार जोड़ें)</label><button type="button" id="jg" style="width:100%;background:#fff;color:#1a56a8;border:2px solid #1a56a8">🔗 Google से ईमेल जोड़ें</button><input id="je" type="email" readonly placeholder="ऊपर बटन दबाएँ — ईमेल अपने-आप आएगा" style="margin-top:6px"><p class="muted" id="jgHint">आपकी Gmail आपके अकाउंट से जुड़ जाएगी — बाद में इसी से भी लॉगिन कर सकेंगे।</p>
    <label class="req">📍 घर की लाइव लोकेशन (घर पर रहकर फ़ॉर्म भरें)</label>
    <button type="button" id="jhl" style="width:100%;background:#fff;color:#0a7d3b;border:2px solid #0a7d3b">📍 लाइव लोकेशन लें</button>
    <p class="muted" id="jhlHint">Location चालू करें और Allow दें — पता अपने-आप भर जाएगा।</p>
    <label class="req">🏠 घर का पूरा पता (जाँच लें, मकान नं. जोड़ें)</label><textarea id="jad" rows="2" maxlength="200" placeholder="मकान नं., गली, गाँव/शहर, ज़िला, पिन कोड"></textarea>
    <label>✈️ Telegram ID (अगर है)</label><input id="jtg" placeholder="@username" autocapitalize="none" autocomplete="off">

    <label class="req">ID की फ़ोटो (सामने वाला हिस्सा)</label><input id="jf" type="file" accept="image/*" capture="environment">

/* ---------- COMMANDS (DIP Master AI Control Panel के कमांड बोर्ड वाला ही डेटा) ----------
   कमांड: {text, to:'all'|uid, toName, kind:'msg'|'duty'|'link', ref:link, autoOpen, by:uid, byName, createdAt}
   जवाब:  acks/{कमांडID_यूज़रID} = {cmd, uid, name, status:'seen'|'done', at} */
const cmdLink = c => { const l = c.ref || c.link || ""; return /^https?:\/\//.test(l) ? l : ""; };
const cmdTo = c => c.to || c.target || "all";
const myCmdQuery = () => query(collection(db,"commands"),where("to","in",["all",me.uid]),limit(100));
const sortCmds = s => s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(toD(b.createdAt)||9e15)-(toD(a.createdAt)||9e15));
const ack = (id,status) => setDoc(doc(db,"acks",id+"_"+me.uid),{cmd:id,uid:me.uid,name:profile?.name||me.email,status,at:serverTimestamp()});
let myAcks = {};
function watchCommands(){
  if(canEdit) return;
  let first = true;
  sub(onSnapshot(query(collection(db,"acks"),where("uid","==",me.uid),limit(500)), s => { myAcks={}; s.docs.forEach(d=>{ const a=d.data(); myAcks[a.cmd]=a.status; }); }, ()=>{}));
  sub(onSnapshot(myCmdQuery(), s => {
    const seen=JSON.parse(localStorage.getItem("mc_seen")||"[]");
    if(first) sortCmds(s).filter(c=>!seen.includes(c.id)&&!myAcks[c.id]).slice(0,5).reverse().forEach(c=>showCommandPopup(c.id,c));
    else s.docChanges().forEach(ch=>{ if(ch.type==="added" && !seen.includes(ch.doc.id)) showCommandPopup(ch.doc.id,ch.doc.data()); });
    first = false;
  }, ()=>{}));
}
function markSeen(id){ const seen=JSON.parse(localStorage.getItem("mc_seen")||"[]"); if(!seen.includes(id)){ seen.push(id); localStorage.setItem("mc_seen",JSON.stringify(seen.slice(-300))); } if(myAcks[id]!=="done") ack(id,"seen").catch(()=>{}); }
function showCommandPopup(id,c){
  const p=$("#popup"); if(!p.classList.contains("hidden")) { setTimeout(()=>showCommandPopup(id,c),1500); return; }
  try{ navigator.vibrate?.([300,150,300]); }catch(e){}
  const link = cmdLink(c);
  p.innerHTML = `<div class="card"><div class="between"><h3 style="margin:0">📢 एडमिन की कमांड</h3><span class="muted">${fmtT(c.createdAt)}</span></div>
    <p style="font-size:18px;white-space:pre-wrap">${linkify(c.text)}</p>
    ${link?`<p><a href="${esc(link)}" target="_blank" rel="noopener">${esc(link)}</a></p>`:""}
    <div class="row">${link?`<button class="sec" id="cOpen">खोलें</button>`:""}<button class="sec" id="cOk">देख लिया</button><button class="ok" id="cDone">✅ हो गया</button></div></div>`;
  p.classList.remove("hidden");
  const close = () => { markSeen(id); p.classList.add("hidden"); };
  $("#cOk").onclick = close;
  $("#cDone").onclick = () => { close(); ack(id,"done").then(()=>toast("✅ एडमिन को बता दिया")).catch(e=>toast(errMsg(e))); };
  if(link) $("#cOpen").onclick = () => { close(); window.open(link,"_blank"); };
  if(link && c.autoOpen){ close(); window.open(link,"_blank"); }
}
function pageCmd(){
  app.innerHTML = `${canEdit?`<div class="card"><h3>नई कमांड भेजें</h3>
    <label>किसे</label><select id="ct"><option value="all">सभी वर्कर</option></select>
    <label>संदेश / काम</label><textarea id="cx" maxlength="1000" placeholder="जैसे: आज 10 बजे सभी ट्रेनिंग कॉल पर आएँ"></textarea>

    <label class="row" style="color:var(--ink)"><input type="checkbox" id="ca" style="width:auto;flex:none"> <span>वर्कर के फ़ोन पर लिंक अपने आप खुल जाए</span></label>
    <div style="margin-top:12px"><button id="cs" style="width:100%">भेजें</button></div>
    <p class="muted">यही कमांड DIP Master AI के ऐप बोर्ड (👷) में भी दिखती है।</p></div>`:""}
    <div class="card"><h3>${canEdit?"भेजी गई कमांड":"मेरी सूचनाएँ"}</h3><div class="list" id="clist"></div></div>`;

      return `<div><div class="between"><span class="muted">${fmtD(c.createdAt)} ${fmtT(c.createdAt)} · ${to==="all"?"सभी":esc(c.toName||users.find(u=>u.id===to)?.name||"एक वर्कर")}${c.byName?" · "+esc(c.byName):""}</span>${canEdit?`<button class="sec sm" data-del="${c.id}">हटाएँ</button>`:""}</div>
      <div style="white-space:pre-wrap;margin-top:4px">${linkify(c.text)}</div>${link?`<a href="${esc(link)}" target="_blank" rel="noopener">${esc(link)}</a>`:""}
      ${canEdit?`<div class="muted" style="margin-top:4px">✅ हो गया: ${dn.length}/${to==="all"?act:1}${dn.length?" ("+esc(dn.map(a=>a.name).join(", "))+")":""}<br>👁 सिर्फ़ देखा: ${sn.length}${sn.length?" ("+esc(sn.map(a=>a.name).join(", "))+")":""}</div>`
        : mine==="done"?`<span class="pill ok">✅ हो गया</span>`:`<button class="ok sm" data-done="${c.id}" style="margin-top:6px">✅ हो गया</button>`}</div>`; }).join("") || `<p class="muted">अभी कुछ नहीं</p>`;
    el.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{ if(!confirm("ये कमांड हटाएँ?")) return; const id=b.dataset.del;
      try{ await deleteDoc(doc(db,"commands",id)); acks.filter(a=>a.cmd===id).forEach(a=>deleteDoc(doc(db,"acks",id+"_"+a.uid)).catch(()=>{})); }catch(e){ toast(errMsg(e)); } });
    el.querySelectorAll("[data-done]").forEach(b=>b.onclick=async()=>{ b.disabled=true; try{ await ack(b.dataset.done,"done"); myAcks[b.dataset.done]="done"; markSeen(b.dataset.done); draw(); toast("✅ एडमिन को बता दिया"); }catch(e){ toast(errMsg(e)); b.disabled=false; } });
  };
  if(canEdit){
    psub(onSnapshot(collection(db,"users"), s => { users = s.docs.map(d=>({id:d.id,...d.data()})); const sel=$("#ct"); if(!sel) return; const v=sel.value; sel.innerHTML=`<option value="all">सभी वर्कर</option>`+users.filter(u=>u.id!==OWNER_UID&&u.role!=="admin").map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join(""); sel.value=v||"all"; draw(); }));
    psub(onSnapshot(query(collection(db,"acks"),orderBy("at","desc"),limit(1500)), s => { acks=s.docs.map(d=>d.data()); draw(); }, ()=>{}));
    $("#cs").onclick = async () => {
      const text=$("#cx").value.trim(), link=$("#cl").value.trim();
      if(!text) return toast("संदेश लिखें");
      if(link && !/^https:\/\//.test(link)) return toast("लिंक https:// से शुरू होना चाहिए");
      const to=$("#ct").value, u=users.find(x=>x.id===to);
      try{ await addDoc(collection(db,"commands"),{text,to,toName:u?u.name:"सब",kind:link?"link":"msg",ref:link,autoOpen:$("#ca").checked,by:me.uid,byName:profile.name||"Admin",createdAt:serverTimestamp()}); $("#cx").value="";$("#cl").value="";$("#ca").checked=false; toast("कमांड भेजी गई"); }catch(e){ toast(errMsg(e)); }
    };
    psub(onSnapshot(query(collection(db,"commands"),orderBy("createdAt","desc"),limit(60)), s => { rows=sortCmds(s); draw(); }, e=>toast(errMsg(e))));
  } else {
    psub(onSnapshot(myCmdQuery(), s => { rows=sortCmds(s); rows.forEach(c=>{ if(!myAcks[c.id]) markSeen(c.id); }); draw(); }, e=>toast(errMsg(e))));
  }
}

    const rows=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.at&&b.at.toMillis?b.at.toMillis():0)-(a.at&&a.at.toMillis?a.at.toMillis():0));
    el.innerHTML = rows.map(v=>`<div><div class="between"><span><b>${esc(v.name||"")}</b> · ${esc(v.mobile||"")}<br><span class="pill warn">${+v.plan||30} दिन</span><span class="muted"> ${esc(v.id)}${v.at?" · "+fmtD(v.at):""}</span></span></div>
      <div class="row" style="margin-top:6px"><button class="ok sm" data-pg="${esc(v.id)}" data-d="${+v.plan||30}" data-n="${esc(v.name||"")}">✅ प्लान दें</button><a class="sec sm" style="text-decoration:none;padding:6px 10px;border-radius:8px" href="tel:${esc(v.mobile||"")}">📞 कॉल</a><button class="sec sm" data-px="${esc(v.id)}">🗑️ हटाएँ</button></div></div>`).join("") || `<p class="muted">अभी कोई अर्ज़ी नहीं</p>`;
    el.querySelectorAll("[data-pg]").forEach(b=>b.onclick=async()=>{ if(!confirm(`${b.dataset.pg} को ${b.dataset.d} दिन का प्लान दें?`)) return; await give(b.dataset.pg,+b.dataset.d,b.dataset.n); deleteDoc(doc(db,"dipPlanReq",b.dataset.pg)).catch(()=>{}); });
    el.querySelectorAll("[data-px]").forEach(b=>b.onclick=()=>{ if(confirm("यह अर्ज़ी हटाएँ?")) deleteDoc(doc(db,"dipPlanReq",b.dataset.px)).catch(e=>toast(errMsg(e))); });
  }, e=>toast(errMsg(e))));
  $("#pvGo").onclick = () => { give($("#pvId").value,+$("#pvD").value,$("#pvN").value.trim()); $("#pvId").value=""; $("#pvN").value=""; };
  psub(onSnapshot(query(collection(db,"dipDevices"),limit(500)), s => {
    const el=$("#dvl"); if(!el) return; const now=Date.now(), td=(ctl.trialDays||7)*864e5;
    const rows=s.docs.map(d=>{ const v=d.data(), ex=v.exp&&v.exp.toMillis?v.exp.toMillis():0, fs=v.firstSeen&&v.firstSeen.toMillis?v.firstSeen.toMillis():0;
      const left = ex ? ex-now : (fs ? fs+td-now : 0); const st = v.on===false ? '<span class="pill bad">बंद किया</span>'
        : ex ? (left>0?`<span class="pill ok">प्लान · ${Math.ceil(left/864e5)} दिन बाकी</span>`:'<span class="pill bad">प्लान खत्म</span>')
        : (ctl.trial===false?'<span class="pill bad">ट्रायल बंद</span>':left>0?`<span class="pill warn">ट्रायल · ${Math.ceil(left/864e5)} दिन बाकी</span>`:'<span class="pill bad">ट्रायल खत्म</span>');
      return {left, html:`<div><div class="between"><span><b>${esc(d.id)}</b> ${v.name?esc(v.name):""}<br>${st}<span class="muted"> ${fs?"पहली बार: "+fmtD(v.firstSeen):""}${ex?" · तक: "+fmtD(v.exp):""}</span></span></div>
        <div class="row" style="margin-top:6px"><button class="sec sm" data-g="${d.id}" data-d="30">+30</button><button class="sec sm" data-g="${d.id}" data-d="90">+90</button><button class="sec sm" data-g="${d.id}" data-d="180">+180</button><button class="sec sm" data-t="${d.id}" data-v="${v.on===false?1:0}">${v.on===false?"चालू":"बंद"}</button></div></div>`}; });
    rows.sort((a,b)=>a.left-b.left);
    el.innerHTML = rows.map(r=>r.html).join("") || `<p class="muted">अभी किसी ग्राहक ने ऐप नहीं खोला</p>`;
    el.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>give(b.dataset.g,+b.dataset.d));
    el.querySelectorAll("[data-t]").forEach(b=>b.onclick=async()=>{ try{ await setDoc(doc(db,"dipDevices",b.dataset.t),{on:b.dataset.v==="1"},{merge:true}); }catch(e){ toast(errMsg(e)); } });
  }, e=>toast(errMsg(e))));
}

/* ---------- 🎙️ बोलकर पूछें (voice-ai.js) — फ़्री, फ़ोन पर ही; सिर्फ़ पूछने पर Firebase से ताज़ा जानकारी ---------- */
let vaTry=0;
function startVoiceAI(){
  if(!window.DipVoiceAI){ if(vaTry++<20) setTimeout(startVoiceAI,500); return; }
  DipVoiceAI.init({ title: canEdit ? "MASTER CONNECTOR" : "मेरा काम", bottom: 78,
    chips: canEdit ? ["कितने काम बाकी हैं?","कौन ड्यूटी पर है?","कौन दूर है?","आज का हाल बताओ"] : ["मेरे कितने आदेश बाकी हैं?","मेरी ड्यूटी का हाल","आज का हाल बताओ"],
    facts: async () => {
      const F = [], now = new Date(), day0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const acksQ = canEdit ? query(collection(db,"acks"),orderBy("at","desc"),limit(1500)) : query(collection(db,"acks"),where("uid","==",me.uid),limit(500));
      const cmdQ = canEdit ? query(collection(db,"commands"),orderBy("createdAt","desc"),limit(30)) : myCmdQuery();
      const dutyQ = canEdit ? query(collection(db,"duty"),orderBy("start","desc"),limit(80)) : query(collection(db,"duty"),where("uid","==",me.uid));
      const [cs, as, ds] = await Promise.all([getDocs(cmdQ), getDocs(acksQ), getDocs(dutyQ)]);
      const acks = as.docs.map(d=>d.data()), duty = ds.docs.map(d=>({id:d.id,...d.data()}));
      const open = duty.filter(r=>!r.end), far = open.filter(r=>r.awayKm>LIMIT_KM);
      if(canEdit){
        const us = await getDocs(collection(db,"users")), users = us.docs.map(d=>({id:d.id,...d.data()})).filter(u=>u.id!==OWNER_UID && u.role!=="admin");
        const todayIn = new Set(duty.filter(r=>{const t=toD(r.start); return t && t>=day0;}).map(r=>r.uid));
        const absent = users.filter(u=>u.active!==false && u.status!=="pending" && !todayIn.has(u.id));
        F.push({t:`${open.length} वर्कर अभी ड्यूटी पर हैं`, d: open.map(r=>`${r.name} (${shiftName(r.shift)}, ${fmtT(r.start)} से${r.awayKm?`, ${r.awayKm} km`:""})`).join(", "), s:"info", k:"ड्यूटी कौन चालू"});
        F.push({t: far.length ? `⚠️ ${far.length} वर्कर ड्यूटी की जगह से ${LIMIT_KM} km से दूर हैं` : "कोई वर्कर दूर नहीं है", d: far.map(r=>`${r.name} — ${r.awayKm} km`).join(", "), s: far.length?"baki":"info", k:"दूर ड्यूटी जगह location"});
        F.push({t: absent.length ? `आज ${absent.length} वर्कर ड्यूटी पर नहीं आए` : "आज सभी वर्कर ड्यूटी पर आ चुके हैं", d: absent.map(u=>`${u.name} (${shiftName(u.shift)})`).join(", "), s: absent.length?"baki":"info", k:"ड्यूटी नहीं आए गैरहाज़िर absent"});
        const pend = users.filter(u=>u.status==="pending");
        if(pend.length) F.push({t:`${pend.length} नए वर्कर की मंज़ूरी बाकी है`, d: pend.map(u=>u.name).join(", ")+" — 👥 टीम टैब में मंज़ूर करें", s:"baki", k:"वर्कर मंज़ूरी नया फ़ॉर्म join"});
        cs.docs.forEach(d=>{ const c=d.data(), dn=acks.filter(a=>a.cmd===d.id && a.status==="done");
          const need = c.to==="all" ? users.filter(u=>u.active!==false).length : 1, ok = dn.length>=need;
          F.push({t:`आदेश "${c.text}" (${c.toName||"सब"})`, d: ok ? "सबने कर दिया" : `${dn.length}/${need} ने ✅ किया`+(dn.length?` — ${dn.map(a=>a.name).join(", ")}`:""), s: ok?"done":"baki", k:"आदेश"}); });
      } else {
        const mine = {}; acks.forEach(a=>{ mine[a.cmd]=a.status; });
        cs.docs.forEach(d=>{ const c=d.data(); F.push({t:`आदेश: ${c.text}`, d: c.byName?`${c.byName} ने भेजा`:"", s: mine[d.id]==="done"?"done":"baki", k:"आदेश मेरा"}); });
        const o = open[0];
        F.push({t: o ? `आपकी ड्यूटी चालू है (${fmtT(o.start)} से)` : "आपकी ड्यूटी अभी बंद है", d: o && o.awayKm>LIMIT_KM ? `⚠️ आप ड्यूटी की जगह से ${o.awayKm} km दूर हैं` : "", s: o && o.awayKm>LIMIT_KM ? "baki" : "info", k:"ड्यूटी मेरी"});
      }
      return F;
    }});
}
</script>
<script src="voice-ai.js" defer></script>
