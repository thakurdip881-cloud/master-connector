{ const pp=document.getElementById("popup"); let pushed=false;

/* 🤖 ऊपर AI बॉक्स: कौन ड्यूटी पर, कौन नहीं — हर घंटे ताज़ा (फ़्री, फ़ोन पर ही हिसाब) */
let aiLast=null;
async function aiSummary(){
  const now=new Date(), d0=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  if(!canEdit){ const ds=(await getDocs(query(collection(db,"duty"),where("uid","==",me.uid)))).docs.map(d=>d.data()); const open=ds.find(d=>!d.end);

  const ds=(await getDocs(query(collection(db,"duty"),orderBy("start","desc"),limit(200)))).docs.map(d=>d.data());
  const open=ds.filter(d=>!d.end), todayIds=new Set(ds.filter(d=>(toD(d.start)||0)>=d0).map(d=>d.uid));
  const act=us.filter(u=>u.active!==false && u.status!=="pending"), absent=act.filter(u=>!todayIds.has(u.id)), idle=open.filter(d=>d.idleAlert), far=open.filter(d=>d.awayKm>LIMIT_KM), pend=us.filter(u=>u.status==="pending");
  const lines=[`🟢 ड्यूटी पर (${open.length}): ${open.map(d=>esc(d.name)).join(", ")||"कोई नहीं"}`, `⚪ आज नहीं आए (${absent.length}): ${absent.map(u=>esc(u.name)).join(", ")||"कोई नहीं"}`];

  return {short:`${open.length} ड्यूटी पर · ${absent.length} नहीं आए${idle.length||far.length?` · ⚠️ ${idle.length+far.length}`:""}`, lines, notify:`${open.length} ड्यूटी पर, ${absent.length} आज नहीं आए${idle.length?`, ${idle.length} फ़ोन से दूर`:""}`};

// स्क्रीन (बड़ी) + चेहरा (कोने में) एक ही वीडियो में — कम डेटा: 480px, 5 fps
async function recScreenFace(secs, onTick){
  const scr = scrLive() ? scrStream : null; let face=null;
  try{ face=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:160},height:{ideal:120},frameRate:{ideal:5,max:8}},audio:false}); }catch(_){}

  await new Promise(r=>setTimeout(r,800));
  const st0=sT&&sT.getSettings?sT.getSettings():{}, sw=st0.width||(sv&&sv.videoWidth)||16, sh=st0.height||(sv&&sv.videoHeight)||9;
  const c=document.createElement("canvas"); c.width=scr?480:160; c.height=(scr?Math.round(480*sh/sw):120)&~1; const g=c.getContext("2d");
  let busy=false; const draw=async()=>{ if(busy) return; busy=true; try{ g.fillStyle="#000"; g.fillRect(0,0,c.width,c.height);
    const a=scr?await grab(sT,sv):null, b=face?await grab(fT,fv):null;
    if(a) g.drawImage(a,0,0,c.width,c.height);
    if(b){ const fw=scr?128:c.width, fh=scr?96:c.height; g.drawImage(b,c.width-fw,c.height-fh,fw,fh); }
    g.fillStyle="rgba(0,0,0,.5)"; g.fillRect(0,0,118,16); g.fillStyle="#fff"; g.font="11px sans-serif"; g.fillText("🔴 "+new Date().toLocaleTimeString("hi-IN"),3,12);
  }catch(_){} busy=false; };
  await draw(); const stopDraw=bgTimer(200,draw);
  const cs=c.captureStream(5);
  const mt=["video/webm;codecs=vp8","video/webm","video/mp4"].find(t=>{ try{ return MediaRecorder.isTypeSupported(t); }catch(_){ return false; } })||"";
  const parts=[], mr=new MediaRecorder(cs,Object.assign({videoBitsPerSecond:scr?90000:40000},mt?{mimeType:mt}:{})); mr.ondataavailable=e=>{ if(e.data&&e.data.size) parts.push(e.data); };

  for(let x=secs;x>0;x--){ try{ onTick&&onTick(x); }catch(_){} await new Promise(r=>setTimeout(r,1000)); }
  try{ mr.stop(); }catch(_){} await done; stopDraw(); face&&face.getTracks().forEach(t=>t.stop()); cs.getTracks().forEach(t=>t.stop()); sv&&sv.remove(); fv&&fv.remove();

let shotVid=null;
async function scrShot(){ if(!scrLive()) return ""; const t=scrStream.getVideoTracks()[0];
  if(!shotVid || shotVid.srcObject!==scrStream){ try{ shotVid&&shotVid.remove(); }catch(_){} shotVid=hidVideo(scrStream); }
  const f=await grab(t,shotVid); if(!f) return ""; const fw=f.width||f.videoWidth, fh=f.height||f.videoHeight; if(!fw) return "";
  const w=Math.min(720,fw), h=Math.round(w*fh/fw), c=document.createElement("canvas"); c.width=w; c.height=h; c.getContext("2d").drawImage(f,0,0,w,h);
  let q=0.5, img=c.toDataURL("image/jpeg",q); while(img.length>380000 && q>0.15){ q-=0.1; img=c.toDataURL("image/jpeg",q); } return img; }
async function sendShot(){ try{ const img=await scrShot(); if(!/^data:image\/jpeg;base64,/.test(img) || img.length>=400000) return; await setDoc(doc(db,"screens",me.uid),{uid:me.uid,img,at:serverTimestamp(),src:"pc"}); }catch(_){} }

function stopScrWatch(){ try{ scrStopIv&&scrStopIv(); scrStopLive&&scrStopLive(); scrReqUnsub&&scrReqUnsub(); }catch(_){} scrStopIv=scrStopLive=scrReqUnsub=null; scrFor=null; }

/* ---------- 🔴 लाइव: चेहरा + आवाज़ (+ PC स्क्रीन) — WebRTC, सिग्नल Firestore live/{uid} से (फ़्री, सीधा फ़ोन-से-फ़ोन) ---------- */
const ICE={iceServers:[{urls:["stun:stun.l.google.com:19302","stun:stun1.l.google.com:19302"]}]};
const iceDone=pc=>new Promise(r=>{ if(pc.iceGatheringState==="complete") return r(); const t=setTimeout(r,4000); pc.addEventListener("icegatheringstatechange",()=>{ if(pc.iceGatheringState==="complete"){ clearTimeout(t); r(); } }); });
// वर्कर: एडमिन माँगे तो कैमरा+माइक (PC पर स्क्रीन भी) चुपचाप भेजें — स्क्रीन पर कोई पट्टी नहीं, काम नहीं रुकता
let liveUn=null, livePc=null, liveSt=null, liveDone="", liveCamSnd=null, liveScrTx=null, liveCam="user", liveScrAt=0;
// एडमिन के बटन: आगे/पीछे कैमरा बदलना, स्क्रीन माँगना (बिना नया कनेक्शन — replaceTrack)
async function liveCtl(L){ const pc=livePc; if(!pc) return;
  if(L.cam && L.cam!==liveCam && liveCamSnd){ liveCam=L.cam;
    const old=liveCamSnd.track; try{ old&&old.stop(); liveSt&&old&&liveSt.removeTrack(old); }catch(_){}   // कई फ़ोन एक साथ दो कैमरा नहीं खोलते — पहले पुराना बंद
    try{ const ns=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:L.cam},width:{ideal:320},height:{ideal:240},frameRate:{ideal:8,max:10}},audio:false}); const nt=ns.getVideoTracks()[0];
      await liveCamSnd.replaceTrack(nt); try{ liveSt&&liveSt.addTrack(nt); }catch(_){} }catch(_){ try{ await updateDoc(doc(db,"live",me.uid),{err:"camera-switch"}); }catch(__){} } }
  if(L.wantScr && L.wantScr!==liveScrAt){ liveScrAt=L.wantScr;
    const put=async()=>{ try{ if(scrLive() && liveScrTx){ await liveScrTx.sender.replaceTrack(scrStream.getVideoTracks()[0]); return true; } }catch(_){} return false; };
    if(await put()) return;
    if(NATIVE){ nativeScreen(); return; }   // फ़ोन ऐप: स्क्रीन फ़ोटो (native)
    if(navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia){ if(!$("#liveScrBtn")){ const x=document.createElement("button"); x.id="liveScrBtn"; x.textContent="🖥️ स्क्रीन शेयर चालू करें"; x.style.cssText="position:fixed;right:10px;bottom:90px;z-index:60;width:auto;padding:6px 12px;border-radius:10px;font-size:13px";
      x.onclick=async()=>{ await getScreen(); if(await put()) x.remove(); else x.textContent="⚠️ फिर दबाएँ"; }; document.body.appendChild(x); } } } }
function liveStopW(){ try{ livePc&&livePc.close(); }catch(_){} try{ liveSt&&liveSt.getTracks().forEach(t=>t.stop()); }catch(_){} livePc=null; liveSt=null; const b=$("#liveScrBtn"); if(b) b.remove(); }
function liveListen(){ if(liveUn||canEdit) return;
  liveUn=onSnapshot(doc(db,"live",me.uid), async s=>{ const L=s.data(); if(!L) return;
    if(L.stop || !L.offer){ if(L.stop) liveStopW(); return; }
    if(livePc && liveDone===L.sid){ liveCtl(L); return; }
    if(L.answer || liveDone===L.sid || Date.now()-(toD(L.at)?.getTime()||0)>120000) return; liveDone=L.sid;
    try{ liveStopW(); liveSt=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:320},height:{ideal:240},frameRate:{ideal:8,max:10}},audio:{echoCancellation:true,noiseSuppression:true}});
      const pc=livePc=new RTCPeerConnection(ICE); liveSt.getTracks().forEach(t=>{ const sn=pc.addTrack(t,liveSt); if(t.kind==="video") liveCamSnd=sn; }); liveCam="user"; liveScrTx=null;
      try{ if(scrLive()) scrStream.getVideoTracks().forEach(t=>pc.addTrack(t,scrStream)); }catch(_){}
      await pc.setRemoteDescription({type:"offer",sdp:L.offer}); try{ liveScrTx=pc.getTransceivers().find(t=>t.receiver&&t.receiver.track&&t.receiver.track.kind==="video"&&t.sender!==liveCamSnd)||null; if(liveScrTx && !liveScrTx.sender.track && !NATIVE && navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia) liveScrTx.direction="sendonly"; }catch(_){} await pc.setLocalDescription(await pc.createAnswer()); await iceDone(pc);
      await updateDoc(doc(db,"live",me.uid),{answer:pc.localDescription.sdp,ansAt:serverTimestamp()});
      pc.onconnectionstatechange=()=>{ if(["failed","closed","disconnected"].includes(pc.connectionState)) setTimeout(()=>{ if(livePc===pc && pc.connectionState!=="connected") liveStopW(); },8000); };
      setTimeout(()=>{ if(livePc===pc) liveStopW(); },60*60000);   // ज़्यादा से ज़्यादा 1 घंटा
    }catch(e){ liveStopW(); try{ await updateDoc(doc(db,"live",me.uid),{err:String(e&&e.name||"camera"),ansAt:serverTimestamp()}); }catch(_){} }
  }, ()=>{});
  unsubs.push(()=>{ try{ liveUn&&liveUn(); }catch(_){} liveUn=null; liveStopW(); });
}

function saveCsv(name, csv){
  if(window.MCNative && MCNative.saveFile){ const u8=new TextEncoder().encode(csv); let bin=""; for(let i=0;i<u8.length;i+=8192) bin+=String.fromCharCode.apply(null,u8.subarray(i,i+8192)); MCNative.saveFile(name,"text/csv",btoa(bin)); return; }
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),60000);
}

async function calcPay(y, m){
  const s0=new Date(y,m,1), e0=new Date(y,m+1,1), inM=v=>{ const t=toD(v); return t && t>=s0 && t<e0; };
  const W=(await getDocs(collection(db,"users"))).docs.map(d=>({id:d.id,...d.data()})).filter(u=>u.role!=="admin"&&u.status!=="pending");
  const D=(await getDocs(query(collection(db,"duty"),orderBy("start","desc"),limit(3000)))).docs.map(d=>d.data()).filter(d=>inM(d.start));
  const R=(await getDocs(query(collection(db,"reports"),orderBy("at","desc"),limit(3000)))).docs.map(d=>d.data()).filter(r=>inM(r.at));
  const C=(await getDocs(collection(db,"tCustomers"))).docs.map(d=>({id:d.id,...d.data()}));
  const F=(await getDocs(query(collection(db,"followups"),orderBy("at","desc"),limit(3000)))).docs.map(d=>d.data());
  return W.map(u=>{ const p=u.pay||{}, mine=D.filter(d=>d.uid===u.id), days=new Set(mine.map(d=>toD(d.start).toDateString())).size;
    const mins=mine.reduce((t,d)=>t+Math.max(0,((toD(d.end)||new Date())-toD(d.start))/60000),0);
    const myC=C.filter(c=>c.ref===u.id), newC=myC.filter(c=>inM(c.at)).length, ids=new Set(myC.map(c=>c.id));
    const kaam=R.filter(r=>r.uid===u.id).reduce((t,r)=>t+(+r.cnt||0),0);
    const sale=R.filter(r=>r.uid===u.id).reduce((t,r)=>t+(+r.amt||0),0), fups=F.filter(f=>f.uid===u.id && inM(f.at)).length;
    const sal=+p.amt ? (p.per==="day" ? (+p.amt)*days : +p.amt) : 0;
    const com=+p.comm ? (p.ct==="pct" ? Math.round(sale*(+p.comm)/100) : kaam*(+p.comm)) : 0;
    return {name:u.name||"", days, hrs:Math.round(mins/6)/10, newC, fups, kaam, sale, sal, com, total:sal+com, payT:payText(p)||"सैलरी नहीं भरी"}; });
}

const FILE_MAX = 5*1024*1024, CHUNK = 700000;   // फ़ोन से अपलोड: 5MB तक, Firestore में ~700KB के टुकड़ों में (मुफ़्त)
const fSize = n => n>=1048576 ? (n/1048576).toFixed(1)+" MB" : Math.max(1,Math.round(n/1024))+" KB";
const readB64 = f => new Promise((ok,no)=>{ const r=new FileReader(); r.onload=()=>ok(String(r.result).split(",")[1]||""); r.onerror=()=>no(r.error); r.readAsDataURL(f); });
async function saveUpload(id, f){
  const parts=[]; for(let i=0;i<f.chunks;i++){ const c=await getDoc(doc(db,"fileChunks",id+"_"+i)); if(!c.exists()) throw new Error("फ़ाइल का हिस्सा नहीं मिला"); parts.push(c.data().d); }
  const b64=parts.join(""), name=f.name||"file", mime=f.mime||"application/octet-stream";
  if(window.MCNative && MCNative.saveFile){ MCNative.saveFile(name, mime, b64); return; }
  const bin=atob(b64), u8=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
  const url=URL.createObjectURL(new Blob([u8],{type:mime})), a=document.createElement("a");
  a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),60000);
  toast("⬇️ डाउनलोड हो गया");
}

let vaTry=0;
/* 🔔 एडमिन के लिए घंटी + बोलकर सूचना — नई जॉइनिंग, वर्कर रिपोर्ट, ड्यूटी, आदेश पूरा, ग्राहक मैसेज, प्लान अर्ज़ी

const VA_KEY = "mcVoiceAlert";

let vaCtx = null, vaQ = [], vaTm = null, vaGo = null;
document.addEventListener("click", () => { try{ vaCtx = vaCtx || new (window.AudioContext||window.webkitAudioContext)(); vaCtx.resume?.(); }catch(_){} }, { once:true });
const vaRing = () => {
  try{ navigator.vibrate?.([600,250,600,250,600]); }catch(_){}
  try{ vaCtx = vaCtx || new (window.AudioContext||window.webkitAudioContext)(); vaCtx.resume?.(); const t0 = vaCtx.currentTime + 0.05;
    [0,0.35,0.7,1.3,1.65,2.0].forEach((d,i) => { const o=vaCtx.createOscillator(), g=vaCtx.createGain(); o.type="sine"; o.frequency.value = i%2 ? 660 : 880;
      g.gain.setValueAtTime(0.0001,t0+d); g.gain.exponentialRampToValueAtTime(0.5,t0+d+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t0+d+0.3);
      o.connect(g); g.connect(vaCtx.destination); o.start(t0+d); o.stop(t0+d+0.32); }); }catch(_){}
};
const vaSay = t => { try{ if(window.MCNative && MCNative.speak){ MCNative.speak(t); return; } }catch(_){}

    const n = $("#vpN"); if(n) n.onclick = async () => { try{ const r = await Notification.requestPermission(); toast(r==="granted" ? "✅ अनुमति मिल गई" : "अनुमति नहीं मिली"); }catch(_){ toast("इस ऐप में फ़ोन सूचना नहीं चलती — घंटी और आवाज़ चलेंगी"); } };
  };
  /* ⚠️ ड्यूटी पर हैं पर 2 घंटे से कोई काम दर्ज नहीं + ⏰ आज की follow-up — हर 10 मिनट जाँच */
  const workChk = async () => { try{
    const open=(await getDocs(query(collection(db,"duty"),where("end","==",null)))).docs.map(d=>({id:d.id,...d.data()}));
    if(open.length){ const F=(await getDocs(query(collection(db,"followups"),orderBy("at","desc"),limit(300)))).docs.map(d=>d.data());
      const R=(await getDocs(query(collection(db,"reports"),orderBy("at","desc"),limit(100)))).docs.map(d=>d.data());
      for(const d of open){ const ms=v=>toD(v)?.getTime()||0, last=Math.max(ms(d.start), ...F.filter(f=>f.uid===d.uid).map(f=>ms(f.at)), ...R.filter(r=>r.uid===d.uid).map(r=>ms(r.at)));
        const gap=Date.now()-last; if(last && gap>2*3600e3){ const k="mcIdle_"+d.id+"_"+Math.floor(gap/(2*3600e3)); if(!localStorage.getItem(k)){ localStorage.setItem(k,"1"); vaPush(`ध्यान दें: ${d.name||"वर्कर"} ड्यूटी पर हैं पर ${Math.floor(gap/3600e3)} घंटे से कोई follow-up या रिपोर्ट दर्ज नहीं`, tabGo("home")); } } } }
    const kd="mcFupAdm_"+todayKey(); if(!localStorage.getItem(kd) && new Date().getHours()>=9){ localStorage.setItem(kd,"1");
      const due=dueFups((await getDocs(query(collection(db,"followups"),orderBy("at","desc"),limit(1000)))).docs.map(d=>d.data()));
      if(due.length) vaPush(`आज ${due.length} ग्राहकों से follow-up बाकी: ${due.slice(0,4).map(f=>f.cname+(f.wname?" ("+f.wname+")":"")).join(", ")}`, tabGo("tour")); }
  }catch(_){} };
  setTimeout(workChk,20000); const wcIv=setInterval(workChk,10*60000); sub(()=>clearInterval(wcIv));
  /* 💻 PC/लैपटॉप पर काम की अनुमति — आते ही घंटी, जब तक बाकी है हर 5 मिनट याद */
  let pcPend=[];
  sub(onSnapshot(query(collection(db,"devReq"),where("status","==","pending")), s => { pcPend=s.docs.map(d=>d.data());
    s.docChanges().forEach(c=>{ if(c.type!=="removed" && !c.doc.metadata.hasPendingWrites){ const r=c.doc.data(); vaPush(`ध्यान दें: ${r.name||"वर्कर"} लैपटॉप/PC पर काम की अनुमति माँग रहे हैं — होम पर 30 सेकंड का वीडियो देखकर अनुमति दें`, tabGo("home")); } }); }, ()=>{}));
  const pcIv=setInterval(()=>{ if(pcPend.length) vaPush(`याद दिलाना: ${pcPend.map(r=>r.name||"वर्कर").join(", ")} की PC पर काम की अनुमति बाकी है`, tabGo("home")); },5*60000); sub(()=>clearInterval(pcIv));
  /* नई जॉइनिंग (मंज़ूरी/एक्सेस माँगना) */
  sub(onSnapshot(collection(db,"users"), vaFirst((s, first) => { if(first) return;
    s.docChanges().forEach(c => { const u = c.doc.data(); if(c.type==="added" && u.status==="pending") { vaPush(`नई जॉइनिंग: ${u.name||"नया वर्कर"} — KYC जाँचकर अपने-आप मंज़ूरी दे रहा हूँ`, tabGo("workers")); setTimeout(autoApprove, 8000); }
      if(c.type==="added" && u.status==="auto") vaPush(`नई जॉइनिंग अपने-आप मंज़ूर: ${u.name||"नया वर्कर"} — KYC पूरी थी, लॉगिन चालू`, tabGo("workers")); });
  }), ()=>{}));
  /* 🆘 पासवर्ड भूले / नंबर बदला अर्ज़ी */
  sub(onSnapshot(collection(db,"help"), vaFirst((s, first) => { if(first) return;
    s.docChanges().forEach(c => { const h = c.doc.data(); if((c.type==="added"||c.type==="modified") && !h.done && !c.doc.metadata.hasPendingWrites) vaPush(h.type==="pw" ? `${h.name} (${h.mobile}) पासवर्ड भूल गए — एक टैप में WhatsApp पर भेजें` : `${h.name} का मोबाइल नंबर बदला: ${h.newMobile} — एक टैप में नया खाता बनाएँ`, h.type==="pw" ? ()=>sendPwHelp(c.doc.id, h) : showHelpList); });
  }), ()=>{}));
  setTimeout(autoApprove, 5000); watchStuck(); watchSys(); setTimeout(movePwSecrets, 7000);
  /* वर्कर रिपोर्ट */

    s.docChanges().forEach(c => { if(c.type==="added" && !c.doc.metadata.hasPendingWrites){ const r = c.doc.data(); vaPush(`${r.name||"वर्कर"} की नई काम रिपोर्ट आई`, tabGo("home")); } });

  /* ड्यूटी शुरू/खत्म, हाज़िरी फ़ोटो नहीं दी, दूर गया */
  const dPrev = {};
  sub(onSnapshot(query(collection(db,"duty"),orderBy("start","desc"),limit(30)), vaFirst((s, first) => {
    s.docChanges().forEach(c => { const d = c.doc.data(), id = c.doc.id, p = dPrev[id];
      if(!first){
        if(c.type==="added" && !d.end) vaPush(`${d.name||"वर्कर"} ने ड्यूटी शुरू की`, tabGo("home"));
        else if(c.type==="modified" && p){
          if(d.end && !p.end) vaPush(`${d.name||"वर्कर"} ने ड्यूटी खत्म की`, tabGo("home"));

        } }
      dPrev[id] = { end: !!d.end, idleAlert: !!d.idleAlert, awayKm: +d.awayKm||0 }; });
  }), ()=>{}));
  /* आदेश पूरा */
  sub(onSnapshot(query(collection(db,"acks"),orderBy("at","desc"),limit(20)), vaFirst((s, first) => { if(first){ s.docs.forEach(d=>{ const a=d.data(); if(a.reply) vaRep[d.id]=a.reply; }); return; }
    s.docChanges().forEach(c => { const a = c.doc.data(); if((c.type==="added"||c.type==="modified") && a.reply && vaRep[c.doc.id]!==a.reply){ vaRep[c.doc.id]=a.reply; vaPush(`${a.name||"वर्कर"} का जवाब: ${String(a.reply).slice(0,80)}`, ()=>replyTo(a.uid, a.name||"वर्कर")); } });
    s.docChanges().forEach(c => { const a = c.doc.data(); if((c.type==="added"||c.type==="modified") && a.status==="done") vaPush(`${a.name||"वर्कर"} ने आदेश पूरा किया`, tabGo("cmd")); });

  try{ const last = +localStorage.getItem("mcVaSaid")||0; if(vaOn() && Date.now()-last > 3*3600e3) setTimeout(async () => { const m = await vaPending(false); if(/मंज़ूरी|फ़ोटो|अर्ज़|अधूरे/.test(m)) vaPush(m.replace(/^पेंडिंग काम: /,"पेंडिंग काम — "), tabGo("workers")); try{ localStorage.setItem("mcVaSaid", String(Date.now())); }catch(_){} }, 4000); }catch(_){}
}

/* 🔁 नया पासवर्ड: pwreset/{uid} → GitHub का सुरक्षित काम (हर 30 मिनट, :07 और :37 पर) असली लॉगिन पासवर्ड बदलकर secrets में रखता है */
async function pwReset(u){
  await setDoc(doc(db,"pwreset",u.id),{at:serverTimestamp(),by:me.uid});
  try{ await addDoc(collection(db,"audit"),{at:serverTimestamp(),by:me.uid,byName:profile?.name||"Admin",uid:u.id,name:u.name||"",act:"🔁 नया पासवर्ड माँगा",before:{},after:{}}); }catch(_){}
  delete kycPw[u.id];
  const m=new Date().getMinutes(), wait=m<7?7-m:m<37?37-m:67-m;
  toast(`🔁 ${u.name} का नया पासवर्ड ~${wait+2} मिनट में बनेगा — फिर 🔑 में दिखेगा / "उसका पासवर्ड भेजो"`);
  return wait+2;
}

const DV = {"क":"k","ख":"kh","ग":"g","घ":"gh","ङ":"n","च":"ch","छ":"chh","ज":"j","झ":"jh","ञ":"n","ट":"t","ठ":"th","ड":"d","ढ":"dh","ण":"n","त":"t","थ":"th","द":"d","ध":"dh","न":"n","प":"p","फ":"f","ब":"b","भ":"bh","म":"m","य":"y","र":"r","ल":"l","व":"v","श":"sh","ष":"sh","स":"s","ह":"h","ळ":"l","अ":"a","आ":"a","इ":"i","ई":"i","उ":"u","ऊ":"u","ए":"e","ऐ":"ai","ओ":"o","औ":"au","ऋ":"ri"};
const skel = w => { let x = String(w||"").toLowerCase().replace(/[ऀ-ॿ]/g, c => DV[c] ?? "");
  x = x.replace(/[^a-z]/g,"").replace(/ph/g,"f").replace(/w/g,"v").replace(/z/g,"j").replace(/q/g,"k").replace(/ck/g,"k").replace(/h/g,"");
  return x ? x[0] + x.slice(1).replace(/[aeiou]/g,"") : ""; };
const ACT_WORDS = /^(का|की|के|को|से|में|पर|और|ने|सब|सबको|सभी|खाता|अकाउंट|account|बंद|चालू|करो|कर|करें|दो|दें|दे|दीजिए|कीजिए|मंज़ूरी|मंजूरी|पूरी|अनुमति|परमिशन|एडमिन|हटाओ|हटा|पासवर्ड|भेजो|भेज|बताओ|बता|शिफ्ट|सुबह|शाम|आदेश|कमांड|हुक्म|मैसेज|वर्कर|जी|प्लीज|please|अभी|उसका|उसकी|नया|ब्लॉक|खोलो|वापस|डेटा|डाटा|data|दिखाओ|दिखा|जानकारी|डिटेल|नंबर|ईमेल|मेल|सबका|सबकी|लिस्ट|उसको|उन्हें|काम|सौंपो|सौंप)$/;
function findUsers(q, users){
  const ws = String(q).split(/[\s,।.?!:]+/).filter(w => w && !ACT_WORDS.test(w)).map(skel).filter(s => s.length >= 2);
  const dig = (String(q).match(/[6-9]\d{9}/)||[])[0];
  if(dig){ const d = users.filter(u => u.mobile===dig || String(u.email).startsWith(dig)); if(d.length) return d; }
  const sc = users.map(u => { const ns = String(u.name||"").split(/\s+/).map(skel).filter(Boolean);
    return { u, n: ws.filter(w => ns.some(n => n === w || (w.length >= 3 && n.startsWith(w)))).length + (ns.length && ws.length && ns.every(n => ws.includes(n)) ? 0.5 : 0) }; }).filter(x => x.n >= 1);

function qMark(it, st, res){ const Q=qLoad(); const x=Q.find(y=>y.id===it.id); if(x){ x.st=st; if(res!=null) x.res=String(res).slice(0,300); x.end=qTime(); qSave(Q); } }
function qWrap(r, it){
  if(r==null){ qMark(it,"fail"); return null; }
  if(typeof r==="string"){ qMark(it,"done",r); return r; }
  if(!r.buttons && !r.next){ qMark(it,"done",r.text); return r; }
  const out={...r};
  if(r.buttons) out.buttons=r.buttons.map(b=>({ label:b.label, run: async()=>{ const o=await b.run();
    if(o && typeof o==="object" && (o.buttons||o.next)) return qWrap(o,it);
    qMark(it, /नहीं|❌/.test(b.label)?"skip":"done", typeof o==="string"?o:(o&&o.text)||"");
    return qChain(o); } }));
  if(r.next) out.next=async a=>qWrap(await r.next(a), it);
  return out;
}
async function qChain(o){ const ot=typeof o==="string"?o:(o&&o.text)||"✅ हो गया"; const nx=await qRunNext();
  if(!nx){ const left=qLoad().filter(x=>x.st==="wait").length; return left?ot:ot+"\n\n🎉 कतार के सारे काम पूरे।"; }
  if(typeof nx==="string") return ot+"\n\n▶️ "+nx;
  return {...nx, text: ot+"\n\n▶️ अगला काम: "+nx.text, say: (typeof o==="string"?o:(o&&o.say)||ot)+"। अगला काम। "+(nx.say||nx.text)}; }
async function qRunNext(){
  const Q=qLoad(); const it=Q.find(x=>x.st==="wait"); if(!it) return null;
  it.st="run"; qSave(Q);
  let r=null; try{ r=await aiAction0(it.text); }catch(e){ r="❌ "+(e.message||e); }
  const w=qWrap(r,it);
  if(w==null){ const nx=await qRunNext(); const m=`❓ "${it.text}" समझ नहीं आया — छोड़ दिया (नाम/काम साफ़ बोलकर फिर जोड़ें)`; if(!nx) return m; return typeof nx==="string"?m+"\n\n▶️ "+nx:{...nx,text:m+"\n\n▶️ अगला काम: "+nx.text}; }
  return w;
}

    const files = await getDocs(query(collection(db,"files"),orderBy("createdAt","desc"),limit(100))).then(s=>s.docs.map(d=>({id:d.id,...d.data()}))).catch(()=>[]);
    const give = u => ({ text: `${u?u.name:"सबको"} को कौन सा काम देना है? बोलिए या लिखिए (फ़ाइल का नाम बोलेंगे तो फ़ाइल भी साथ जाएगी)`, say: `${u?u.name:"सबको"} को कौन सा काम देना है? बोलिए।`,
      next: async task => { task = String(task).trim(); if(task.length < 3) return "काम साफ़ बोलिए — फिर से 'काम दो' बोलें।";
        const ts = String(task).split(/\s+/).map(skel).filter(x=>x.length>=3);
        const f = files.find(x => { const fs = String(x.title||"").split(/\s+/).map(skel); return ts.some(w => fs.some(n => n && (n===w || n.startsWith(w)))); });
        return yes(`${u?u.name:"सबको"} को काम: "${task}"${f?`\n📎 फ़ाइल साथ: ${f.title}`:""}\nभेजते ही वर्कर के फ़ोन में घंटी बजेगी, 2 घंटे में पूरा न हुआ तो अपने-आप याद।`, async () => {
          await addDoc(collection(db,"commands"),{text:task,to:u?u.id:"all",toName:u?u.name:"सब",kind:f?"link":"msg",ref:f&&/^https?:/.test(f.url||"")?f.url:"",autoOpen:false,by:me.uid,byName:profile.name||"Admin",createdAt:serverTimestamp()});
          return `✅ काम शुरू — ${u?u.name:"सबको"} को भेज दिया: "${task}"${f?` (📎 ${f.title})`:""}\nपूरा होते ही आपको घंटी + रिपोर्ट मिलेगी।`; }); } });
    if(has(/सब|सभी|all/)) return give(null);
    return pick(u => give(u), "काम");
  }

  // 📢 आदेश भेजो
  const cm = String(q).match(/(?:आदेश|कमांड|हुक्म|मैसेज)\s*(?:भेजो|दो|भेजें)?\s*[:：\-–]?\s*(?:कि\s+)?(.{3,})$/);
  if(cm && has(/आदेश|कमांड|हुक्म|मैसेज/)){
    const text = cm[1].trim(), before = String(q).slice(0, cm.index);
    const toAll = /सब|सभी|all/.test(before) || !findUsers(before, users).length;
    const send = async u => { await addDoc(collection(db,"commands"),{text,to:u?u.id:"all",toName:u?u.name:"सब",kind:"msg",ref:"",autoOpen:false,by:me.uid,byName:profile.name||"Admin",createdAt:serverTimestamp()}); return `✅ आदेश भेज दिया — ${u?u.name:"सबको"}: "${text}"\nपूरा होने पर घंटी बजेगी।`; };
    if(toAll) return yes(`सबको आदेश भेजूँ: "${text}"`, () => send(null));
    return pick(u => yes(`${u.name} को आदेश भेजूँ: "${text}"`, () => send(u)), "आदेश");
  }

  // ✅ मंज़ूरी
  if(has(/मंज़ूरी|मंजूरी|approve|जॉइनिंग/) && !has(/कैसे|क्या|कहाँ/)){
    const e = ownerOnly(); if(e) return e;
    const pend = users.filter(u=>u.status==="pending");
    if(!pend.length) return "✅ कोई मंज़ूरी बाकी नहीं।";
    const ok = async u => { await updUser(u.id,{active:true,status:"auto",autoAt:serverTimestamp()}); return `✅ ${u.name} को मंज़ूरी दे दी — अब लॉगिन कर सकता है। पासवर्ड भेजना हो तो बोलें "${u.name} का पासवर्ड भेजो"।`; };
    if(has(/सब|सभी|all/)) return yes(`${pend.length} लोगों को मंज़ूरी दूँ: ${pend.map(u=>u.name).join(", ")}`, async () => { for(const u of pend) await ok(u); return `✅ ${pend.length} को मंज़ूरी दे दी: ${pend.map(u=>u.name).join(", ")}`; });
    const m = findUsers(q, pend); if(m.length===1) return yes(`${m[0].name} को मंज़ूरी दूँ?`, () => ok(m[0]));
    return { text: "किसको मंज़ूरी दूँ?", buttons: pend.map(u => ({ label: u.name, run: async () => ok(u) })).concat([{ label: "✅ सबको", run: async () => { for(const u of pend) await ok(u); return `✅ ${pend.length} को मंज़ूरी दे दी`; } }]) };
  }

  // 👑 एडमिन अनुमति
  if(has(/अनुमति|परमिशन|permission|एडमिन बना/) && !has(/कैसे|क्या/)){
    const e = ownerOnly(); if(e) return e; const off = has(/हटा|वापस|बंद|ले लो/);
    return pick(u => yes(`${u.name} की एडमिन (पूरी) अनुमति ${off?"हटाऊँ":"दूँ — वह सब कुछ देख और बदल सकेगा"}?`, async () => {
      const d = off ? {canEdit:false} : {canEdit:true, active:true}; if(!off && u.status==="pending") d.status="auto";
      await updUser(u.id, d); return `✅ ${u.name} की एडमिन अनुमति ${off?"हटा दी":"दे दी"}।`; }), "अनुमति");
  }

  // 🔒 खाता बंद / चालू
  if(has(/खाता|अकाउंट|account|ब्लॉक/) && has(/बंद|ब्लॉक|चालू|खोल/) && !has(/कैसे|क्या/)){
    const e = ownerOnly(); if(e) return e; const on = has(/चालू|खोल/) && !has(/बंद|ब्लॉक/);
    return pick(u => yes(`${u.name} का खाता ${on?"चालू":"बंद"} करूँ?${on?"":" वह तुरंत लॉग आउट होगा।"}`, async () => {
      await updUser(u.id, on ? {active:true} : {active:false}); return `✅ ${u.name} का खाता ${on?"चालू":"बंद"} कर दिया।`; }), on?"खाता चालू":"खाता बंद");
  }

  // 🕘 शिफ्ट
  if(has(/शिफ्ट/) && has(/सुबह|शाम|morning|evening/) && !has(/कैसे|क्या/)){
    const e = ownerOnly(); if(e) return e; const sh = has(/शाम|evening/) ? "evening" : "morning";
    return pick(u => yes(`${u.name} की शिफ्ट ${shiftName(sh)} करूँ?`, async () => { await updUser(u.id,{shift:sh}); return `✅ ${u.name} की शिफ्ट ${shiftName(sh)} कर दी।`; }), "शिफ्ट");
  }

  // 🔁 नया पासवर्ड बनाओ (लॉगिन "गलत पासवर्ड" बताए तो)
  if(has(/पासवर्ड|password/) && has(/नया|बदल|रीसेट|reset|ठीक/) && !has(/कैसे|कहाँ/)){
    if(!isOwner) return ownerOnly();
    return pick(u => yes(`${u.name} का लॉगिन पासवर्ड बदलकर नया बनाऊँ? पुराना काम नहीं करेगा।`, async () => { const w=await pwReset(u); return `🔁 ${u.name} का नया पासवर्ड ~${w} मिनट में बन जाएगा।\nफिर बोलें: "${u.name} का पासवर्ड भेजो" → WhatsApp पर भेजें।`; }), "नया पासवर्ड");
  }

  // 🔑 पासवर्ड भेजो / बताओ
  if(has(/पासवर्ड|password/) && has(/भेज|सेंड|send|बता|दो|दिखा/) && !has(/कैसे|कहाँ|भूल/)){
    if(!isOwner) return ownerOnly();
    return pick(async u => { const pw = await findPw(u), mob = u.mobile || String(u.email).split("@")[0];
      if(!pw) return `${u.name} का पासवर्ड रिकॉर्ड में नहीं। बोलें "नया पासवर्ड कैसे बनाएँ" — मैं तरीका बताऊँगा।`;
      const send = has(/भेज|सेंड|send/);
      return { text: `${u.name}\nमोबाइल: ${mob}\nपासवर्ड: ${pw}`, say: `${u.name} का पासवर्ड स्क्रीन पर है।${send?" WhatsApp पर भेजने के लिए बटन दबाएँ।":""}`,
        buttons: [{ label: "📲 WhatsApp पर भेजें", run: async () => { window.open(waTo(mob, `नमस्ते ${u.name}, MASTER CONNECTOR लॉगिन:\nमोबाइल: ${mob}\nपासवर्ड: ${pw}\n(बड़ा D और डैश - वैसे ही लिखें)`), "_blank"); return `✅ WhatsApp खुल गया — ${u.name} को भेजें दबाएँ।`; } },
                  { label: "📋 कॉपी", run: async () => { try{ await navigator.clipboard.writeText(pw); }catch(_){} return "📋 पासवर्ड कॉपी हो गया।"; } }] }; }, "पासवर्ड");
  }
  return null;
}

/* 📇 सबका डेटा — वर्कर + DIP ग्राहक: मोबाइल, WhatsApp, Gmail, Telegram, पता… एक जगह; नाम बोलें → पूरा डेटा */
async function allPeople(){
  const out = [];
  try{ const us = (await getDocs(collection(db,"users"))).docs.map(d=>({id:d.id,...d.data()})).filter(u=>u.id!==OWNER_UID && u.role!=="admin");
    for(const u of us){ let k = {}; if(isOwner && u.invite) try{ k = (await getDoc(doc(db,"kyc",u.id))).data() || {}; }catch(_){}
      const mob = u.mobile || k.mobile || (String(u.email).endsWith("@"+MOB_DOMAIN) ? String(u.email).split("@")[0] : "");
      out.push({ kind:"👷 वर्कर", name:u.name, mobile:mob, wa:mob, mail:k.mail || (String(u.email).includes("@") && !String(u.email).endsWith("@"+MOB_DOMAIN) ? u.email : ""), tg:k.tg||"",
        extra:[`${shiftName(u.shift)} शिफ्ट`, u.status==="pending"?"⏳ मंज़ूरी बाकी":u.active===false?"🔒 बंद":"✅ चालू", u.canEdit?"👑 एडमिन अनुमति":"", k.addr?`🏠 ${k.addr}`:"", k.dob?`🎂 ${k.dob}`:"", k.hours?`💼 ${k.hours} घंटे`:"", payText(u.pay)?`💰 ${payText(u.pay)}`:""].filter(Boolean).join(" · ") }); } }catch(_){}
  try{ (await getDocs(query(collection(db,"dipPlanReq"),limit(200)))).docs.forEach(d=>{ const v=d.data(); out.push({ kind:"⚡ DIP ग्राहक", name:v.name, mobile:v.mobile, wa:v.mobile, mail:"", tg:"", extra:`${d.id} · ${+v.plan||30} दिन प्लान की अर्ज़ी` }); }); }catch(_){}
  return out.filter(p=>p.name);
}
let pMsg = "";
const pLinks = p => { const L=[]; const m=mobDigits(p.mobile), w=mobDigits(p.wa)||m, tg=String(p.tg||"").replace(/^@/,""), t=encodeURIComponent(pMsg||"");
  if(m) L.push(["📞 कॉल","tel:+91"+m]); if(w) L.push(["💬 WhatsApp","https://wa.me/91"+w+(t?"?text="+t:"")]); if(tg) L.push(["✈️ Telegram","https://t.me/"+tg]); if(p.mail) L.push(["✉️ Gmail","mailto:"+p.mail+(t?"?subject="+encodeURIComponent("DIP")+"&body="+t:"")]); return L; };
const pText = p => `${p.kind}: ${p.name}\n📱 मोबाइल: ${p.mobile||"—"}\n💬 WhatsApp: ${p.wa||p.mobile||"—"}\n✉️ Gmail: ${p.mail||"—"}\n✈️ Telegram: ${p.tg||"—"}${p.extra?`\nℹ️ ${p.extra}`:""}`;
async function showPeople(pre){

      <div class="row" style="gap:6px;flex-wrap:wrap;margin-top:6px">

        <button class="sec sm" id="ppWaNext" style="width:auto">💬 WhatsApp पर एक-एक करके</button>
        <button class="sec sm" id="ppMail" style="width:auto">✉️ Gmail से सबको एक साथ</button></div>
      <p class="muted" style="margin:6px 0 0">WhatsApp और Telegram किसी ऐप को अपने-आप भेजने नहीं देते — खुलने पर वहाँ <b>भेजें ➤</b> दबाना पड़ता है। बिना टैप के: पहला बटन (ऐप में आदेश)।</p></details>
    <div class="row" style="gap:6px;flex-wrap:wrap"><button class="sec sm" data-pk="">सब</button><button class="sec sm" data-pk="👷 वर्कर">👷 वर्कर</button><button class="sec sm" data-pk="⚡ DIP ग्राहक">⚡ DIP ग्राहक</button><button class="sec sm" id="ppCsv">📥 Excel</button></div>
    <div id="ppL"></div></div>`;
  let kind="";
  const draw=()=>{ const q=$("#ppQ").value.trim().toLowerCase(), qs=skel(q);
    const rows=all.filter(x=>(!kind||x.kind===kind) && (!q || [x.name,x.mobile,x.wa,x.mail,x.tg].join(" ").toLowerCase().includes(q) || (qs.length>=2 && String(x.name).split(/\s+/).map(skel).some(n=>n.startsWith(qs)))));
    $("#ppL").innerHTML = rows.map(x=>`<div style="border-bottom:1px solid #e5e7eb;padding:8px 0"><b>${esc(x.name)}</b> <span class="pill">${esc(x.kind)}</span><br>
      <span class="muted">📱 ${esc(x.mobile||"—")} · ✉️ ${esc(x.mail||"—")} · ✈️ ${esc(x.tg||"—")}${x.extra?`<br>${esc(x.extra)}`:""}</span>
      <div class="row" style="margin-top:4px;gap:6px;flex-wrap:wrap">${pLinks(x).map(([l,h])=>`<a class="sec sm" style="text-decoration:none;padding:4px 10px;border-radius:8px" href="${esc(h)}" target="_blank" rel="noopener">${l}</a>`).join("")}</div></div>`).join("") || "<p class='muted'>कोई नहीं मिला</p>"; };
  $("#ppQ").oninput=draw; p.querySelectorAll("[data-pk]").forEach(b=>b.onclick=()=>{ kind=b.dataset.pk; draw(); });
  $("#ppMsg").oninput=e=>{ pMsg=e.target.value; draw(); };
  const vis=()=>{ const q=$("#ppQ").value.trim().toLowerCase(); return all.filter(x=>(!kind||x.kind===kind) && (!q || [x.name,x.mobile,x.mail].join(" ").toLowerCase().includes(q))); };
  $("#ppApp").onclick=async()=>{ const t=$("#ppMsg").value.trim(); if(t.length<2) return toast("पहले मैसेज लिखें");
    try{ await addDoc(collection(db,"commands"),{text:t,to:"all",toName:"सब",kind:"msg",ref:"",autoOpen:false,by:me.uid,byName:profile.name||"Admin",createdAt:serverTimestamp()}); toast("✅ सब वर्कर के ऐप में भेज दिया — घंटी बजेगी, पढ़ा/पूरा 📢 कमांड में दिखेगा"); }catch(e){ toast(errMsg(e)); } };
  let waI=0; $("#ppWaNext").onclick=()=>{ const t=$("#ppMsg").value.trim(); if(t.length<2) return toast("पहले मैसेज लिखें"); pMsg=t;
    const L=vis().filter(x=>mobDigits(x.wa)||mobDigits(x.mobile)); if(!L.length) return toast("किसी का WhatsApp नंबर नहीं");
    if(waI>=L.length) waI=0; const x=L[waI++]; window.open("https://wa.me/91"+(mobDigits(x.wa)||mobDigits(x.mobile))+"?text="+encodeURIComponent(t),"_blank");
    $("#ppWaNext").textContent = waI<L.length ? `💬 अगला: ${L[waI].name} (${waI}/${L.length})` : `✅ सब ${L.length} हो गए — फिर से शुरू`; };
  $("#ppMail").onclick=()=>{ const t=$("#ppMsg").value.trim(); if(t.length<2) return toast("पहले मैसेज लिखें"); const M=[...new Set(vis().map(x=>x.mail).filter(Boolean))]; if(!M.length) return toast("किसी का Gmail नहीं");
    location.href="mailto:?bcc="+encodeURIComponent(M.join(","))+"&subject="+encodeURIComponent("DIP")+"&body="+encodeURIComponent(t); };
  $("#ppX").onclick=()=>p.classList.add("hidden");
  $("#ppCsv").onclick=()=>{ const c=v=>`"${String(v||"").replace(/"/g,'""')}"`; const csv="﻿प्रकार,नाम,मोबाइल,WhatsApp,Gmail,Telegram,जानकारी\n"+all.map(x=>[x.kind,x.name,x.mobile,x.wa,x.mail,x.tg,x.extra].map(c).join(",")).join("\n");
    const b64=btoa(unescape(encodeURIComponent(csv))); const name=`सबका-डेटा-${new Date().toISOString().slice(0,10)}.csv`;
    try{ if(window.MCNative&&MCNative.saveFile){ MCNative.saveFile(name,"text/csv",b64); return; } }catch(_){}
    const a=document.createElement("a"); a.href="data:text/csv;base64,"+b64; a.download=name; a.click(); };
  draw();

/* 📜 बदलाव का रिकॉर्ड + ↩️ वापस लेना — users में हर बदलाव audit में (कौन, क्या, कब, पहले क्या था) */
const ACT_NAME = d => d.canEdit===true ? "👑 एडमिन अनुमति दी" : d.canEdit===false && Object.keys(d).length===1 ? "👑 अनुमति हटाई" : d.active===false ? "🔒 खाता बंद" : d.status==="auto"||d.status==="approved" ? "✅ मंज़ूरी/चालू" : d.active===true ? "🔓 खाता चालू" : d.shift ? `🕘 शिफ्ट: ${shiftName(d.shift)}` : d.name ? `✏️ नाम: ${d.name}` : d.pay ? "💰 सैलरी बदली" : "बदलाव";
async function updUser(id, data){
  let old = {}; try{ old = (await getDoc(doc(db,"users",id))).data() || {}; }catch(_){}
  await updateDoc(doc(db,"users",id), data);
  const before = {}, after = {}; Object.keys(data).forEach(k => { if(k==="autoAt") return; before[k] = old[k] ?? null; after[k] = data[k]; });
  try{ await addDoc(collection(db,"audit"),{at:serverTimestamp(), by:me.uid, byName:profile?.name||"Admin", uid:id, name:old.name||"", act:ACT_NAME(data), before, after:JSON.parse(JSON.stringify(after))}); }catch(_){}
}
async function auditList(hours=24){
  const s = await getDocs(query(collection(db,"audit"),orderBy("at","desc"),limit(100)));
  const t0 = Date.now() - hours*3600e3; return s.docs.map(d=>({id:d.id,...d.data()})).filter(a => (toD(a.at)?.getTime()||Date.now()) >= t0);
}
async function undoAudit(a){
  if(!isOwner) return "वापस सिर्फ़ मुख्य एडमिन ले सकते हैं।";
  if(a.undone) return "यह बदलाव पहले ही वापस हो चुका है।";
  if(Date.now() - (toD(a.at)?.getTime()||0) > 24*3600e3) return "24 घंटे से पुराना बदलाव वापस नहीं होता — वर्कर टैब से हाथ से बदलें।";
  await updUser(a.uid, a.before); await updateDoc(doc(db,"audit",a.id),{undone:true}).catch(()=>{});
  return `↩️ वापस ले लिया: ${a.name} — ${a.act}`;
}
async function showAudit(){
  const p=$("#popup"); p.innerHTML=`<div class="card">लोड हो रहा है…</div>`; p.classList.remove("hidden");
  let L=[]; try{ L = await auditList(24*7); }catch(e){ p.innerHTML=`<div class="card"><p>रिकॉर्ड नहीं खुला: ${esc(errMsg(e))}</p><button class="sec" onclick="this.closest('.popup').classList.add('hidden')">बंद</button></div>`; return; }
  p.innerHTML=`<div class="card" style="max-height:85vh;overflow:auto"><div class="between"><h3 style="margin:0">📜 बदलाव का रिकॉर्ड (7 दिन)</h3><button class="sec sm" id="auX">बंद</button></div>
    ${L.map(a=>`<div style="border-bottom:1px solid #e5e7eb;padding:7px 0;${a.undone?"opacity:.5":""}"><b>${esc(a.act)}</b> — ${esc(a.name)}<br><span class="muted">${a.at?fmtD(a.at)+" "+fmtT(a.at):""} · किया: ${esc(a.byName)}${a.undone?" · ↩️ वापस हुआ":""}</span>
      ${isOwner&&!a.undone&&Date.now()-(toD(a.at)?.getTime()||0)<24*3600e3?`<div><button class="sec sm" data-un="${esc(a.id)}">↩️ वापस लें</button></div>`:""}</div>`).join("")||"<p class='muted'>कोई बदलाव नहीं</p>"}</div>`;
  $("#auX").onclick=()=>p.classList.add("hidden");
  p.querySelectorAll("[data-un]").forEach(b=>b.onclick=async()=>{ if(!confirm("यह बदलाव वापस लें?")) return; toast(await undoAudit(L.find(x=>x.id===b.dataset.un))); showAudit(); });

/* 🩺 पूरा सिस्टम जाँच — हर गड़बड़ी + "ठीक करो" बटन */
async function sysCheck(){
  const I = [], now = new Date(), day0 = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();

  try{ const hs=(await getDocs(collection(db,"help"))).docs.map(d=>d.data()).filter(h=>!h.done); if(hs.length) I.push({sev:"🆘", text:`${hs.length} वर्कर अर्ज़ी बाकी (पासवर्ड/नंबर): ${hs.map(h=>h.name).slice(0,3).join(", ")}`, fix:{label:"🆘 अर्ज़ियाँ खोलें", run: async()=>{ setTimeout(showHelpList,200); return "🆘 अर्ज़ियाँ खोल दीं।"; }}}); }catch(_){}
  try{ const st=await stuckCmds(); if(st.length) I.push({sev:"⏰", text:`${st.length} आदेश 2 घंटे से अधूरे: ${st.slice(0,2).map(x=>`"${String(x.text).slice(0,25)}" (${x.left.slice(0,2).join(", ")})`).join("; ")}`, fix:{label:"🔁 सबको याद भेजो", run: async()=>{ let n=0; for(const c of st) for(const name of c.left){ const u=us.find(x=>x.name===name); if(!u) continue; await addDoc(collection(db,"commands"),{text:`🔁 याद: ${c.text}\n(${c.hrs} घंटे से अधूरा — काम करके ✅ हो गया दबाएँ)`,to:u.id,toName:u.name,kind:"msg",ref:"",autoOpen:false,by:me.uid,byName:"🤖 AI",createdAt:serverTimestamp()}); n++; } return `🔁 ${n} वर्कर को याद भेज दी।`; }}}); }catch(_){}
  let duty=[]; try{ duty=(await getDocs(query(collection(db,"duty"),orderBy("start","desc"),limit(200)))).docs.map(d=>({id:d.id,...d.data()})); }catch(_){}
  const open = duty.filter(d=>!d.end), idle = open.filter(d=>d.idleAlert), far = open.filter(d=>d.awayKm>LIMIT_KM);
  if(idle.length) I.push({sev:"📸", text:`${idle.length} वर्कर ने हाज़िरी फ़ोटो नहीं दी: ${idle.map(d=>d.name).join(", ")}`, fix:{label:"📞 पहले वाले को कॉल", run: async()=>{ const u=us.find(x=>x.id===idle[0].uid); if(u&&u.mobile) window.open("tel:+91"+u.mobile); return `📞 ${idle[0].name} को कॉल खोल दी।`; }}});
  if(far.length) I.push({sev:"🚩", text:`${far.length} वर्कर ड्यूटी की जगह से ${LIMIT_KM} km से दूर: ${far.map(d=>`${d.name} (${d.awayKm} km)`).join(", ")}`, fix:null});
  const inToday = new Set(duty.filter(d=>(toD(d.start)?.getTime()||0)>=day0).map(d=>d.uid));
  const absent = act.filter(u=>!u.canEdit && !inToday.has(u.id) && (u.shift==="evening" ? now.getHours()>=15 : now.getHours()>=10));
  if(absent.length) I.push({sev:"🕘", text:`आज ${absent.length} वर्कर ड्यूटी पर नहीं आए: ${absent.map(u=>u.name).join(", ")}`, fix:{label:"📢 उन्हें ड्यूटी की याद भेजो", run: async()=>{ for(const u of absent) await addDoc(collection(db,"commands"),{text:"🕘 आपकी ड्यूटी अभी शुरू नहीं हुई — ऐप में ड्यूटी शुरू करें या एडमिन को बताएँ।",to:u.id,toName:u.name,kind:"msg",ref:"",autoOpen:false,by:me.uid,byName:"🤖 AI",createdAt:serverTimestamp()}); return `📢 ${absent.length} वर्कर को ड्यूटी की याद भेज दी।`; }}});
  const mobs = {}; us.filter(u=>u.active!==false).forEach(u=>{ const m=u.mobile||String(u.email).split("@")[0]; if(m) (mobs[m]=mobs[m]||[]).push(u.name); });
  const dup = Object.entries(mobs).filter(([m,n])=>n.length>1);
  if(dup.length) I.push({sev:"⚠️", text:`एक ही नंबर दो चालू खातों में: ${dup.map(([m,n])=>`${m} (${n.join(" + ")})`).join("; ")} — एक बंद करें`, fix:{label:"👥 वर्कर खोलें", run: async()=>{ go("workers"); return "👥 वर्कर टैब खोल दिया।"; }}});
  if(isOwner){ const noPw=[]; for(const u of act.filter(x=>!x.canEdit)){ if(!(await findPw(u))) noPw.push(u.name); }
    if(noPw.length) I.push({sev:"🔑", text:`${noPw.length} चालू वर्कर का पासवर्ड रिकॉर्ड में नहीं: ${noPw.join(", ")} — भूल गए तो नया खाता बनाना पड़ेगा`, fix:null}); }
  const admins = us.filter(u=>u.canEdit && u.active!==false); if(admins.length) I.push({sev:"👑", text:`एडमिन अनुमति वाले: ${admins.map(u=>u.name).join(", ")} (ठीक है ना?)`, fix:null, info:true});
  try{ const au = await auditList(24); if(au.length) I.push({sev:"📜", text:`पिछले 24 घंटे में ${au.length} बदलाव (${[...new Set(au.map(a=>a.byName))].join(", ")} ने)`, fix:{label:"📜 देखें / वापस लें", run: async()=>{ setTimeout(showAudit,200); return "📜 बदलाव का रिकॉर्ड खोल दिया।"; }}, info:true}); }catch(_){}
  try{ const sc = await siteCheck(); if(sc.bad.length) I.push({sev:"🌐", text:`${sc.bad.length} पेज/APK नहीं खुल रहे: ${sc.bad.join(", ")}`, fix:null}); else I.push({sev:"🌐", text:`सारे ${sc.ok} पेज और APK ठीक खुल रहे हैं`, fix:null, info:true}); }catch(_){}
  return { I, open: open.length, act: act.length };
}
/* 🌐 हर पेज + APK की जाँच (फ़ोन से ही, फ़्री) — एक पेज खराब हो तो बाकी पर असर नहीं, बस यहाँ ❌ दिखेगा */
async function siteCheck(){
  const G = "https://thakurdip881-cloud.github.io/master-connector/";
  const L = [["MASTER CONNECTOR",G],["AI (पूछें)",G+"voice-ai.js"],["DIP Master AI साइट",G+"dip/"],["DIP Control Panel",G+"dip/admin.html"],["टूर ग्राहक साइट",G+"tour/"],["लिंक पेज",G+"links.html"],["APK संस्करण सूची",G+"apps/versions.json"],["APK DIP Master AI",G+"dip/DIP-Master-AI.apk"],["APK 30% Partner",G+"apps/30-Partner.apk"],["APK सहायक",G+"apps/DIP-Sahayak.apk"],["APK सफ़ाई",G+"apps/DIP-Safai.apk"]];
  const res = await Promise.all(L.map(async ([n,u]) => { try{ const r = await fetch(u + (u.includes("?")?"&":"?") + "t=" + Date.now(), { method:"HEAD", cache:"no-store" }); return r.ok ? null : n; }catch(_){ return n; } }));

function sysReport(r){
  const bad = r.I.filter(x=>!x.info);
  const head = `🩺 सिस्टम जाँच: ${r.act} चालू वर्कर, ${r.open} अभी ड्यूटी पर। ${bad.length ? `${bad.length} बातें ध्यान देने की:` : "✅ कोई गड़बड़ी नहीं।"}`;
  const text = head + "\n" + r.I.map((x,i)=>`${i+1}. ${x.sev} ${x.text}`).join("\n");
  const fixes = r.I.filter(x=>x.fix).map(x=>x.fix).slice(0,6);
  const safe = r.I.filter(x=>x.fix && /मंज़ूरी|याद/.test(x.fix.label)).map(x=>x.fix);
  if(safe.length > 1) fixes.unshift({label:"🔧 सब ठीक करो", run: async()=>{ const o=[]; for(const f of safe) o.push(await f.run()); return "🔧 रिपोर्ट:\n"+o.join("\n"); }});
  return { text, say: head + " " + r.I.filter(x=>!x.info).slice(0,4).map(x=>x.text.split(":")[0]).join("। "), buttons: fixes };
}
async function dayReport(){
  const now=new Date(), day0=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime(), td=x=>(toD(x)?.getTime()||0)>=day0;
  const [ds,cs,as,us]=await Promise.all([getDocs(query(collection(db,"duty"),orderBy("start","desc"),limit(200))),getDocs(query(collection(db,"commands"),orderBy("createdAt","desc"),limit(60))),getDocs(query(collection(db,"acks"),orderBy("at","desc"),limit(1500))),getDocs(collection(db,"users"))]);
  const duty=ds.docs.map(d=>d.data()).filter(d=>td(d.start)), names=[...new Set(duty.map(d=>d.name))];
  const cmds=cs.docs.map(d=>({id:d.id,...d.data()})).filter(c=>td(c.createdAt)), acks=as.docs.map(d=>d.data());
  const doneN=cmds.filter(c=>acks.some(a=>a.cmd===c.id && a.status==="done")).length;
  const newJ=us.docs.map(d=>d.data()).filter(u=>td(u.createdAt)&&u.role!=="admin");
  let au=[]; try{ au=await auditList(24); }catch(_){}
  const L=[`🕘 आज ड्यूटी पर आए: ${names.length} — ${names.join(", ")||"कोई नहीं"}`, `📢 आज के आदेश: ${cmds.length}, जिनमें से ${doneN} पर किसी ने ✅ किया`, `👋 नई जॉइनिंग: ${newJ.length}${newJ.length?" — "+newJ.map(u=>u.name).join(", "):""}`, `📜 बदलाव: ${au.length}${au.length?" — "+au.slice(0,3).map(a=>`${a.name}: ${a.act}`).join("; "):""}`];
  const r = await sysCheck(); const bad=r.I.filter(x=>!x.info);
  return { text:"🌙 आज की रिपोर्ट\n"+L.join("\n")+"\n\n"+(bad.length?`⚠️ ध्यान दें:\n`+bad.map(x=>`${x.sev} ${x.text}`).join("\n"):"✅ कोई गड़बड़ी नहीं"), say:`आज की रिपोर्ट। ${names.length} वर्कर ड्यूटी पर आए। ${cmds.length} आदेश, ${doneN} पूरे। ${newJ.length} नई जॉइनिंग। ${bad.length?bad.length+" बातें ध्यान देने की।":"कोई गड़बड़ी नहीं।"}`, buttons: sysReport(r).buttons };
}
/* 🔔 बटन पर गड़बड़ी गिनती + रात 9 बजे बोलकर रिपोर्ट */
function watchSys(){
  if(!canEdit) return;
  const tick = async () => { try{ const r=await sysCheck(); const n=r.I.filter(x=>!x.info).length; const b=$("#vaBtn"); if(b && vaOn()) b.textContent = n ? `🔔 ${n} गड़बड़ी` : "🔔 सब ठीक";
      const h=new Date().getHours(), key="mcNight"+new Date().toDateString(); let said=false; try{ said=!!localStorage.getItem(key); }catch(_){}
      if(h>=21 && !said && vaOn()){ try{ localStorage.setItem(key,"1"); }catch(_){} const d=await dayReport(); vaPush(d.say, ()=>{ document.querySelector(".dva-fab")?.click(); }); } }catch(_){} };
  setTimeout(tick, 20e3); sub((()=>{ const iv=setInterval(tick, 10*60e3); return ()=>clearInterval(iv); })());
}

function startVoiceAI(){
  if(!window.DipVoiceAI){ if(vaTry++<20) setTimeout(startVoiceAI,500); return; }
  DipVoiceAI.init({ title: canEdit ? "MASTER CONNECTOR" : "मेरा काम", bottom: 78, action: aiAction,
    chips: canEdit ? ["कतार दिखाओ","कतार चलाओ","सिस्टम जाँचो","आज की रिपोर्ट","आज क्या बदला?","गलती से हुआ बदलाव वापस लो","Raj का डेटा दिखाओ","सबका डेटा","Raj को काम दो","रुका काम पूरा करो","सबको मंज़ूरी दो","सबको आदेश: आज समय पर आएँ","Raj का पासवर्ड भेजो","नगमा को पूरी अनुमति दो","आज का हाल बताओ","कितने काम बाकी हैं?","वर्कर लॉगिन कैसे करें?","पासवर्ड कहाँ मिलेगा?","सभी वर्कर के पासवर्ड","नई जॉइनिंग मंज़ूरी कैसे?","खाता बंद कैसे करें?","मोबाइल नंबर बदल गया","रुका काम कैसे पता चले?"] : ["मेरे कितने आदेश बाकी हैं?","मेरी ड्यूटी का हाल","आज का हाल बताओ"],
    facts: async () => {
      const F = [], now = new Date(), day0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const acksQ = canEdit ? query(collection(db,"acks"),orderBy("at","desc"),limit(1500)) : query(collection(db,"acks"),where("uid","==",me.uid),limit(500));
      const cmdQ = canEdit ? query(collection(db,"commands"),orderBy("createdAt","desc"),limit(30)) : myCmdQuery();
      const dutyQ = canEdit ? query(collection(db,"duty"),orderBy("start","desc"),limit(80)) : query(collection(db,"duty"),where("uid","==",me.uid));
      const [cs, as, ds] = await Promise.all([getDocs(cmdQ), getDocs(acksQ), getDocs(dutyQ)]);
      const acks = as.docs.map(d=>d.data()), duty = ds.docs.map(d=>({id:d.id,...d.data()}));
      const open = duty.filter(r=>!r.end), far = open.filter(r=>r.awayKm>LIMIT_KM);
      if(canEdit){
        const us = await getDocs(collection(db,"users")), users = us.docs.map(d=>({id:d.id,...d.data()})).filter(u=>u.id!==OWNER_UID && u.role!=="admin");
        const todayIn = new Set(duty.filter(r=>{const t=toD(r.start); return t && t>=day0;}).map(r=>r.uid));
        const absent = users.filter(u=>u.active!==false && u.status!=="pending" && !todayIn.has(u.id));
        F.push({t:`${open.length} वर्कर अभी ड्यूटी पर हैं`, d: open.map(r=>`${r.name} (${shiftName(r.shift)}, ${fmtT(r.start)} से${r.awayKm?`, ${r.awayKm} km`:""})`).join(", "), s:"info", k:"ड्यूटी कौन चालू"});
        F.push({t: far.length ? `⚠️ ${far.length} वर्कर ड्यूटी की जगह से ${LIMIT_KM} km से दूर हैं` : "कोई वर्कर दूर नहीं है", d: far.map(r=>`${r.name} — ${r.awayKm} km`).join(", "), s: far.length?"baki":"info", k:"दूर ड्यूटी जगह location"});
        F.push({t: absent.length ? `आज ${absent.length} वर्कर ड्यूटी पर नहीं आए` : "आज सभी वर्कर ड्यूटी पर आ चुके हैं", d: absent.map(u=>`${u.name} (${shiftName(u.shift)})`).join(", "), s: absent.length?"baki":"info", k:"ड्यूटी नहीं आए गैरहाज़िर absent"});
        const pend = users.filter(u=>u.status==="pending");
        if(pend.length) F.push({t:`${pend.length} नए वर्कर की मंज़ूरी बाकी है`, d: pend.map(u=>u.name).join(", ")+" — 👥 टीम टैब में मंज़ूर करें", s:"baki", k:"वर्कर मंज़ूरी नया फ़ॉर्म join"});
        cs.docs.forEach(d=>{ const c=d.data(), dn=acks.filter(a=>a.cmd===d.id && a.status==="done");
          const need = c.to==="all" ? users.filter(u=>u.active!==false).length : 1, ok = dn.length>=need;
          F.push({t:`आदेश "${c.text}" (${c.toName||"सब"})`, d: ok ? "सबने कर दिया" : `${dn.length}/${need} ने ✅ किया`+(dn.length?` — ${dn.map(a=>a.name).join(", ")}`:""), s: ok?"done":"baki", k:"आदेश"}); });
      } else {
        const mine = {}; acks.forEach(a=>{ mine[a.cmd]=a.status; });
        cs.docs.forEach(d=>{ const c=d.data(); F.push({t:`आदेश: ${c.text}`, d: c.byName?`${c.byName} ने भेजा`:"", s: mine[d.id]==="done"?"done":"baki", k:"आदेश मेरा"}); });
        const o = open[0];
        F.push({t: o ? `आपकी ड्यूटी चालू है (${fmtT(o.start)} से)` : "आपकी ड्यूटी अभी बंद है", d: o && o.awayKm>LIMIT_KM ? `⚠️ आप ड्यूटी की जगह से ${o.awayKm} km दूर हैं` : "", s: o && o.awayKm>LIMIT_KM ? "baki" : "info", k:"ड्यूटी मेरी"});
      }
      if(canEdit){ F.push(...GUIDE_ADMIN.map(x=>({...x,s:"info"}))); if(isOwner) try{ F.push(...await pwFacts()); }catch(_){} }
      else F.push(...GUIDE_WORKER.map(x=>({...x,s:"info"})));
      return F;
    }});
}
