:root{--bg:#f3f5f9;--card:#fff;--ink:#14213d;--muted:#667085;--line:#e3e7ee;--pri:#0f3d6e;--pri2:#1d64b0;--ok:#12805c;--okbg:#e3f6ee;--bad:#c0392b;--badbg:#fdecea;--warn:#a46300;--warnbg:#fff4de}

body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif;background:var(--bg);color:var(--ink);font-size:16px}

.stat div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{font-size:24px;display:block}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#14213d;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;max-width:90%}

.popup{position:fixed;inset:0;background:rgba(10,20,40,.55);z-index:30;display:flex;align-items:center;justify-content:center;padding:20px}
.popup .card{max-width:420px;width:100%}
a{color:var(--pri2);word-break:break-all}
.switch{width:64px;height:36px;border-radius:99px;background:#cfd6e2;position:relative;flex:none;padding:0}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:28px;height:28px;border-radius:50%;background:#fff;transition:.2s}
.switch.on{background:var(--ok)}

.diya{position:relative;display:inline-block;width:var(--s);height:var(--s);border-radius:50%;overflow:hidden;flex:none;vertical-align:middle}
.diya img.b{width:100%;height:100%;display:block}
.diya .g{position:absolute;left:50%;top:37%;width:62%;height:62%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,205,120,.6),rgba(255,150,60,.2) 45%,transparent 70%);mix-blend-mode:screen;pointer-events:none;animation:dglow 2.6s ease-in-out infinite}
.diya img.f{position:absolute;left:41.6%;top:21.9%;width:16.4%;height:22.5%;transform-origin:50% 100%;filter:drop-shadow(0 0 5px rgba(255,190,90,.85));animation:dsway 3.2s ease-in-out infinite}
@keyframes dsway{0%,100%{transform:rotate(-3deg) scaleY(1)}25%{transform:rotate(2deg) scaleY(1.06)}50%{transform:rotate(4deg) scaleY(.96)}75%{transform:rotate(-1.5deg) scaleY(1.04)}}
@keyframes dglow{0%,100%{opacity:.5;transform:translate(-50%,-50%) scale(.88)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}}
@media (prefers-reduced-motion:reduce){.diya img.f,.diya .g{animation:none}}
.diyaBig{text-align:center;margin:4px 0 10px}

function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.remove("hidden"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.add("hidden"),2600); }
const toD = v => v?.toDate ? v.toDate() : (v instanceof Date ? v : null);
const fmtT = v => { const d=toD(v); return d ? d.toLocaleTimeString("hi-IN",{hour:"2-digit",minute:"2-digit"}) : "—"; };

const fmtDur = (a,b) => { const s=toD(a), e=toD(b)||new Date(); if(!s) return ""; const m=Math.max(0,Math.round((e-s)/60000)); return `${Math.floor(m/60)} घं ${m%60} मि`; };

// फ़ोटो छोटी करके (कम डेटा) base64 — Firebase Storage नहीं (वो फ़्री नहीं)
const shrink = (file, max=640, q=0.6) => new Promise((res,rej) => { if(!file) return rej(new Error("no file")); const r=new FileReader(); r.onload=()=>{ const im=new Image(); im.onload=()=>{ const k=Math.min(1,max/Math.max(im.width,im.height)); const c=document.createElement("canvas"); c.width=Math.round(im.width*k); c.height=Math.round(im.height*k); c.getContext("2d").drawImage(im,0,0,c.width,c.height); res(c.toDataURL("image/jpeg",q)); }; im.onerror=rej; im.src=r.result; }; r.onerror=rej; r.readAsDataURL(file); });
const GOOGLE_ON = false;   // Firebase में Google लॉगिन चालू होने पर true करें

const ID_TYPES = {aadhaar:"आधार कार्ड", pan:"PAN कार्ड", voter:"वोटर ID", dl:"ड्राइविंग लाइसेंस"};
const DIYA = sz => `<div class="diyaBig"><span class="diya" style="--s:${sz}px"><img class="b" src="img/diya-base.png" alt=""><span class="g"></span><img class="f" src="img/flame.png" alt=""></span></div>`;

const getPos = () => new Promise(res => { if(!navigator.geolocation) return res(null); navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lng:p.coords.longitude}), ()=>res(null), {enableHighAccuracy:true,timeout:15000,maximumAge:60000}); });

/* 🤖 ऊपर AI बॉक्स: कौन ड्यूटी पर, कौन नहीं — हर घंटे ताज़ा (फ़्री, फ़ोन पर ही हिसाब) */
let aiLast=null;
async function aiSummary(){
  const now=new Date(), d0=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  if(!canEdit){ const ds=(await getDocs(query(collection(db,"duty"),where("uid","==",me.uid)))).docs.map(d=>d.data()); const open=ds.find(d=>!d.end);
    return {short: open?`ड्यूटी चालू · ${fmtDur(open.start)}`:"ड्यूटी बंद", lines:[open?`🟢 आपकी ड्यूटी ${fmtT(open.start)} से चालू`:"⚪ अभी आपकी ड्यूटी बंद है"]}; }
  const us=(await getDocs(collection(db,"users"))).docs.map(d=>({id:d.id,...d.data()})).filter(u=>u.role!=="admin");
  const ds=(await getDocs(query(collection(db,"duty"),orderBy("start","desc"),limit(200)))).docs.map(d=>d.data());
  const open=ds.filter(d=>!d.end), todayIds=new Set(ds.filter(d=>(toD(d.start)||0)>=d0).map(d=>d.uid));
  const act=us.filter(u=>u.active!==false && u.status!=="pending"), absent=act.filter(u=>!todayIds.has(u.id)), idle=open.filter(d=>d.idleAlert), far=open.filter(d=>d.awayKm>LIMIT_KM), pend=us.filter(u=>u.status==="pending");
  const lines=[`🟢 ड्यूटी पर (${open.length}): ${open.map(d=>esc(d.name)).join(", ")||"कोई नहीं"}`, `⚪ आज नहीं आए (${absent.length}): ${absent.map(u=>esc(u.name)).join(", ")||"कोई नहीं"}`];
  if(idle.length) lines.push(`⚠️ फ़ोन से दूर: ${idle.map(d=>esc(d.name)).join(", ")}`); if(far.length) lines.push(`🚩 जगह से दूर: ${far.map(d=>esc(d.name)).join(", ")}`); if(pend.length) lines.push(`⏳ मंज़ूरी बाकी: ${pend.map(u=>esc(u.name)).join(", ")}`);
  return {short:`${open.length} ड्यूटी पर · ${absent.length} नहीं आए${idle.length||far.length?` · ⚠️ ${idle.length+far.length}`:""}`, lines, notify:`${open.length} ड्यूटी पर, ${absent.length} आज नहीं आए${idle.length?`, ${idle.length} फ़ोन से दूर`:""}`};
}

      ${canEdit?`<button class="sec" id="aiN" style="width:100%;margin-top:8px">🔔 हर घंटे फ़ोन पर सूचना ${window.Notification&&Notification.permission==="granted"?"(चालू ✅)":"चालू करें"}</button>`:""}

  if(window.MCNative && MCNative.saveFile){ const u8=new TextEncoder().encode(csv); let bin=""; for(let i=0;i<u8.length;i+=8192) bin+=String.fromCharCode.apply(null,u8.subarray(i,i+8192)); MCNative.saveFile(name,"text/csv",btoa(bin)); return; }
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),60000);
}

const payText = p => { if(!p) return ""; const a=[]; if(+p.amt) a.push(`₹${(+p.amt).toLocaleString("en-IN")}/${p.per==="day"?"दिन":"महीना"}`); if(+p.comm) a.push(p.ct==="pct"?`${+p.comm}% कमीशन`:`₹${+p.comm} कमीशन/काम`); if(p.note) a.push(p.note); return a.join(" + "); };

    <label>नोट (वैकल्पिक)</label><input id="pNote" maxlength="60" placeholder="जैसे: टूर बुकिंग पर" value="${esc(v.note||"")}">

}

/* ---------- COMMANDS (DIP Master AI Control Panel के कमांड बोर्ड वाला ही डेटा) ----------
   कमांड: {text, to:'all'|uid, toName, kind:'msg'|'duty'|'link', ref:link, autoOpen, by:uid, byName, createdAt}
   जवाब:  acks/{कमांडID_यूज़रID} = {cmd, uid, name, status:'seen'|'done', at} */
const cmdLink = c => { const l = c.ref || c.link || ""; return /^https?:\/\//.test(l) ? l : ""; };
const cmdTo = c => c.to || c.target || "all";
const myCmdQuery = () => query(collection(db,"commands"),where("to","in",["all",me.uid]),limit(100));
const sortCmds = s => s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(toD(b.createdAt)||9e15)-(toD(a.createdAt)||9e15));
const ack = (id,status) => setDoc(doc(db,"acks",id+"_"+me.uid),{cmd:id,uid:me.uid,name:profile?.name||me.email,status,at:serverTimestamp()});
let myAcks = {};
function watchCommands(){
  if(canEdit) return;
  let first = true;
  sub(onSnapshot(query(collection(db,"acks"),where("uid","==",me.uid),limit(500)), s => { myAcks={}; s.docs.forEach(d=>{ const a=d.data(); myAcks[a.cmd]=a.status; }); }, ()=>{}));
  let myCmds = []; workerReminder(() => myCmds);
  sub(onSnapshot(myCmdQuery(), s => { myCmds = sortCmds(s);
    const seen=JSON.parse(localStorage.getItem("mc_seen")||"[]");
    if(first) sortCmds(s).filter(c=>!seen.includes(c.id)&&!myAcks[c.id]).slice(0,5).reverse().forEach(c=>showCommandPopup(c.id,c));
    else s.docChanges().forEach(ch=>{ if(ch.type==="added" && !seen.includes(ch.doc.id)) showCommandPopup(ch.doc.id,ch.doc.data()); });
    first = false;
  }, ()=>{}));
}
function markSeen(id){ const seen=JSON.parse(localStorage.getItem("mc_seen")||"[]"); if(!seen.includes(id)){ seen.push(id); localStorage.setItem("mc_seen",JSON.stringify(seen.slice(-300))); } if(myAcks[id]!=="done") ack(id,"seen").catch(()=>{}); }
function showCommandPopup(id,c){
  const p=$("#popup"); if(!p.classList.contains("hidden")) { setTimeout(()=>showCommandPopup(id,c),1500); return; }
  try{ navigator.vibrate?.([300,150,300]); }catch(e){}
  const link = cmdLink(c);
  p.innerHTML = `<div class="card"><div class="between"><h3 style="margin:0">📢 एडमिन की कमांड</h3><span class="muted">${fmtT(c.createdAt)}</span></div>
    <p style="font-size:18px;white-space:pre-wrap">${linkify(c.text)}</p>
    ${link?`<p><a href="${esc(link)}" target="_blank" rel="noopener">${esc(link)}</a></p>`:""}
    <div class="row">${link?`<button class="sec" id="cOpen">खोलें</button>`:""}<button class="sec" id="cOk">देख लिया</button><button class="ok" id="cDone">✅ हो गया</button></div></div>`;
  p.classList.remove("hidden");
  const close = () => { markSeen(id); p.classList.add("hidden"); };
  $("#cOk").onclick = close;
  $("#cDone").onclick = () => { close(); ack(id,"done").then(()=>toast("✅ एडमिन को बता दिया")).catch(e=>toast(errMsg(e))); };
  if(link) $("#cOpen").onclick = () => { close(); window.open(link,"_blank"); };
  if(link && c.autoOpen){ close(); window.open(link,"_blank"); }
}

/* ---------- FILES ---------- */
const FILE_MAX = 5*1024*1024, CHUNK = 700000;   // फ़ोन से अपलोड: 5MB तक, Firestore में ~700KB के टुकड़ों में (मुफ़्त)
const fSize = n => n>=1048576 ? (n/1048576).toFixed(1)+" MB" : Math.max(1,Math.round(n/1024))+" KB";
const readB64 = f => new Promise((ok,no)=>{ const r=new FileReader(); r.onload=()=>ok(String(r.result).split(",")[1]||""); r.onerror=()=>no(r.error); r.readAsDataURL(f); });
async function saveUpload(id, f){
  const parts=[]; for(let i=0;i<f.chunks;i++){ const c=await getDoc(doc(db,"fileChunks",id+"_"+i)); if(!c.exists()) throw new Error("फ़ाइल का हिस्सा नहीं मिला"); parts.push(c.data().d); }
  const b64=parts.join(""), name=f.name||"file", mime=f.mime||"application/octet-stream";
  if(window.MCNative && MCNative.saveFile){ MCNative.saveFile(name, mime, b64); return; }
  const bin=atob(b64), u8=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
  const url=URL.createObjectURL(new Blob([u8],{type:mime})), a=document.createElement("a");
  a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),60000);
  toast("⬇️ डाउनलोड हो गया");
}
function pageFiles(){
  app.innerHTML = `${canEdit?`<div class="card"><h3>फ़ाइल / लिंक शेयर करें</h3>
    <label>नाम</label><input id="fn" placeholder="जैसे: ट्रेनिंग वीडियो 1">
    <label>📎 फ़ोन से फ़ाइल चुनें (5 MB तक — फ़ोटो, PDF, डॉक्यूमेंट)</label><input id="ff" type="file">

    <div style="margin-top:12px"><button id="fs" style="width:100%">शेयर करें</button></div>
    <p class="muted">बड़ी फ़ाइल/वीडियो (5 MB से ज़्यादा) के लिए Google Drive लिंक डालें, शेयरिंग "Anyone with the link" रखें।</p></div>`:""}
    <div class="card"><h3>फ़ाइलें</h3><div class="list" id="flist"></div></div>`;
  if(canEdit){
    $("#ff").onchange = () => { const f=$("#ff").files[0]; if(!f){ $("#ffInfo").textContent=""; return; }
      if(f.size>FILE_MAX){ $("#ff").value=""; $("#ffInfo").textContent=""; return toast("⚠️ फ़ाइल 5 MB से बड़ी है — Google Drive लिंक डालें"); }
      $("#ffInfo").textContent=`✅ ${f.name} (${fSize(f.size)})`; if(!$("#fn").value.trim()) $("#fn").value=f.name.replace(/\.[^.]+$/,""); };
    $("#fs").onclick = async () => {
      const btn=$("#fs"), title=$("#fn").value.trim(), note=$("#fx").value.trim(), file=$("#ff").files[0];
      if(!title) return toast("नाम डालें");
      if(file){
        if(file.size>FILE_MAX) return toast("⚠️ फ़ाइल 5 MB से बड़ी है");
        btn.disabled=true; const ref=doc(collection(db,"files"));
        try{
          const b64=await readB64(file), n=Math.max(1,Math.ceil(b64.length/CHUNK));
          for(let i=0;i<n;i++){ btn.textContent=`⏳ अपलोड ${Math.round(i*100/n)}%`; await setDoc(doc(db,"fileChunks",ref.id+"_"+i),{fid:ref.id,i,d:b64.slice(i*CHUNK,(i+1)*CHUNK)}); }
          await setDoc(ref,{title,note,name:file.name,mime:file.type||"",size:file.size,chunks:n,by:me.uid,createdAt:serverTimestamp()});
          ["#fn","#fl","#fx","#ff"].forEach(s=>$(s).value=""); $("#ffInfo").textContent=""; toast("✅ फ़ाइल शेयर हो गई");
        }catch(e){ toast(errMsg(e)); }
        btn.disabled=false; btn.textContent="शेयर करें"; return;
      }
      let url=$("#fl").value.trim(); if(url && !/^[a-z]+:/i.test(url)) url="https://"+url;
      if(!/^https?:\/\//.test(url)) return toast("फ़ाइल चुनें या सही लिंक डालें");
      try{ await addDoc(collection(db,"files"),{title,url,note,by:me.uid,createdAt:serverTimestamp()}); ["#fn","#fl","#fx"].forEach(s=>$(s).value=""); toast("शेयर हो गया"); }catch(e){ toast(errMsg(e)); }
    };
  }
  let rows={};
  psub(onSnapshot(query(collection(db,"files"),orderBy("createdAt","desc"),limit(100)), s => {
    const el=$("#flist"); if(!el) return; rows={};
    el.innerHTML = s.docs.map(d=>{ const f=d.data(); rows[d.id]=f; const up=!!f.chunks; return `<div><div class="between"><b>${up?"📎 ":"🔗 "}${esc(f.title)}</b><span class="muted">${fmtD(f.createdAt)}</span></div>
      ${up?`<div class="muted">${esc(f.name)} · ${fSize(f.size||0)}</div>`:""}${f.note?`<div class="muted">${esc(f.note)}</div>`:""}
      <div class="row" style="margin-top:8px">${up?`<button class="ok sm" data-dl="${d.id}">⬇️ डाउनलोड</button>`:`<button class="ok sm" data-open="${esc(f.url)}">खोलें / डाउनलोड</button><button class="sec sm" data-copy="${esc(f.url)}">लिंक कॉपी</button>`}${canEdit?`<button class="sec sm" data-del="${d.id}">हटाएँ</button>`:""}</div></div>`; }).join("") || `<p class="muted">अभी कोई फ़ाइल नहीं</p>`;
    el.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>window.open(b.dataset.open,"_blank"));
    el.querySelectorAll("[data-copy]").forEach(b=>b.onclick=async()=>{ try{ await navigator.clipboard.writeText(b.dataset.copy); toast("लिंक कॉपी हुआ"); }catch(e){ prompt("लिंक कॉपी करें:",b.dataset.copy); } });
    el.querySelectorAll("[data-dl]").forEach(b=>b.onclick=async()=>{ const t=b.textContent; b.disabled=true; b.textContent="⏳ ला रहा है…"; try{ await saveUpload(b.dataset.dl, rows[b.dataset.dl]); }catch(e){ toast(errMsg(e)); } b.disabled=false; b.textContent=t; });
    el.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{ if(!confirm("ये फ़ाइल हटाएँ?")) return; const id=b.dataset.del, n=(rows[id]&&rows[id].chunks)||0;
      try{ for(let i=0;i<n;i++) await deleteDoc(doc(db,"fileChunks",id+"_"+i)); await deleteDoc(doc(db,"files",id)); toast("हटा दी"); }catch(e){ toast(errMsg(e)); } });
  }, e=>toast(errMsg(e))));
}

    s.docChanges().forEach(c => { if(c.type==="added" && !c.doc.metadata.hasPendingWrites){ const r = c.doc.data(); vaPush(`${r.name||"वर्कर"} की नई काम रिपोर्ट आई`, tabGo("home")); } });
  }), ()=>{}));
  /* ड्यूटी शुरू/खत्म, हाज़िरी फ़ोटो नहीं दी, दूर गया */
  const dPrev = {};
  sub(onSnapshot(query(collection(db,"duty"),orderBy("start","desc"),limit(30)), vaFirst((s, first) => {
    s.docChanges().forEach(c => { const d = c.doc.data(), id = c.doc.id, p = dPrev[id];
      if(!first){
        if(c.type==="added" && !d.end) vaPush(`${d.name||"वर्कर"} ने ड्यूटी शुरू की`, tabGo("home"));
        else if(c.type==="modified" && p){
          if(d.end && !p.end) vaPush(`${d.name||"वर्कर"} ने ड्यूटी खत्म की`, tabGo("home"));
          if(d.idleAlert && !p.idleAlert) vaPush(`ध्यान दें: ${d.name||"वर्कर"} ने हाज़िरी फ़ोटो नहीं दी`, tabGo("home"));
          if(d.awayKm > LIMIT_KM && !(p.awayKm > LIMIT_KM)) vaPush(`ध्यान दें: ${d.name||"वर्कर"} ड्यूटी की जगह से दूर है`, tabGo("home"));
        } }
      dPrev[id] = { end: !!d.end, idleAlert: !!d.idleAlert, awayKm: +d.awayKm||0 }; });
  }), ()=>{}));
  /* आदेश पूरा */
  sub(onSnapshot(query(collection(db,"acks"),orderBy("at","desc"),limit(20)), vaFirst((s, first) => { if(first) return;
    s.docChanges().forEach(c => { const a = c.doc.data(); if((c.type==="added"||c.type==="modified") && a.status==="done") vaPush(`${a.name||"वर्कर"} ने आदेश पूरा किया`, tabGo("cmd")); });
  }), ()=>{}));
  /* DIP प्लान अर्ज़ी */
  if(isOwner) sub(onSnapshot(query(collection(db,"dipPlanReq"),limit(200)), vaFirst((s, first) => { if(first) return;
    s.docChanges().forEach(c => { const v = c.doc.data(); if(c.type==="added") vaPush(`नई DIP प्लान अर्ज़ी: ${v.name||""}`, tabGo("dip")); });
  }), ()=>{}));
  /* खुलते ही एक बार पेंडिंग काम बोलकर (दिन में हर 3 घंटे में एक बार से ज़्यादा नहीं) */
  try{ const last = +localStorage.getItem("mcVaSaid")||0; if(vaOn() && Date.now()-last > 3*3600e3) setTimeout(async () => { const m = await vaPending(false); if(/मंज़ूरी|फ़ोटो|अर्ज़|अधूरे/.test(m)) vaPush(m.replace(/^पेंडिंग काम: /,"पेंडिंग काम — "), tabGo("workers")); try{ localStorage.setItem("mcVaSaid", String(Date.now())); }catch(_){} }, 4000); }catch(_){}
}

async function stuckCmds(){

  const out=[];
  cs.docs.forEach(d=>{ const c=d.data(), t=toD(c.createdAt)?.getTime()||now, age=now-t; if(age<2*3600e3 || age>3*86400e3) return;
    const who = c.to==="all" ? act : act.filter(u=>u.id===c.to); const left = who.filter(u=>!acks.some(a=>a.cmd===d.id && a.uid===u.id && a.status==="done"));
    if(left.length) out.push({text:c.text, left:left.map(u=>u.name), hrs:Math.round(age/3600e3)}); });
  return out;
}

/* ⚡ AI से काम करवाना — "राज का खाता बंद करो", "नगमा को पूरी अनुमति दो", "सबको आदेश: …", "रुका काम पूरा करो" …
   हर बदलाव से पहले ✅ हाँ (या बोलकर "हाँ") — फिर AI खुद करके रिपोर्ट देता है */
const DV = {"क":"k","ख":"kh","ग":"g","घ":"gh","ङ":"n","च":"ch","छ":"chh","ज":"j","झ":"jh","ञ":"n","ट":"t","ठ":"th","ड":"d","ढ":"dh","ण":"n","त":"t","थ":"th","द":"d","ध":"dh","न":"n","प":"p","फ":"f","ब":"b","भ":"bh","म":"m","य":"y","र":"r","ल":"l","व":"v","श":"sh","ष":"sh","स":"s","ह":"h","ळ":"l","अ":"a","आ":"a","इ":"i","ई":"i","उ":"u","ऊ":"u","ए":"e","ऐ":"ai","ओ":"o","औ":"au","ऋ":"ri"};
const skel = w => { let x = String(w||"").toLowerCase().replace(/[ऀ-ॿ]/g, c => DV[c] ?? "");
  x = x.replace(/[^a-z]/g,"").replace(/ph/g,"f").replace(/w/g,"v").replace(/z/g,"j").replace(/q/g,"k").replace(/ck/g,"k").replace(/h/g,"");
  return x ? x[0] + x.slice(1).replace(/[aeiou]/g,"") : ""; };
const ACT_WORDS = /^(का|की|के|को|से|में|पर|और|ने|सब|सबको|सभी|खाता|अकाउंट|account|बंद|चालू|करो|कर|करें|दो|दें|दे|दीजिए|कीजिए|मंज़ूरी|मंजूरी|पूरी|अनुमति|परमिशन|एडमिन|हटाओ|हटा|पासवर्ड|भेजो|भेज|बताओ|बता|शिफ्ट|सुबह|शाम|आदेश|कमांड|हुक्म|मैसेज|वर्कर|जी|प्लीज|please|अभी|उसका|उसकी|नया|ब्लॉक|खोलो|वापस|डेटा|डाटा|data|दिखाओ|दिखा|जानकारी|डिटेल|नंबर|ईमेल|मेल|सबका|सबकी|लिस्ट|उसको|उन्हें|काम|सौंपो|सौंप)$/;
function findUsers(q, users){
  const ws = String(q).split(/[\s,।.?!:]+/).filter(w => w && !ACT_WORDS.test(w)).map(skel).filter(s => s.length >= 2);
  const dig = (String(q).match(/[6-9]\d{9}/)||[])[0];
  if(dig){ const d = users.filter(u => u.mobile===dig || String(u.email).startsWith(dig)); if(d.length) return d; }
  const sc = users.map(u => { const ns = String(u.name||"").split(/\s+/).map(skel).filter(Boolean);
    return { u, n: ws.filter(w => ns.some(n => n === w || (w.length >= 3 && n.startsWith(w)))).length + (ns.length && ws.length && ns.every(n => ws.includes(n)) ? 0.5 : 0) }; }).filter(x => x.n >= 1);
  const top = Math.max(0, ...sc.map(x => x.n)); return sc.filter(x => x.n === top).map(x => x.u);
}

  const pick = (fn, verb) => { const m = findUsers(q, users);
    if(m.length === 1) return fn(m[0]);
    const list = m.length ? m : users;
    return { text: m.length ? `${m.length} लोग मिले — किसका ${verb}?` : `किसका ${verb}? नाम पर दबाएँ (या नाम साफ़ बोलें)`, buttons: list.slice(0,8).map(u => ({ label: u.name, run: async () => fn(u) })) }; };
  const ownerOnly = () => isOwner ? null : "यह काम सिर्फ़ मुख्य एडमिन कर सकते हैं।";
  const yes = (text, run) => ({ text: text + "\n\n✅ हाँ दबाएँ या बोलें \"हाँ\"", say: text + "। करूँ? हाँ या नहीं बोलें।", confirm: true, buttons: [{ label: "✅ हाँ, करो", run }, { label: "❌ नहीं", run: async () => "ठीक है, नहीं किया।" }] });

  // 🩺 सिस्टम जाँच / गड़बड़ी / हाल
  if(has(/सिस्टम|गड़बड़|गडबड|समस्या|प्रॉब्लम|problem|दिक्कत|हाल|स्थिति|स्टेटस|status|सब ठीक|क्या चल/) && !has(/कैसे/)) return sysReport(await sysCheck());
  // 🌙 आज की रिपोर्ट
  if(has(/रिपोर्ट|report/) && has(/आज|रात|दिन|पूरी|daily/)) return await dayReport();
  // 📜 बदलाव / ↩️ वापस
  if(has(/वापस ले|undo|अनडू|गलती से/)){ if(!isOwner) return ownerOnly(); const L=(await auditList(24)).filter(a=>!a.undone);
    if(!L.length) return "पिछले 24 घंटे में वापस लेने लायक कोई बदलाव नहीं।";
    return { text:"कौन सा बदलाव वापस लूँ?", buttons: L.slice(0,8).map(a=>({ label:`${a.name}: ${a.act}`, run: async()=>undoAudit(a) })) }; }
  if(has(/बदलाव|बदला|हिस्ट्री|history|रिकॉर्ड|किसने/) && !has(/नंबर|शिफ्ट|नाम|कैसे/)){ const L=await auditList(24);
    return { text: L.length ? `📜 पिछले 24 घंटे के ${L.length} बदलाव:\n`+L.slice(0,10).map(a=>`• ${a.name}: ${a.act} — ${a.byName}${a.undone?" (↩️ वापस)":""}`).join("\n") : "📜 पिछले 24 घंटे में कोई बदलाव नहीं।", buttons:[{label:"📜 पूरा रिकॉर्ड / वापस लें", run: async()=>{ setTimeout(showAudit,200); return "📜 रिकॉर्ड खोल दिया।"; }}] }; }

  // 📇 किसी का पूरा डेटा (मोबाइल, WhatsApp, Gmail, Telegram…)
  if(has(/डेटा|डाटा|data|जानकारी|डिटेल|detail|नंबर|ईमेल|मेल|gmail|जीमेल|टेलीग्राम|telegram|व्हाट्सएप|व्हाट्सऐप|whatsapp|संपर्क|कॉन्टैक्ट|contact|पता/) && !has(/पासवर्ड|आदेश|कमांड|काम दो|मंज़ूरी|मंजूरी|अनुमति|शिफ्ट|बदल|कैसे|खाता बंद|खाता चालू/)){
    const all = await allPeople();
    if(has(/सब|सभी|all|लिस्ट|list/) && !findUsers(q, all).length){ setTimeout(()=>showPeople(""), 300); return `📇 सबका डेटा खोल रहा हूँ — ${all.length} लोग (वर्कर + ग्राहक)। ऊपर नाम लिखकर खोजें, 📥 Excel से फ़ाइल।`; }
    const m = findUsers(q, all);
    const card = x => ({ text: pText(x), say: `${x.name} की जानकारी स्क्रीन पर है।`, buttons: pLinks(x).map(([l,h]) => ({ label: l, run: async () => { window.open(h, "_blank"); return pText(x); } })) });
    if(m.length === 1) return card(m[0]);
    if(m.length > 1) return { text: `${m.length} लोग मिले — किसका डेटा?`, buttons: m.slice(0,8).map(x => ({ label: `${x.name} (${x.kind.split(" ")[1]||""})`, run: async () => card(x) })) };
    setTimeout(()=>showPeople(""), 300); return "नाम नहीं मिला — 📇 सबका डेटा खोल दिया, ऊपर नाम या नंबर लिखकर खोजें।";
  }

  // ▶️ रुका/पेंडिंग काम पूरा करो — AI खुद आगे बढ़ाए
  if(has(/रुका|रुके|अधूर|पेंडिंग|बाकी काम|कंटिन्यू|continue|आगे बढ़/) && has(/पूरा|कर|कंटिन्यू|continue|बढ़|निपटा|दिला/))
    return yes("मैं ये करूँगा: (1) KYC पूरी वाली जॉइनिंग मंज़ूर (2) 2 घंटे से अधूरे आदेश वाले हर वर्कर को 🔁 याद का आदेश (3) वर्कर अर्ज़ियों की सूची खोलूँगा", async () => {
      const out = [];
      if(isOwner){ const before = users.filter(u=>u.status==="pending").length; await autoApprove(); const after = (await getDocs(collection(db,"users"))).docs.filter(d=>d.data().status==="pending").length; out.push(`✅ ${before-after} जॉइनिंग मंज़ूर${after?`, ${after} की KYC अधूरी — 🪪 देखें`:""}`); }
      const st = await stuckCmds(); let n = 0;
      for(const c of st) for(const name of c.left){ const u = users.find(x=>x.name===name); if(!u) continue;
        await addDoc(collection(db,"commands"),{text:`🔁 याद: ${c.text}\n(${c.hrs} घंटे से अधूरा — काम करके ✅ हो गया दबाएँ)`,to:u.id,toName:u.name,kind:"msg",ref:"",autoOpen:false,by:me.uid,byName:"🤖 AI",createdAt:serverTimestamp()}); n++; }
      out.push(n ? `🔁 ${n} वर्कर को अधूरे आदेश की याद भेजी` : "✅ कोई आदेश 2 घंटे से अधूरा नहीं");
      let hs = []; try{ hs = (await getDocs(collection(db,"help"))).docs.map(d=>d.data()).filter(h=>!h.done); }catch(_){}
      if(hs.length){ out.push(`🆘 ${hs.length} अर्ज़ी बाकी — सूची खोल दी, WhatsApp बटन दबाएँ`); setTimeout(showHelpList, 1500); } else out.push("✅ कोई वर्कर अर्ज़ी बाकी नहीं");
      return "रिपोर्ट:\n" + out.join("\n"); });

  // 🆘 अर्ज़ियाँ
  if(has(/अर्ज़ी|अर्जी|अर्ज़ियाँ|अर्जियां/)) { setTimeout(showHelpList, 300); return "🆘 वर्कर अर्ज़ियाँ खोल रहा हूँ — पासवर्ड वाली पर 📲 WhatsApp, नंबर वाली पर 🔁 नया खाता दबाएँ।"; }

  // 🧑‍🔧 "Raj को काम दो / सौंपो" → AI पूछे कौन सा काम → आप बोलें → ✅ ओके → काम शुरू (वर्कर के फ़ोन में घंटी)
  if(has(/काम/) && has(/दो|दें|सौंप|असाइन|assign|देना/) && !has(/कैसे|क्या|कितन|बाकी|रुका|पूरा करो/)){
    const files = await getDocs(query(collection(db,"files"),orderBy("createdAt","desc"),limit(100))).then(s=>s.docs.map(d=>({id:d.id,...d.data()}))).catch(()=>[]);
    const give = u => ({ text: `${u?u.name:"सबको"} को कौन सा काम देना है? बोलिए या लिखिए (फ़ाइल का नाम बोलेंगे तो फ़ाइल भी साथ जाएगी)`, say: `${u?u.name:"सबको"} को कौन सा काम देना है? बोलिए।`,
      next: async task => { task = String(task).trim(); if(task.length < 3) return "काम साफ़ बोलिए — फिर से 'काम दो' बोलें।";
        const ts = String(task).split(/\s+/).map(skel).filter(x=>x.length>=3);
        const f = files.find(x => { const fs = String(x.title||"").split(/\s+/).map(skel); return ts.some(w => fs.some(n => n && (n===w || n.startsWith(w)))); });
        return yes(`${u?u.name:"सबको"} को काम: "${task}"${f?`\n📎 फ़ाइल साथ: ${f.title}`:""}\nभेजते ही वर्कर के फ़ोन में घंटी बजेगी, 2 घंटे में पूरा न हुआ तो अपने-आप याद।`, async () => {
          await addDoc(collection(db,"commands"),{text:task,to:u?u.id:"all",toName:u?u.name:"सब",kind:f?"link":"msg",ref:f&&/^https?:/.test(f.url||"")?f.url:"",autoOpen:false,by:me.uid,byName:profile.name||"Admin",createdAt:serverTimestamp()});
          return `✅ काम शुरू — ${u?u.name:"सबको"} को भेज दिया: "${task}"${f?` (📎 ${f.title})`:""}\nपूरा होते ही आपको घंटी + रिपोर्ट मिलेगी।`; }); } });
    if(has(/सब|सभी|all/)) return give(null);
    return pick(u => give(u), "काम");
  }

  // 📢 आदेश भेजो
  const cm = String(q).match(/(?:आदेश|कमांड|हुक्म|मैसेज)\s*(?:भेजो|दो|भेजें)?\s*[:：\-–]?\s*(?:कि\s+)?(.{3,})$/);
  if(cm && has(/आदेश|कमांड|हुक्म|मैसेज/)){
    const text = cm[1].trim(), before = String(q).slice(0, cm.index);
    const toAll = /सब|सभी|all/.test(before) || !findUsers(before, users).length;
    const send = async u => { await addDoc(collection(db,"commands"),{text,to:u?u.id:"all",toName:u?u.name:"सब",kind:"msg",ref:"",autoOpen:false,by:me.uid,byName:profile.name||"Admin",createdAt:serverTimestamp()}); return `✅ आदेश भेज दिया — ${u?u.name:"सबको"}: "${text}"\nपूरा होने पर घंटी बजेगी।`; };
    if(toAll) return yes(`सबको आदेश भेजूँ: "${text}"`, () => send(null));
    return pick(u => yes(`${u.name} को आदेश भेजूँ: "${text}"`, () => send(u)), "आदेश");
  }

  // ✅ मंज़ूरी
  if(has(/मंज़ूरी|मंजूरी|approve|जॉइनिंग/) && !has(/कैसे|क्या|कहाँ/)){
    const e = ownerOnly(); if(e) return e;
    const pend = users.filter(u=>u.status==="pending");
    if(!pend.length) return "✅ कोई मंज़ूरी बाकी नहीं।";
    const ok = async u => { await updUser(u.id,{active:true,status:"auto",autoAt:serverTimestamp()}); return `✅ ${u.name} को मंज़ूरी दे दी — अब लॉगिन कर सकता है। पासवर्ड भेजना हो तो बोलें "${u.name} का पासवर्ड भेजो"।`; };
    if(has(/सब|सभी|all/)) return yes(`${pend.length} लोगों को मंज़ूरी दूँ: ${pend.map(u=>u.name).join(", ")}`, async () => { for(const u of pend) await ok(u); return `✅ ${pend.length} को मंज़ूरी दे दी: ${pend.map(u=>u.name).join(", ")}`; });
    const m = findUsers(q, pend); if(m.length===1) return yes(`${m[0].name} को मंज़ूरी दूँ?`, () => ok(m[0]));
    return { text: "किसको मंज़ूरी दूँ?", buttons: pend.map(u => ({ label: u.name, run: async () => ok(u) })).concat([{ label: "✅ सबको", run: async () => { for(const u of pend) await ok(u); return `✅ ${pend.length} को मंज़ूरी दे दी`; } }]) };
  }

  // 👑 एडमिन अनुमति
  if(has(/अनुमति|परमिशन|permission|एडमिन बना/) && !has(/कैसे|क्या/)){
    const e = ownerOnly(); if(e) return e; const off = has(/हटा|वापस|बंद|ले लो/);
    return pick(u => yes(`${u.name} की एडमिन (पूरी) अनुमति ${off?"हटाऊँ":"दूँ — वह सब कुछ देख और बदल सकेगा"}?`, async () => {
      const d = off ? {canEdit:false} : {canEdit:true, active:true}; if(!off && u.status==="pending") d.status="auto";
      await updUser(u.id, d); return `✅ ${u.name} की एडमिन अनुमति ${off?"हटा दी":"दे दी"}।`; }), "अनुमति");
  }

  // 🔒 खाता बंद / चालू
  if(has(/खाता|अकाउंट|account|ब्लॉक/) && has(/बंद|ब्लॉक|चालू|खोल/) && !has(/कैसे|क्या/)){
    const e = ownerOnly(); if(e) return e; const on = has(/चालू|खोल/) && !has(/बंद|ब्लॉक/);
    return pick(u => yes(`${u.name} का खाता ${on?"चालू":"बंद"} करूँ?${on?"":" वह तुरंत लॉग आउट होगा।"}`, async () => {
      await updUser(u.id, on ? {active:true} : {active:false}); return `✅ ${u.name} का खाता ${on?"चालू":"बंद"} कर दिया।`; }), on?"खाता चालू":"खाता बंद");
  }

  // 🕘 शिफ्ट
  if(has(/शिफ्ट/) && has(/सुबह|शाम|morning|evening/) && !has(/कैसे|क्या/)){
    const e = ownerOnly(); if(e) return e; const sh = has(/शाम|evening/) ? "evening" : "morning";
    return pick(u => yes(`${u.name} की शिफ्ट ${shiftName(sh)} करूँ?`, async () => { await updUser(u.id,{shift:sh}); return `✅ ${u.name} की शिफ्ट ${shiftName(sh)} कर दी।`; }), "शिफ्ट");
  }

  // 🔑 पासवर्ड भेजो / बताओ
  if(has(/पासवर्ड|password/) && has(/भेज|सेंड|send|बता|दो|दिखा/) && !has(/कैसे|कहाँ|भूल/)){
    if(!isOwner) return ownerOnly();
    return pick(async u => { const pw = await findPw(u), mob = u.mobile || String(u.email).split("@")[0];
      if(!pw) return `${u.name} का पासवर्ड रिकॉर्ड में नहीं। बोलें "नया पासवर्ड कैसे बनाएँ" — मैं तरीका बताऊँगा।`;
      const send = has(/भेज|सेंड|send/);
      return { text: `${u.name}\nमोबाइल: ${mob}\nपासवर्ड: ${pw}`, say: `${u.name} का पासवर्ड स्क्रीन पर है।${send?" WhatsApp पर भेजने के लिए बटन दबाएँ।":""}`,
        buttons: [{ label: "📲 WhatsApp पर भेजें", run: async () => { window.open(waTo(mob, `नमस्ते ${u.name}, MASTER CONNECTOR लॉगिन:\nमोबाइल: ${mob}\nपासवर्ड: ${pw}\n(बड़ा D और डैश - वैसे ही लिखें)`), "_blank"); return `✅ WhatsApp खुल गया — ${u.name} को भेजें दबाएँ।`; } },
                  { label: "📋 कॉपी", run: async () => { try{ await navigator.clipboard.writeText(pw); }catch(_){} return "📋 पासवर्ड कॉपी हो गया।"; } }] }; }, "पासवर्ड");
  }
  return null;
}

/* 📇 सबका डेटा — वर्कर + DIP ग्राहक: मोबाइल, WhatsApp, Gmail, Telegram, पता… एक जगह; नाम बोलें → पूरा डेटा */
async function allPeople(){
  const out = [];
  try{ const us = (await getDocs(collection(db,"users"))).docs.map(d=>({id:d.id,...d.data()})).filter(u=>u.id!==OWNER_UID && u.role!=="admin");
    for(const u of us){ let k = {}; if(isOwner && u.invite) try{ k = (await getDoc(doc(db,"kyc",u.id))).data() || {}; }catch(_){}
      const mob = u.mobile || k.mobile || (String(u.email).endsWith("@"+MOB_DOMAIN) ? String(u.email).split("@")[0] : "");
      out.push({ kind:"👷 वर्कर", name:u.name, mobile:mob, wa:mob, mail:k.mail || (String(u.email).includes("@") && !String(u.email).endsWith("@"+MOB_DOMAIN) ? u.email : ""), tg:k.tg||"",
        extra:[`${shiftName(u.shift)} शिफ्ट`, u.status==="pending"?"⏳ मंज़ूरी बाकी":u.active===false?"🔒 बंद":"✅ चालू", u.canEdit?"👑 एडमिन अनुमति":"", k.addr?`🏠 ${k.addr}`:"", k.dob?`🎂 ${k.dob}`:"", k.hours?`💼 ${k.hours} घंटे`:"", payText(u.pay)?`💰 ${payText(u.pay)}`:""].filter(Boolean).join(" · ") }); } }catch(_){}
  try{ (await getDocs(query(collection(db,"dipPlanReq"),limit(200)))).docs.forEach(d=>{ const v=d.data(); out.push({ kind:"⚡ DIP ग्राहक", name:v.name, mobile:v.mobile, wa:v.mobile, mail:"", tg:"", extra:`${d.id} · ${+v.plan||30} दिन प्लान की अर्ज़ी` }); }); }catch(_){}
  return out.filter(p=>p.name);
}
const pLinks = p => { const L=[]; const m=mobDigits(p.mobile), w=mobDigits(p.wa)||m, tg=String(p.tg||"").replace(/^@/,"");
  if(m) L.push(["📞 कॉल","tel:+91"+m]); if(w) L.push(["💬 WhatsApp","https://wa.me/91"+w]); if(tg) L.push(["✈️ Telegram","https://t.me/"+tg]); if(p.mail) L.push(["✉️ Gmail","mailto:"+p.mail]); return L; };
const pText = p => `${p.kind}: ${p.name}\n📱 मोबाइल: ${p.mobile||"—"}\n💬 WhatsApp: ${p.wa||p.mobile||"—"}\n✉️ Gmail: ${p.mail||"—"}\n✈️ Telegram: ${p.tg||"—"}${p.extra?`\nℹ️ ${p.extra}`:""}`;
async function showPeople(pre){
  const p=$("#popup"); p.innerHTML=`<div class="card">लोड हो रहा है…</div>`; p.classList.remove("hidden");
  const all = await allPeople();
  p.innerHTML=`<div class="card" style="max-height:88vh;overflow:auto"><div class="between"><h3 style="margin:0">📇 सबका डेटा (${all.length})</h3><button class="sec sm" id="ppX">बंद</button></div>
    <input id="ppQ" placeholder="नाम / नंबर / Gmail से खोजें" value="${esc(pre||"")}" style="margin:8px 0">
    <div class="row" style="gap:6px;flex-wrap:wrap"><button class="sec sm" data-pk="">सब</button><button class="sec sm" data-pk="👷 वर्कर">👷 वर्कर</button><button class="sec sm" data-pk="⚡ DIP ग्राहक">⚡ DIP ग्राहक</button><button class="sec sm" id="ppCsv">📥 Excel</button></div>
    <div id="ppL"></div></div>`;
  let kind="";
  const draw=()=>{ const q=$("#ppQ").value.trim().toLowerCase(), qs=skel(q);
    const rows=all.filter(x=>(!kind||x.kind===kind) && (!q || [x.name,x.mobile,x.wa,x.mail,x.tg].join(" ").toLowerCase().includes(q) || (qs.length>=2 && String(x.name).split(/\s+/).map(skel).some(n=>n.startsWith(qs)))));

        const absent = users.filter(u=>u.active!==false && u.status!=="pending" && !todayIn.has(u.id));
        F.push({t:`${open.length} वर्कर अभी ड्यूटी पर हैं`, d: open.map(r=>`${r.name} (${shiftName(r.shift)}, ${fmtT(r.start)} से${r.awayKm?`, ${r.awayKm} km`:""})`).join(", "), s:"info", k:"ड्यूटी कौन चालू"});
        F.push({t: far.length ? `⚠️ ${far.length} वर्कर ड्यूटी की जगह से ${LIMIT_KM} km से दूर हैं` : "कोई वर्कर दूर नहीं है", d: far.map(r=>`${r.name} — ${r.awayKm} km`).join(", "), s: far.length?"baki":"info", k:"दूर ड्यूटी जगह location"});
        F.push({t: absent.length ? `आज ${absent.length} वर्कर ड्यूटी पर नहीं आए` : "आज सभी वर्कर ड्यूटी पर आ चुके हैं", d: absent.map(u=>`${u.name} (${shiftName(u.shift)})`).join(", "), s: absent.length?"baki":"info", k:"ड्यूटी नहीं आए गैरहाज़िर absent"});
        const pend = users.filter(u=>u.status==="pending");
        if(pend.length) F.push({t:`${pend.length} नए वर्कर की मंज़ूरी बाकी है`, d: pend.map(u=>u.name).join(", ")+" — 👥 टीम टैब में मंज़ूर करें", s:"baki", k:"वर्कर मंज़ूरी नया फ़ॉर्म join"});
        cs.docs.forEach(d=>{ const c=d.data(), dn=acks.filter(a=>a.cmd===d.id && a.status==="done");
          const need = c.to==="all" ? users.filter(u=>u.active!==false).length : 1, ok = dn.length>=need;
          F.push({t:`आदेश "${c.text}" (${c.toName||"सब"})`, d: ok ? "सबने कर दिया" : `${dn.length}/${need} ने ✅ किया`+(dn.length?` — ${dn.map(a=>a.name).join(", ")}`:""), s: ok?"done":"baki", k:"आदेश"}); });
      } else {
        const mine = {}; acks.forEach(a=>{ mine[a.cmd]=a.status; });
        cs.docs.forEach(d=>{ const c=d.data(); F.push({t:`आदेश: ${c.text}`, d: c.byName?`${c.byName} ने भेजा`:"", s: mine[d.id]==="done"?"done":"baki", k:"आदेश मेरा"}); });
        const o = open[0];
        F.push({t: o ? `आपकी ड्यूटी चालू है (${fmtT(o.start)} से)` : "आपकी ड्यूटी अभी बंद है", d: o && o.awayKm>LIMIT_KM ? `⚠️ आप ड्यूटी की जगह से ${o.awayKm} km दूर हैं` : "", s: o && o.awayKm>LIMIT_KM ? "baki" : "info", k:"ड्यूटी मेरी"});
      }
      if(canEdit){ F.push(...GUIDE_ADMIN.map(x=>({...x,s:"info"}))); if(isOwner) try{ F.push(...await pwFacts()); }catch(_){} }
      else F.push(...GUIDE_WORKER.map(x=>({...x,s:"info"})));
      return F;
    }});
}
</script>
