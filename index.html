<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MASTER CONNECTOR</title>
<meta name="theme-color" content="#0f3d6e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f3f5f9;--card:#fff;--ink:#14213d;--muted:#667085;--line:#e3e7ee;--pri:#0f3d6e;--pri2:#1d64b0;--ok:#12805c;--okbg:#e3f6ee;--bad:#c0392b;--badbg:#fdecea;--warn:#a46300;--warnbg:#fff4de}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif;background:var(--bg);color:var(--ink);font-size:16px}
header{background:var(--pri);color:#fff;padding:14px 16px calc(14px);position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:18px;margin:0;letter-spacing:.5px}
header small{display:block;font-size:12px;opacity:.8;font-weight:400}
main{padding:14px 14px 90px;max-width:720px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:16px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff;color:var(--ink)}
textarea{min-height:80px;resize:vertical}
button{font:inherit;border:0;border-radius:10px;padding:11px 14px;background:var(--pri2);color:#fff;cursor:pointer}
button.sec{background:#e8eef7;color:var(--pri)}
button.bad{background:var(--bad)}
button.ok{background:var(--ok)}
button.sm{padding:7px 10px;font-size:13px}
button:disabled{opacity:.5}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.muted{color:var(--muted);font-size:13px}
.pill{display:inline-block;font-size:12px;padding:3px 9px;border-radius:99px;background:#eef1f6;color:var(--muted)}
.pill.ok{background:var(--okbg);color:var(--ok)}
.pill.bad{background:var(--badbg);color:var(--bad)}
.pill.warn{background:var(--warnbg);color:var(--warn)}
.list>div{padding:10px 0;border-top:1px solid var(--line)}
.list>div:first-child{border-top:0}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;background:none;color:var(--muted);border-radius:0;padding:10px 2px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button b{font-size:20px;font-weight:400}
nav button.on{color:var(--pri2)}
.big{font-size:22px;padding:18px;width:100%;border-radius:14px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{font-size:24px;display:block}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#14213d;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;max-width:90%}
.hidden{display:none!important}
.popup{position:fixed;inset:0;background:rgba(10,20,40,.55);z-index:30;display:flex;align-items:center;justify-content:center;padding:20px}
.popup .card{max-width:420px;width:100%}
a{color:var(--pri2);word-break:break-all}
.switch{width:64px;height:36px;border-radius:99px;background:#cfd6e2;position:relative;flex:none;padding:0}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:28px;height:28px;border-radius:50%;background:#fff;transition:.2s}
.switch.on{background:var(--ok)}
.switch.on::after{left:32px}
</style>
</head>
<body>
<header><h1>MASTER CONNECTOR<small id="who">लोड हो रहा है…</small></h1><button class="sec sm hidden" id="logoutBtn">लॉग आउट</button></header>
<main id="app"><div class="card">लोड हो रहा है…</div></main>
<nav id="nav" class="hidden"></nav>
<div id="toast" class="toast hidden"></div>
<div id="popup" class="popup hidden"></div>

<script type="module">
import { initializeApp, deleteApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, createUserWithEmailAndPassword, sendPasswordResetEmail, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { initializeFirestore, getFirestore, writeBatch, persistentLocalCache, persistentMultipleTabManager, collection, doc, getDoc, setDoc, addDoc, updateDoc, deleteDoc, onSnapshot, query, where, orderBy, limit, serverTimestamp, Timestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyApw_GttyXeEmHFvKlJjoQFI11KuL4ahxI",
  authDomain: "master-connector-f2a0d.firebaseapp.com",
  projectId: "master-connector-f2a0d",
  storageBucket: "master-connector-f2a0d.firebasestorage.app",
  messagingSenderId: "542800382335",
  appId: "1:542800382335:web:8bf9d3ac9ad3b7906bb24a"
};
const OWNER_UID = "Y7u25ODNNLOFBiiePyM7oR7Ts6n2";

const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
setPersistence(auth, browserLocalPersistence).catch(()=>{});
let db;
try { db = initializeFirestore(fbApp, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) }); }
catch(e){ db = initializeFirestore(fbApp, {}); }

const $ = s => document.querySelector(s);
const app = $("#app"), nav = $("#nav");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const linkify = s => esc(s).replace(/(https?:\/\/[^\s]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.remove("hidden"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.add("hidden"),2600); }
const toD = v => v?.toDate ? v.toDate() : (v instanceof Date ? v : null);
const fmtT = v => { const d=toD(v); return d ? d.toLocaleTimeString("hi-IN",{hour:"2-digit",minute:"2-digit"}) : "—"; };
const fmtD = v => { const d=toD(v); return d ? d.toLocaleDateString("hi-IN",{day:"numeric",month:"short"}) : ""; };
const fmtDur = (a,b) => { const s=toD(a), e=toD(b)||new Date(); if(!s) return ""; const m=Math.max(0,Math.round((e-s)/60000)); return `${Math.floor(m/60)} घं ${m%60} मि`; };
const shiftName = s => s==="evening" ? "शाम" : "सुबह";
// मोबाइल नंबर से लॉगिन (DIP Master AI के हायरिंग लिंक से जुड़े वर्कर) — वही तरीका जो DIP Control Panel में है
const MOB_DOMAIN = "worker.masterconnector.app";
const mobDigits = x => { let d=String(x||"").replace(/[\s\-+]/g,""); if(/^91\d{10}$/.test(d)) d=d.slice(2); if(/^0\d{10}$/.test(d)) d=d.slice(1); return /^[6-9]\d{9}$/.test(d) ? d : ""; };
const loginId = x => { const d=mobDigits(x); return d ? d+"@"+MOB_DOMAIN : String(x||"").trim(); };
const showId = e => String(e||"").endsWith("@"+MOB_DOMAIN) ? "📱 "+e.split("@")[0] : (e||"");
const APK_URL = "https://github.com/thakurdip881-cloud/master-connector/releases/download/apk-v6/MasterConnector.apk";
const JOIN_CODE = new URLSearchParams(location.search).get("join") || "";
const newCode = () => { const a=new Uint8Array(15); crypto.getRandomValues(a); return btoa(String.fromCharCode(...a)).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); };
// फ़ोटो छोटी करके (कम डेटा) base64 — Firebase Storage नहीं (वो फ़्री नहीं)
const shrink = (file, max=640, q=0.6) => new Promise((res,rej) => { if(!file) return rej(new Error("no file")); const r=new FileReader(); r.onload=()=>{ const im=new Image(); im.onload=()=>{ const k=Math.min(1,max/Math.max(im.width,im.height)); const c=document.createElement("canvas"); c.width=Math.round(im.width*k); c.height=Math.round(im.height*k); c.getContext("2d").drawImage(im,0,0,c.width,c.height); res(c.toDataURL("image/jpeg",q)); }; im.onerror=rej; im.src=r.result; }; r.onerror=rej; r.readAsDataURL(file); });
const ageYears = d => { const b=new Date(d); if(isNaN(b)) return -1; const n=new Date(); let a=n.getFullYear()-b.getFullYear(); if(n<new Date(n.getFullYear(),b.getMonth(),b.getDate())) a--; return a; };
const ID_TYPES = {aadhaar:"आधार कार्ड", pan:"PAN कार्ड", voter:"वोटर ID", dl:"ड्राइविंग लाइसेंस"};
const DIP_PANEL = "https://github-netlify-deploy-0cc412.netlify.app/admin.html";
const NATIVE = window.MCNative || null;   // Android ऐप के अंदर: फ़ोन लॉक होने पर भी duty location जाँच
const LIMIT_KM = 2;
const kmBetween = (a,b,c,d) => { const R=6371, r=x=>x*Math.PI/180; const h=Math.sin(r(c-a)/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(r(d-b)/2)**2; return 2*R*Math.asin(Math.sqrt(h)); };
const getPos = () => new Promise(res => { if(!navigator.geolocation) return res(null); navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lng:p.coords.longitude}), ()=>res(null), {enableHighAccuracy:true,timeout:15000,maximumAge:60000}); });
const errMsg = e => { const c=e?.code||""; if(c.includes("invalid-credential")||c.includes("wrong-password")||c.includes("user-not-found")) return "ईमेल या पासवर्ड गलत है"; if(c.includes("email-already-in-use")) return "ये ईमेल पहले से इस्तेमाल में है"; if(c.includes("weak-password")) return "पासवर्ड कम से कम 6 अक्षर का रखें"; if(c.includes("invalid-email")) return "ईमेल सही नहीं है"; if(c.includes("permission-denied")) return "इसकी अनुमति नहीं है"; if(c.includes("network")) return "इंटरनेट नहीं है"; return e?.message || "कुछ गड़बड़ हुई"; };

let me = null, profile = null, isOwner = false, canEdit = false, tab = null, unsubs = [];
const clearSubs = () => { unsubs.forEach(u=>{try{u()}catch(e){}}); unsubs = []; };
const sub = u => unsubs.push(u);

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});

$("#logoutBtn").onclick = async () => { if(confirm("लॉग आउट करें?")) { clearSubs(); await signOut(auth); } };

function showLogin(){
  clearSubs(); nav.classList.add("hidden"); $("#logoutBtn").classList.add("hidden"); $("#who").textContent = "लॉगिन करें";
  app.innerHTML = `<div class="card"><h3>लॉगिन</h3>
    <label>मोबाइल नंबर या ईमेल</label><input id="em" autocomplete="username">
    <label>पासवर्ड</label><input id="pw" type="password" autocomplete="current-password">
    <div style="margin-top:14px"><button id="go" style="width:100%">लॉगिन करें</button></div>
    <p class="muted" style="margin-top:12px">नए वर्कर: एडमिन से हायरिंग लिंक लेकर अकाउंट बनाएँ, फिर उसी मोबाइल नंबर और पासवर्ड से यहाँ लॉगिन करें। पासवर्ड भूल गए? <a href="#" id="fp">रीसेट लिंक भेजें</a></p></div>`;
  $("#go").onclick = async () => { const b=$("#go"); b.disabled=true; try{ await signInWithEmailAndPassword(auth,loginId($("#em").value),$("#pw").value); }catch(e){ toast(errMsg(e)); } b.disabled=false; };
  $("#pw").onkeydown = e => { if(e.key==="Enter") $("#go").click(); };
  $("#fp").onclick = async e => { e.preventDefault(); const em=$("#em").value.trim(); if(!em) return toast("पहले ईमेल लिखें"); if(mobDigits(em)) return toast("मोबाइल वाले अकाउंट का पासवर्ड एडमिन से बदलवाएँ"); try{ await sendPasswordResetEmail(auth,em); toast("रीसेट लिंक ईमेल पर भेजा गया"); }catch(err){ toast(errMsg(err)); } };
}

/* ---------- वर्कर खुद जुड़े: WhatsApp वाला लिंक (?join=CODE) ---------- */
async function showJoin(){
  clearSubs(); nav.classList.add("hidden"); $("#logoutBtn").classList.add("hidden"); $("#who").textContent = "नया वर्कर";
  app.innerHTML = `<div class="card">लिंक जाँच रहा है…</div>`;
  let inv = null;
  try{ const s = await getDoc(doc(db,"invites",JOIN_CODE)); inv = s.exists() ? s.data() : null; }catch(e){}
  const expired = inv && (inv.used || (toD(inv.exp)||0) < Date.now());
  if(!inv || expired){ app.innerHTML = `<div class="card"><h3>लिंक काम नहीं कर रहा</h3><p class="muted">${!inv?"यह लिंक सही नहीं है।":inv.used?"यह लिंक पहले ही इस्तेमाल हो चुका है।":"इस लिंक का समय खत्म हो गया।"} एडमिन से नया लिंक माँगें।</p><button class="sec" id="toLogin" style="width:100%">लॉगिन पेज</button></div>`; $("#toLogin").onclick=()=>{ location.href=location.pathname; }; return; }
  const mob = inv.mobile || "";
  app.innerHTML = `<div class="card"><h3>👋 MASTER CONNECTOR में जुड़ें</h3>
    <p class="muted">यह फ़ॉर्म एक बार भरना है। एडमिन की मंज़ूरी के बाद ऐप में इसी मोबाइल नंबर और पासवर्ड से लॉगिन करेंगे।</p>
    <label>मोबाइल नंबर</label><input id="jm" value="${esc(mob)}" ${mob?"readonly":""} inputmode="numeric">
    <label>पूरा नाम (ID जैसा)</label><input id="jn" autocomplete="name">
    <label>जन्म तिथि</label><input id="jd" type="date">
    <label>ईमेल ID</label><input id="je" type="email" inputmode="email" autocomplete="email">
    <label>सरकारी ID</label><select id="jt">${Object.entries(ID_TYPES).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select>
    <label>ID नंबर</label><input id="ji" autocapitalize="characters">
    <p class="muted" id="jiHint">आधार: सुरक्षा के लिए सिर्फ़ आखिरी 4 अंक सेव होंगे।</p>
    <label>ID की फ़ोटो (सामने वाला हिस्सा)</label><input id="jf" type="file" accept="image/*" capture="environment">
    <label>📸 लाइव फ़ोटो (अभी कैमरे से सेल्फ़ी)</label><input id="js" type="file" accept="image/*" capture="user">
    <img id="jsPrev" style="display:none;max-width:120px;border-radius:12px;margin-top:6px">
    <label>नया पासवर्ड (कम से कम 8 अक्षर, अंक भी हों)</label><input id="jp" type="password" autocomplete="new-password">
    <label>पासवर्ड फिर से</label><input id="jp2" type="password" autocomplete="new-password">
    <label class="row" style="color:var(--ink);margin-top:10px"><input type="checkbox" id="jc" style="width:auto;flex:none"> <span>मैं सहमति देता/देती हूँ कि मेरी यह जानकारी सिर्फ़ काम और हाज़िरी के लिए एडमिन देख सकेगा।</span></label>
    <div style="margin-top:14px"><button id="jgo" style="width:100%">✅ फ़ॉर्म जमा करें</button></div></div>`;
  $("#jt").onchange = () => { const t=$("#jt").value; $("#jiHint").textContent = t==="aadhaar" ? "आधार: सुरक्षा के लिए सिर्फ़ आखिरी 4 अंक सेव होंगे।" : t==="pan" ? "PAN जैसे: ABCDE1234F" : ""; };
  $("#js").onchange = async () => { try{ $("#jsPrev").src = await shrink($("#js").files[0], 240, 0.6); $("#jsPrev").style.display="block"; }catch(e){} };
  $("#jgo").onclick = async () => {
    const m=mobDigits($("#jm").value), name=$("#jn").value.trim(), dob=$("#jd").value, mail=$("#je").value.trim().toLowerCase();
    const idt=$("#jt").value, idRaw=$("#ji").value.replace(/\s|-/g,"").toUpperCase(), pw=$("#jp").value;
    if(!m) return toast("सही 10 अंक का मोबाइल नंबर डालें");
    if(name.length<3) return toast("अपना पूरा नाम लिखें");
    const age=ageYears(dob); if(age<18 || age>80) return toast("सही जन्म तिथि डालें (18 साल या ज़्यादा)");
    if(!/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/.test(mail)) return toast("सही ईमेल ID डालें");
    if(idt==="aadhaar" && !/^[2-9]\d{11}$/.test(idRaw)) return toast("आधार 12 अंक का होना चाहिए");
    if(idt==="pan" && !/^[A-Z]{5}\d{4}[A-Z]$/.test(idRaw)) return toast("PAN सही नहीं (जैसे ABCDE1234F)");
    if(idRaw.length<6) return toast("ID नंबर सही डालें");
    if(!$("#jf").files[0]) return toast("ID की फ़ोटो लगाएँ");
    if(!$("#js").files[0]) return toast("लाइव फ़ोटो (सेल्फ़ी) लें");
    if(pw.length<8 || !/\d/.test(pw) || !/[A-Za-z]/.test(pw)) return toast("पासवर्ड 8+ अक्षर का हो, अक्षर और अंक दोनों");
    if(pw!==$("#jp2").value) return toast("दोनों पासवर्ड एक जैसे नहीं हैं");
    if(!$("#jc").checked) return toast("सहमति वाले डिब्बे पर ✔ लगाएँ");
    const b=$("#jgo"); b.disabled=true; b.textContent="जमा हो रहा है…";
    let idImg, selfie;
    try{ idImg = await shrink($("#jf").files[0], 800, 0.6); selfie = await shrink($("#js").files[0], 480, 0.6); }
    catch(e){ toast("फ़ोटो नहीं खुली, दोबारा लें"); b.disabled=false; b.textContent="✅ फ़ॉर्म जमा करें"; return; }
    const idNo = idt==="aadhaar" ? "XXXX-XXXX-"+idRaw.slice(-4) : idRaw;
    const tmp = initializeApp(firebaseConfig, "join"+Date.now());
    try{
      const email = m+"@"+MOB_DOMAIN;
      const cred = await createUserWithEmailAndPassword(getAuth(tmp), email, pw);
      const uid = cred.user.uid, tdb = getFirestore(tmp), bt = writeBatch(tdb);
      bt.update(doc(tdb,"invites",JOIN_CODE),{used:true,usedBy:uid,usedAt:serverTimestamp()});
      bt.set(doc(tdb,"users",uid),{name,email,mobile:m,role:inv.role||"worker",canEdit:false,active:false,status:"pending",shift:inv.shift==="evening"?"evening":"morning",invite:JOIN_CODE,createdAt:serverTimestamp()});
      bt.set(doc(tdb,"kyc",uid),{uid,name,mobile:m,dob,mail,idType:idt,idNo,idImg,selfie,consent:true,ua:navigator.userAgent.slice(0,160),at:serverTimestamp()});
      await bt.commit();
      try{ await signOut(getAuth(tmp)); await deleteApp(tmp); }catch(e){}
      app.innerHTML = `<div class="card"><h3>✅ फ़ॉर्म जमा हो गया, ${esc(name)}!</h3>
        <p>एडमिन आपकी जानकारी देखकर मंज़ूरी देंगे। तब तक ऐप डाउनलोड कर लें:</p>
        <a href="${APK_URL}"><button class="ok" style="width:100%">📥 MASTER CONNECTOR ऐप डाउनलोड करें</button></a>
        <p>1. ऐप इंस्टॉल करें (फ़ोन पूछे तो Allow)।<br>2. Location और Notification की अनुमति दें।<br>3. मंज़ूरी के बाद लॉगिन: मोबाइल <b>${m}</b> और आपका पासवर्ड।<br>4. <b>ड्यूटी शुरू करें</b> दबाएँ।</p></div>`;
    }catch(e){
      try{ await deleteApp(tmp); }catch(_){}
      toast(String(e.code||"").includes("email-already-in-use") ? "इस मोबाइल नंबर से अकाउंट पहले से है — ऐप में लॉगिन करें" : errMsg(e));
      b.disabled=false; b.textContent="✅ फ़ॉर्म जमा करें";
    }
  };
}

onAuthStateChanged(auth, async user => {
  clearSubs();
  if(JOIN_CODE && !user) return showJoin();
  if(!user){ me=null; return showLogin(); }
  me = user; isOwner = user.uid === OWNER_UID;
  const ref = doc(db,"users",user.uid);

  canEdit = isOwner || profile.canEdit === true;
  $("#logoutBtn").classList.remove("hidden");
  $("#who").textContent = `${profile.name || showId(user.email)} · ${isOwner ? "मुख्य एडमिन" : canEdit ? "एडमिन (अनुमति)" : "वर्कर"}`;
  sub(onSnapshot(ref, s => { if(s.exists()){ const p=s.data(); const was=canEdit; profile=p; canEdit = isOwner || p.canEdit===true; if(was!==canEdit) location.reload(); if(p.active===false && !isOwner) signOut(auth); } }));
  resumeNativeDuty();
  watchCommands();
  buildNav();
});

// Android ऐप में: native service हर 2 मिनट location देखती है (फ़ोन लॉक होने पर भी)
function nativeStart(id, lat, lng){
  if(!NATIVE) return false;
  try{ NATIVE.startDuty(id, lat==null?"":String(lat), lng==null?"":String(lng), me.refreshToken||""); return true; }catch(e){ return false; }
}
function nativeStop(){ try{ NATIVE && NATIVE.stopDuty(); }catch(e){} }
let resumed = false;
async function resumeNativeDuty(){
  if(!NATIVE || resumed) return; resumed = true;
  try{
    const { getDocs } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
    const s = await getDocs(query(collection(db,"duty"),where("uid","==",me.uid),where("end","==",null)));
    const open = s.docs[0];
    if(open){ const d=open.data(); nativeStart(open.id, d.startLat, d.startLng); } else nativeStop();
  }catch(e){}
}
function pageDuty(){
  app.innerHTML = `<div class="card" id="dutyBox">लोड हो रहा है…</div><div class="card"><h3>मेरी पिछली ड्यूटी</h3><div class="list" id="myDuty"></div></div>`;
  let webIv = null, webFor = null;
  const stopWeb = () => { if(webIv){ clearInterval(webIv); webIv=null; webFor=null; } };
  psub(stopWeb);
  // Android ऐप नहीं है (browser) — पेज खुला रहने तक हर 2 मिनट जाँच
  const startWeb = d => {
    if(NATIVE || webFor===d.id) return; stopWeb(); webFor=d.id;
    let sLat=d.startLat, sLng=d.startLng, warned=false;
    const tick = async () => { const p=await getPos(); if(!p) return;
      const up={lastLat:p.lat,lastLng:p.lng,lastAt:serverTimestamp()};
      if(sLat==null){ sLat=p.lat; sLng=p.lng; up.startLat=p.lat; up.startLng=p.lng; up.awayKm=0; }
      else up.awayKm=Math.round(kmBetween(sLat,sLng,p.lat,p.lng)*10)/10;
      if(up.awayKm>LIMIT_KM && !warned){ warned=true; try{navigator.vibrate?.([400,200,400]);}catch(e){} alert(`⚠️ आप ड्यूटी की जगह से ${up.awayKm} km दूर हैं। एडमिन को सूचना भेज दी गई है।`); }
      if(up.awayKm<=LIMIT_KM) warned=false;
      updateDoc(doc(db,"duty",d.id),up).catch(()=>{}); };
    tick(); webIv=setInterval(tick,120000);
  };
  psub(onSnapshot(query(collection(db,"duty"),where("uid","==",me.uid)), s => {
    const rows = s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(toD(b.start)||0)-(toD(a.start)||0));
    const open = rows.find(r=>!r.end);
    const box = $("#dutyBox"); if(!box) return;
    if(open){
      const away = open.awayKm>LIMIT_KM;
      box.innerHTML = `<div class="between"><h3 style="margin:0">ड्यूटी चालू है</h3><span class="pill ok">ON</span></div>
        <p class="muted">शुरू: ${fmtD(open.start)} ${fmtT(open.start)} · ${shiftName(open.shift)} शिफ्ट · अब तक ${fmtDur(open.start)}</p>
        <p class="muted">📍 ${NATIVE?"फ़ोन लॉक होने पर भी":"यह पेज खुला रहने तक"} हर 2 मिनट जगह जाँची जाती है। ${LIMIT_KM} km से दूर जाने पर एडमिन को सूचना जाती है।</p>
        ${away?`<p class="pill bad" style="font-size:14px">⚠️ आप ड्यूटी की जगह से ${open.awayKm} km दूर हैं</p>`:""}
        <button class="big bad" id="endBtn">ड्यूटी खत्म करें</button>`;
      $("#endBtn").onclick = async () => { if(!confirm("ड्यूटी खत्म करें?")) return; try{ await updateDoc(doc(db,"duty",open.id),{end:serverTimestamp()}); nativeStop(); stopWeb(); toast("ड्यूटी खत्म दर्ज हुई"); }catch(e){ toast(errMsg(e)); } };
      if(NATIVE) nativeStart(open.id, open.startLat, open.startLng); else startWeb(open);
    } else {
      stopWeb();
      const h = new Date().getHours();
      box.innerHTML = `<div class="between"><h3 style="margin:0">ड्यूटी बंद है</h3><span class="pill">OFF</span></div>
        <label>शिफ्ट</label><select id="sh"><option value="morning">सुबह</option><option value="evening">शाम</option></select>
        <div style="margin-top:12px"><button class="big ok" id="startBtn">ड्यूटी शुरू करें</button></div>
        <p class="muted">ड्यूटी शुरू करते समय फ़ोन की लोकेशन (Location) की अनुमति दें।</p>`;
      $("#sh").value = profile.shift || (h>=14 ? "evening" : "morning");
      $("#startBtn").onclick = async () => { const b=$("#startBtn"); b.disabled=true; b.textContent="जगह देख रहा है…";
        const p = await getPos();
        try{
          const r = await addDoc(collection(db,"duty"),{uid:me.uid,name:profile.name||me.email,shift:$("#sh").value,start:serverTimestamp(),end:null,
            startLat:p?p.lat:null,startLng:p?p.lng:null,lastLat:p?p.lat:null,lastLng:p?p.lng:null,awayKm:0,lastAt:serverTimestamp()});
          nativeStart(r.id, p?.lat, p?.lng);
          toast(p?"ड्यूटी शुरू दर्ज हुई":"ड्यूटी शुरू — पर लोकेशन नहीं मिली, Location चालू करें");
        }catch(e){ toast(errMsg(e)); b.disabled=false; b.textContent="ड्यूटी शुरू करें"; } };
    }
    $("#myDuty").innerHTML = rows.slice(0,30).map(r=>`<div class="between"><span>${fmtD(r.start)} · ${shiftName(r.shift)}<br><span class="muted">${fmtT(r.start)} – ${r.end?fmtT(r.end):"चालू"}</span></span><span class="pill ${r.end?"":"ok"}">${fmtDur(r.start,r.end)}</span></div>`).join("") || `<p class="muted">अभी कोई रिकॉर्ड नहीं</p>`;
  }, e => toast(errMsg(e))));
}

      try{
        if(b.dataset.a==="shift") await updateDoc(r,{shift:u.shift==="evening"?"morning":"evening"});
        if(b.dataset.a==="perm"){ if(!confirm(u.canEdit?"इस व्यक्ति से एडमिन अनुमति हटाएँ?":"इस व्यक्ति को बदलाव करने की अनुमति दें?")) return; await updateDoc(r,{canEdit:!u.canEdit}); }
        if(b.dataset.a==="kyc"){ return showKyc(u); }
        if(b.dataset.a==="act"){ if(!confirm(u.status==="pending"?"KYC देख ली? इस वर्कर को मंज़ूरी दें?":u.active===false?"अकाउंट चालू करें?":"अकाउंट बंद करें? ये व्यक्ति लॉगिन नहीं कर पाएगा।")) return; await updateDoc(r,{active:u.active===false,status:u.active===false?"approved":"blocked"}); }
        toast("बदलाव सेव हुआ");
      }catch(e){ toast(errMsg(e)); }
    });
  }, e=>toast(errMsg(e))));
}

/* ---------- COMMANDS (DIP Master AI Control Panel के कमांड बोर्ड वाला ही डेटा) ----------
   कमांड: {text, to:'all'|uid, toName, kind:'msg'|'duty'|'link', ref:link, autoOpen, by:uid, byName, createdAt}
   जवाब:  acks/{कमांडID_यूज़रID} = {cmd, uid, name, status:'seen'|'done', at} */
const cmdLink = c => { const l = c.ref || c.link || ""; return /^https?:\/\//.test(l) ? l : ""; };
const cmdTo = c => c.to || c.target || "all";
const myCmdQuery = () => query(collection(db,"commands"),where("to","in",["all",me.uid]),limit(100));
const sortCmds = s => s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(toD(b.createdAt)||9e15)-(toD(a.createdAt)||9e15));
const ack = (id,status) => setDoc(doc(db,"acks",id+"_"+me.uid),{cmd:id,uid:me.uid,name:profile?.name||me.email,status,at:serverTimestamp()});
let myAcks = {};
function watchCommands(){
  if(canEdit) return;
  let first = true;
  sub(onSnapshot(query(collection(db,"acks"),where("uid","==",me.uid),limit(500)), s => { myAcks={}; s.docs.forEach(d=>{ const a=d.data(); myAcks[a.cmd]=a.status; }); }, ()=>{}));
  sub(onSnapshot(myCmdQuery(), s => {
    const seen=JSON.parse(localStorage.getItem("mc_seen")||"[]");
    if(first) sortCmds(s).filter(c=>!seen.includes(c.id)&&!myAcks[c.id]).slice(0,5).reverse().forEach(c=>showCommandPopup(c.id,c));
    else s.docChanges().forEach(ch=>{ if(ch.type==="added" && !seen.includes(ch.doc.id)) showCommandPopup(ch.doc.id,ch.doc.data()); });
    first = false;
  }, ()=>{}));
}
function markSeen(id){ const seen=JSON.parse(localStorage.getItem("mc_seen")||"[]"); if(!seen.includes(id)){ seen.push(id); localStorage.setItem("mc_seen",JSON.stringify(seen.slice(-300))); } if(myAcks[id]!=="done") ack(id,"seen").catch(()=>{}); }
function showCommandPopup(id,c){
  const p=$("#popup"); if(!p.classList.contains("hidden")) { setTimeout(()=>showCommandPopup(id,c),1500); return; }
  try{ navigator.vibrate?.([300,150,300]); }catch(e){}
  const link = cmdLink(c);
  p.innerHTML = `<div class="card"><div class="between"><h3 style="margin:0">📢 एडमिन की कमांड</h3><span class="muted">${fmtT(c.createdAt)}</span></div>
    <p style="font-size:18px;white-space:pre-wrap">${linkify(c.text)}</p>
    ${link?`<p><a href="${esc(link)}" target="_blank" rel="noopener">${esc(link)}</a></p>`:""}
    <div class="row">${link?`<button class="sec" id="cOpen">खोलें</button>`:""}<button class="sec" id="cOk">देख लिया</button><button class="ok" id="cDone">✅ हो गया</button></div></div>`;
  p.classList.remove("hidden");
  const close = () => { markSeen(id); p.classList.add("hidden"); };
  $("#cOk").onclick = close;
  $("#cDone").onclick = () => { close(); ack(id,"done").then(()=>toast("✅ एडमिन को बता दिया")).catch(e=>toast(errMsg(e))); };
  if(link) $("#cOpen").onclick = () => { close(); window.open(link,"_blank"); };
  if(link && c.autoOpen){ close(); window.open(link,"_blank"); }
}
function pageCmd(){
  app.innerHTML = `${canEdit?`<div class="card"><h3>नई कमांड भेजें</h3>
    <label>किसे</label><select id="ct"><option value="all">सभी वर्कर</option></select>
    <label>संदेश / काम</label><textarea id="cx" maxlength="1000" placeholder="जैसे: आज 10 बजे सभी ट्रेनिंग कॉल पर आएँ"></textarea>
    <label>लिंक (वैकल्पिक: फ़ाइल, वीडियो, कॉल)</label><input id="cl" type="url" placeholder="https://">
    <label class="row" style="color:var(--ink)"><input type="checkbox" id="ca" style="width:auto;flex:none"> <span>वर्कर के फ़ोन पर लिंक अपने आप खुल जाए</span></label>
    <div style="margin-top:12px"><button id="cs" style="width:100%">भेजें</button></div>
    <p class="muted">यही कमांड DIP Master AI के ऐप बोर्ड (👷) में भी दिखती है।</p></div>`:""}
    <div class="card"><h3>${canEdit?"भेजी गई कमांड":"मेरी सूचनाएँ"}</h3><div class="list" id="clist"></div></div>`;
  let users = [], acks = [], rows = [];
  const draw = () => {
    const el=$("#clist"); if(!el) return;
    const act = users.filter(u=>u.role!=="admin" && u.active!==false).length;
    el.innerHTML = rows.map(c=>{ const to=cmdTo(c), link=cmdLink(c);
      const A=acks.filter(a=>a.cmd===c.id), dn=A.filter(a=>a.status==="done"), sn=A.filter(a=>a.status==="seen"), mine=canEdit?null:myAcks[c.id];
      return `<div><div class="between"><span class="muted">${fmtD(c.createdAt)} ${fmtT(c.createdAt)} · ${to==="all"?"सभी":esc(c.toName||users.find(u=>u.id===to)?.name||"एक वर्कर")}${c.byName?" · "+esc(c.byName):""}</span>${canEdit?`<button class="sec sm" data-del="${c.id}">हटाएँ</button>`:""}</div>
      <div style="white-space:pre-wrap;margin-top:4px">${linkify(c.text)}</div>${link?`<a href="${esc(link)}" target="_blank" rel="noopener">${esc(link)}</a>`:""}
      ${canEdit?`<div class="muted" style="margin-top:4px">✅ हो गया: ${dn.length}/${to==="all"?act:1}${dn.length?" ("+esc(dn.map(a=>a.name).join(", "))+")":""}<br>👁 सिर्फ़ देखा: ${sn.length}${sn.length?" ("+esc(sn.map(a=>a.name).join(", "))+")":""}</div>`
        : mine==="done"?`<span class="pill ok">✅ हो गया</span>`:`<button class="ok sm" data-done="${c.id}" style="margin-top:6px">✅ हो गया</button>`}</div>`; }).join("") || `<p class="muted">अभी कुछ नहीं</p>`;
    el.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{ if(!confirm("ये कमांड हटाएँ?")) return; const id=b.dataset.del;
      try{ await deleteDoc(doc(db,"commands",id)); acks.filter(a=>a.cmd===id).forEach(a=>deleteDoc(doc(db,"acks",id+"_"+a.uid)).catch(()=>{})); }catch(e){ toast(errMsg(e)); } });
    el.querySelectorAll("[data-done]").forEach(b=>b.onclick=async()=>{ b.disabled=true; try{ await ack(b.dataset.done,"done"); myAcks[b.dataset.done]="done"; markSeen(b.dataset.done); draw(); toast("✅ एडमिन को बता दिया"); }catch(e){ toast(errMsg(e)); b.disabled=false; } });
  };
  if(canEdit){
    psub(onSnapshot(collection(db,"users"), s => { users = s.docs.map(d=>({id:d.id,...d.data()})); const sel=$("#ct"); if(!sel) return; const v=sel.value; sel.innerHTML=`<option value="all">सभी वर्कर</option>`+users.filter(u=>u.id!==OWNER_UID&&u.role!=="admin").map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join(""); sel.value=v||"all"; draw(); }));
    psub(onSnapshot(query(collection(db,"acks"),orderBy("at","desc"),limit(1500)), s => { acks=s.docs.map(d=>d.data()); draw(); }, ()=>{}));
    $("#cs").onclick = async () => {
      const text=$("#cx").value.trim(), link=$("#cl").value.trim();
      if(!text) return toast("संदेश लिखें");
      if(link && !/^https:\/\//.test(link)) return toast("लिंक https:// से शुरू होना चाहिए");
      const to=$("#ct").value, u=users.find(x=>x.id===to);
      try{ await addDoc(collection(db,"commands"),{text,to,toName:u?u.name:"सब",kind:link?"link":"msg",ref:link,autoOpen:$("#ca").checked,by:me.uid,byName:profile.name||"Admin",createdAt:serverTimestamp()}); $("#cx").value="";$("#cl").value="";$("#ca").checked=false; toast("कमांड भेजी गई"); }catch(e){ toast(errMsg(e)); }
    };
    psub(onSnapshot(query(collection(db,"commands"),orderBy("createdAt","desc"),limit(60)), s => { rows=sortCmds(s); draw(); }, e=>toast(errMsg(e))));
  } else {
    psub(onSnapshot(myCmdQuery(), s => { rows=sortCmds(s); rows.forEach(c=>{ if(!myAcks[c.id]) markSeen(c.id); }); draw(); }, e=>toast(errMsg(e))));
  }
}

/* ---------- FILES ---------- */
function pageFiles(){
  app.innerHTML = `${canEdit?`<div class="card"><h3>फ़ाइल / लिंक शेयर करें</h3>
    <label>नाम</label><input id="fn" placeholder="जैसे: ट्रेनिंग वीडियो 1">
    <label>लिंक (Google Drive, YouTube आदि)</label><input id="fl" type="url" placeholder="https://">
    <label>नोट (वैकल्पिक)</label><input id="fx">
    <div style="margin-top:12px"><button id="fs" style="width:100%">शेयर करें</button></div>
    <p class="muted">Google Drive की फ़ाइल हो तो उसकी शेयरिंग "Anyone with the link" रखें।</p></div>`:""}
    <div class="card"><h3>फ़ाइलें</h3><div class="list" id="flist"></div></div>`;
  if(canEdit) $("#fs").onclick = async () => {
    const title=$("#fn").value.trim(), url=$("#fl").value.trim(), note=$("#fx").value.trim();
    if(!title||!/^https?:\/\//.test(url)) return toast("नाम और सही लिंक (https://) डालें");
    try{ await addDoc(collection(db,"files"),{title,url,note,by:me.uid,createdAt:serverTimestamp()}); ["#fn","#fl","#fx"].forEach(s=>$(s).value=""); toast("शेयर हो गया"); }catch(e){ toast(errMsg(e)); }
  };
  psub(onSnapshot(query(collection(db,"files"),orderBy("createdAt","desc"),limit(100)), s => {
    const el=$("#flist"); if(!el) return;
    el.innerHTML = s.docs.map(d=>{ const f=d.data(); return `<div><div class="between"><b>${esc(f.title)}</b><span class="muted">${fmtD(f.createdAt)}</span></div>
      ${f.note?`<div class="muted">${esc(f.note)}</div>`:""}
      <div class="row" style="margin-top:8px"><button class="ok sm" data-open="${esc(f.url)}">खोलें / डाउनलोड</button><button class="sec sm" data-copy="${esc(f.url)}">लिंक कॉपी</button>${canEdit?`<button class="sec sm" data-del="${d.id}">हटाएँ</button>`:""}</div></div>`; }).join("") || `<p class="muted">अभी कोई फ़ाइल नहीं</p>`;
    el.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>window.open(b.dataset.open,"_blank"));
    el.querySelectorAll("[data-copy]").forEach(b=>b.onclick=async()=>{ try{ await navigator.clipboard.writeText(b.dataset.copy); toast("लिंक कॉपी हुआ"); }catch(e){ prompt("लिंक कॉपी करें:",b.dataset.copy); } });
    el.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{ if(confirm("ये फ़ाइल हटाएँ?")) try{ await deleteDoc(doc(db,"files",b.dataset.del)); }catch(e){ toast(errMsg(e)); } });
  }, e=>toast(errMsg(e))));
}

/* ---------- DIP MASTER CONTROL ---------- */
function pageDip(){
  app.innerHTML = `<div class="card"><div class="between"><span><h3 style="margin:0">DIP Master AI</h3><span class="muted" id="dipSt">लोड हो रहा है…</span></span>${canEdit?`<button class="switch" id="dipSw" aria-label="DIP Master चालू/बंद"></button>`:`<span class="pill" id="dipPill">—</span>`}</div></div>
    ${canEdit?`<div class="card"><h3>ग्राहकों के लिए मैसेज</h3><p class="muted">DIP Master AI ऐप में सबको दिखेगा (बंद करते समय कारण लिख सकते हैं)।</p><textarea id="dipMsg" maxlength="300"></textarea><div style="margin-top:8px"><button class="sec" id="dipMsgSave" style="width:100%">मैसेज सेव करें</button></div></div>`:""}
    ${canEdit?`<div class="card"><h3>नया ग्राहक जोड़ें</h3><label>नाम</label><input id="dn"><label>फ़ोन (वैकल्पिक)</label><input id="dp" inputmode="tel"><label>नोट (वैकल्पिक)</label><input id="dx"><div style="margin-top:12px"><button id="da" style="width:100%">जोड़ें</button></div></div>`:""}
    ${canEdit?`<div class="card"><h3>ग्राहक लिस्ट</h3><div class="list" id="dl"></div></div>`:""}`;
  let on = false;
  psub(onSnapshot(doc(db,"dip","control"), s => {
    const d = s.exists()? s.data() : {}; on = (d.on ?? d.enabled) === true; if(canEdit && $("#dipMsg") && document.activeElement!==$("#dipMsg")) $("#dipMsg").value = d.msg || "";
    $("#dipSt").textContent = (on?"चालू":"बंद") + (d.updatedAt?` · ${fmtD(d.updatedAt)} ${fmtT(d.updatedAt)}`:"");
    if(canEdit) $("#dipSw").classList.toggle("on",on); else { const p=$("#dipPill"); p.textContent=on?"चालू":"बंद"; p.className="pill "+(on?"ok":"bad"); }
  }, e=>toast(errMsg(e))));
  if(canEdit){
    $("#dipSw").onclick = async () => { if(!confirm(on?"DIP Master AI बंद करें?":"DIP Master AI चालू करें?")) return; try{ await setDoc(doc(db,"dip","control"),{on:!on,enabled:!on,updatedAt:serverTimestamp(),by:me.uid},{merge:true}); toast(on?"बंद किया":"चालू किया"); }catch(e){ toast(errMsg(e)); } };
    $("#dipMsgSave").onclick = async () => { try{ await setDoc(doc(db,"dip","control"),{msg:$("#dipMsg").value.trim(),updatedAt:serverTimestamp(),by:me.uid},{merge:true}); toast("मैसेज सेव हुआ"); }catch(e){ toast(errMsg(e)); } };
    $("#da").onclick = async () => { const name=$("#dn").value.trim(); if(!name) return toast("नाम लिखें"); try{ await addDoc(collection(db,"dipCustomers"),{name,phone:$("#dp").value.trim(),note:$("#dx").value.trim(),active:true,createdAt:serverTimestamp()}); ["#dn","#dp","#dx"].forEach(s=>$(s).value=""); toast("ग्राहक जुड़ा"); }catch(e){ toast(errMsg(e)); } };
  }
  if(canEdit) psub(onSnapshot(query(collection(db,"dipCustomers"),orderBy("createdAt","desc"),limit(300)), s => {
    const el=$("#dl"); if(!el) return;
    el.innerHTML = s.docs.map(d=>{ const c=d.data(); return `<div class="between"><span><b>${esc(c.name)}</b> ${c.active===false?'<span class="pill bad">बंद</span>':''}<br><span class="muted">${esc(c.phone||"")}${c.note?" · "+esc(c.note):""}</span></span>
      ${canEdit?`<span class="row" style="flex:none"><button class="sec sm" data-t="${d.id}" data-v="${c.active===false?1:0}">${c.active===false?"चालू":"बंद"}</button><button class="sec sm" data-del="${d.id}">हटाएँ</button></span>`:""}</div>`; }).join("") || `<p class="muted">अभी कोई ग्राहक नहीं</p>`;
    el.querySelectorAll("[data-t]").forEach(b=>b.onclick=async()=>{ try{ await updateDoc(doc(db,"dipCustomers",b.dataset.t),{active:b.dataset.v==="1"}); }catch(e){ toast(errMsg(e)); } });
    el.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{ if(confirm("ये ग्राहक हटाएँ?")) try{ await deleteDoc(doc(db,"dipCustomers",b.dataset.del)); }catch(e){ toast(errMsg(e)); } });
  }, e=>toast(errMsg(e))));
}
</script>
