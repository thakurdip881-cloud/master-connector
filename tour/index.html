<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DIP Tour & Travels</title><meta name="theme-color" content="#0b5d4b"><link rel="icon" href="logo-192.jpg"><link rel="apple-touch-icon" href="logo-192.jpg">
<style>
.req::after{content:" *";color:#e11;font-weight:700}

:root{--bg:#f3f5f9;--card:#fff;--ink:#14213d;--muted:#667085;--line:#e3e7ee;--pri:#0b5d4b;--pri2:#0e8a6a;--ok:#12805c;--okbg:#e3f6ee;--bad:#c0392b;--badbg:#fdecea;--warn:#a46300;--warnbg:#fff4de}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif;background:var(--bg);color:var(--ink);font-size:16px}
header{background:var(--pri);color:#fff;padding:14px 16px calc(14px);position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:18px;margin:0;letter-spacing:.5px}
header small{display:block;font-size:12px;opacity:.8;font-weight:400}
main{padding:14px 14px 90px;max-width:720px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:16px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff;color:var(--ink)}
textarea{min-height:80px;resize:vertical}
button{font:inherit;border:0;border-radius:10px;padding:11px 14px;background:var(--pri2);color:#fff;cursor:pointer}
button.sec{background:#e8eef7;color:var(--pri)}
button.bad{background:var(--bad)}
button.ok{background:var(--ok)}
button.sm{padding:7px 10px;font-size:13px}
button:disabled{opacity:.5}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.muted{color:var(--muted);font-size:13px}
.pill{display:inline-block;font-size:12px;padding:3px 9px;border-radius:99px;background:#eef1f6;color:var(--muted)}
.pill.ok{background:var(--okbg);color:var(--ok)}
.pill.bad{background:var(--badbg);color:var(--bad)}
.pill.warn{background:var(--warnbg);color:var(--warn)}
.list>div{padding:10px 0;border-top:1px solid var(--line)}
.list>div:first-child{border-top:0}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;background:none;color:var(--muted);border-radius:0;padding:10px 2px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button b{font-size:20px;font-weight:400}
nav button.on{color:var(--pri2)}
.big{font-size:22px;padding:18px;width:100%;border-radius:14px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{font-size:24px;display:block}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#14213d;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;max-width:90%}
.hidden{display:none!important}
.popup{position:fixed;inset:0;background:rgba(10,20,40,.55);z-index:30;display:flex;align-items:center;justify-content:center;padding:20px}
.popup .card{max-width:420px;width:100%}
a{color:var(--pri2);word-break:break-all}
.switch{width:64px;height:36px;border-radius:99px;background:#cfd6e2;position:relative;flex:none;padding:0}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:28px;height:28px;border-radius:50%;background:#fff;transition:.2s}
.switch.on{background:var(--ok)}
.switch.on::after{left:32px}
.diya{position:relative;display:inline-block;width:var(--s);height:var(--s);border-radius:50%;overflow:hidden;flex:none;vertical-align:middle}
.diya img.b{width:100%;height:100%;display:block}
.diya .g{position:absolute;left:50%;top:37%;width:62%;height:62%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,205,120,.6),rgba(255,150,60,.2) 45%,transparent 70%);mix-blend-mode:screen;pointer-events:none;animation:dglow 2.6s ease-in-out infinite}
.diya img.f{position:absolute;left:41.6%;top:21.9%;width:16.4%;height:22.5%;transform-origin:50% 100%;filter:drop-shadow(0 0 5px rgba(255,190,90,.85));animation:dsway 3.2s ease-in-out infinite}
@keyframes dsway{0%,100%{transform:rotate(-3deg) scaleY(1)}25%{transform:rotate(2deg) scaleY(1.06)}50%{transform:rotate(4deg) scaleY(.96)}75%{transform:rotate(-1.5deg) scaleY(1.04)}}
@keyframes dglow{0%,100%{opacity:.5;transform:translate(-50%,-50%) scale(.88)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}}
@media (prefers-reduced-motion:reduce){.diya img.f,.diya .g{animation:none}}
.diyaBig{text-align:center;margin:4px 0 10px}

.chat{max-height:46vh;overflow:auto;display:flex;flex-direction:column;gap:6px;padding:6px 0}
.msg{max-width:82%;padding:8px 11px;border-radius:12px;font-size:15px;white-space:pre-wrap;word-break:break-word}
.msg.me{align-self:flex-end;background:#d9f5ec}.msg.them{align-self:flex-start;background:#eef1f6}
.msg small{display:block;font-size:11px;color:#667085;margin-top:2px}
.sup a{text-decoration:none}.sup button{width:100%;margin-top:8px}
</style></head><body>
<header><div style="display:flex;align-items:center;gap:10px"><img src="logo-192.jpg" alt="DIP" style="width:46px;height:46px;border-radius:50%;border:2px solid #f5c518;flex:none"><h1>DIP Tour & Travels<small id="who">लोड हो रहा है…</small></h1></div><button class="sec sm hidden" id="out">लॉग आउट</button></header>
<a id="getApk" href="https://github.com/thakurdip881-cloud/master-connector/releases/download/tour-apk-v1/DipTour.apk" style="display:none;margin:8px 12px 0;padding:11px;border-radius:12px;background:#f5c518;color:#0b5d4b;font-weight:800;text-align:center;text-decoration:none">📱 DIP Tour & Travels ऐप डाउनलोड करें</a>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

const app0=initializeApp({apiKey:"AIzaSyApw_GttyXeEmHFvKlJjoQFI11KuL4ahxI",authDomain:"master-connector-f2a0d.firebaseapp.com",projectId:"master-connector-f2a0d",storageBucket:"master-connector-f2a0d.firebasestorage.app",messagingSenderId:"542800382335",appId:"1:542800382335:web:8bf9d3ac9ad3b7906bb24a"},"tour");
const auth=getAuth(app0), db=getFirestore(app0); setPersistence(auth,browserLocalPersistence).catch(()=>{});
const DOM="customer.diptour.app", OWNER_MAIL="thakurdip881@gmail.com";

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const toast=t=>{ const e=$("#toast"); e.textContent=t; e.classList.remove("hidden"); clearTimeout(e._t); e._t=setTimeout(()=>e.classList.add("hidden"),3200); };
const mob=x=>{ let d=String(x||"").replace(/[\s\-+]/g,""); if(/^91\d{10}$/.test(d)) d=d.slice(2); if(/^0\d{10}$/.test(d)) d=d.slice(1); return /^[6-9]\d{9}$/.test(d)?d:""; };
const toD=v=>v?.toDate?v.toDate():null, fT=v=>{ const d=toD(v); return d?d.toLocaleString("hi-IN",{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"}):""; };
const mailCopy=(subject,data,cc)=>{ try{ fetch("https://formsubmit.co/ajax/"+OWNER_MAIL,{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify({_subject:subject,_template:"table",_captcha:"false",...(cc?{_cc:cc}:{}),...data})}).catch(()=>{}); }catch(_){} };
const shrink=(f,max,q)=>new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>{ const im=new Image(); im.onload=()=>{ const k=Math.min(1,max/Math.max(im.width,im.height)), c=document.createElement("canvas"); c.width=Math.round(im.width*k); c.height=Math.round(im.height*k); c.getContext("2d").drawImage(im,0,0,c.width,c.height); res(c.toDataURL("image/jpeg",q)); }; im.onerror=rej; im.src=r.result; }; r.onerror=rej; r.readAsDataURL(f); });
const errM=e=>{ const c=String(e?.code||""); return c.includes("invalid-credential")||c.includes("wrong-password")||c.includes("user-not-found")?"मोबाइल नंबर या पासवर्ड गलत है":c.includes("email-already-in-use")?"इस मोबाइल से अकाउंट पहले से है — लॉगिन करें":c.includes("network")?"इंटरनेट नहीं है":c.includes("too-many")?"बहुत बार कोशिश — थोड़ी देर बाद":"कुछ गड़बड़ हुई, दोबारा कोशिश करें"; };

$("#out").onclick=async()=>{ if(confirm("लॉग आउट करें?")){ clear(); await signOut(auth); } };

function showAuth(reg){
  $("#who").textContent="ग्राहक लॉगिन"; $("#out").classList.add("hidden");

    <label class="req">ID नंबर</label><input id="rI" autocapitalize="characters" inputmode="numeric" placeholder="1234 5678 9012"><p class="muted" id="rIh">आधार: सुरक्षा के लिए सिर्फ़ आखिरी 4 अंक सेव होंगे।</p>

    <label class="req">पासवर्ड फिर से</label><input id="rP2" type="password" autocomplete="new-password">

  :`${last.name?`<div style="background:#e8f6f1;border-radius:12px;padding:10px;margin:6px 0"><b>👋 ${esc(last.name)}</b><br><span class="muted">📱 ${esc(last.id||"")}</span></div>`:""}
    <label>मोबाइल नंबर</label><input id="lM" inputmode="numeric" maxlength="13" value="${esc(last.id||"")}">
    <label>पासवर्ड</label><div class="row" style="gap:6px"><input id="lP" type="password" autocomplete="current-password" style="flex:1"><button type="button" class="sec" id="lEye" style="width:auto;flex:none">👁️</button></div>
    <button id="lGo" style="width:100%;margin-top:12px">लॉगिन करें</button><p class="muted">पासवर्ड भूल गए? सपोर्ट पर WhatsApp/Telegram करें।</p>`}</div>`;
  $("#tL").onclick=()=>showAuth(false); $("#tR").onclick=()=>showAuth(true);
  if(!reg){ $("#lEye").onclick=()=>{ const p=$("#lP"); p.type=p.type==="password"?"text":"password"; };
    $("#lGo").onclick=async()=>{ const m=mob($("#lM").value), p=$("#lP").value.trim(); if(!m) return toast("सही मोबाइल नंबर डालें"); if(!p) return toast("पासवर्ड डालें");
      const b=$("#lGo"); b.disabled=true; try{ await signInWithEmailAndPassword(auth,m+"@"+DOM,p); }catch(e){ toast(errM(e)); } b.disabled=false; }; return; }

  $("#rIt").onchange=fixI;
  $("#rI").oninput=e=>{ if($("#rIt").value!=="aadhaar") return; const d=e.target.value.replace(/\D/g,"").slice(0,12); e.target.value=d.replace(/(\d{4})(?=\d)/g,"$1 "); };

    ${[["fb","📘 Facebook","#1877F2"],["ig","📸 Instagram","#C13584"],["yt","▶️ YouTube","#FF0000"],["x","𝕏 X (Twitter)","#111"],["web","🌐 वेबसाइट","#0b5d4b"]].map(([k,l,c])=>/^https?:\/\//.test(cfg[k]||"")?`<a href="${esc(cfg[k])}" target="_blank" rel="noopener"><button style="background:${c}">${l}</button></a>`:"").join("")}

  subs.push(onSnapshot(query(collection(db,"tNotice"),limit(30)),s=>{ const r=s.docs.map(d=>d.data()).sort((a,b)=>(toD(b.at)||new Date())-(toD(a.at)||new Date())).slice(0,10);
    const yt=l=>{ const m=String(l).match(/(?:youtu\.be\/|v=|shorts\/)([\w-]{11})/); return m?m[1]:""; };
    $("#nList").innerHTML=r.map(n=>{ const ok=/^https?:\/\//.test(n.link||""), y=ok&&yt(n.link); return `<div>${n.text?`<p style="margin:0 0 4px;white-space:pre-wrap">${esc(n.text)}</p>`:""}${y?`<a href="${esc(n.link)}" target="_blank" rel="noopener"><img src="https://i.ytimg.com/vi/${y}/mqdefault.jpg" style="width:100%;border-radius:10px" alt="YouTube"></a>`:""}${ok?`<a href="${esc(n.link)}" target="_blank" rel="noopener">${/wa\.me|whatsapp/.test(n.link)?"💬 WhatsApp खोलें":y?"▶️ YouTube पर देखें":"🔗 लिंक खोलें"}</a>`:""}<br><span class="muted">${fT(n.at)}</span></div>`; }).join("")||`<p class="muted">अभी कोई सूचना नहीं</p>`; },()=>{ const e=$("#ntc"); if(e) e.classList.add("hidden"); }));
  subs.push(onSnapshot(query(collection(db,"tMsgs"),where("uid","==",user.uid),limit(300)),s=>{ const r=s.docs.map(d=>d.data()).sort((a,b)=>(toD(a.at)||new Date())-(toD(b.at)||new Date()));
    const c=$("#chat"); c.innerHTML=r.map(m=>`<div class="msg ${m.from==="c"?"me":"them"}">${esc(m.text)}<small>${m.from==="c"?"आप":"DIP Tour"} · ${fT(m.at)}</small></div>`).join("")||`<p class="muted">यहाँ DIP Tour & Travels से सीधे बात करें</p>`; c.scrollTop=c.scrollHeight; },()=>{}));
  subs.push(onSnapshot(query(collection(db,"tDocs"),where("uid","==",user.uid),limit(50)),s=>{ $("#docs").innerHTML=s.docs.map(d=>{ const x=d.data(); return `<div class="between"><span>📄 ${esc(x.name||"डॉक्यूमेंट")}<br><span class="muted">${fT(x.at)}</span></span>${/^data:image\/jpeg;base64,/.test(x.img||"")?`<img src="${x.img}" style="width:48px;height:48px;object-fit:cover;border-radius:8px">`:""}</div>`; }).join("")||`<p class="muted">अभी कोई डॉक्यूमेंट नहीं</p>`; },()=>{}));
  $("#mS").onclick=async()=>{ const t=$("#mT").value.trim(); if(!t) return; $("#mS").disabled=true;
    try{ await addDoc(collection(db,"tMsgs"),{uid:user.uid,from:"c",text:t.slice(0,500),at:serverTimestamp()}); $("#mT").value=""; mailCopy("💬 ग्राहक संदेश — "+me.name,{"ग्राहक":me.name,"मोबाइल":me.mobile,"संदेश":t,"समय":new Date().toLocaleString("hi-IN")},me.mail); }catch(e){ toast(errM(e)); } $("#mS").disabled=false; };
  $("#mT").onkeydown=e=>{ if(e.key==="Enter") $("#mS").click(); };
  $("#dF").onchange=async e=>{ const f=e.target.files[0]; if(!f) return; toast("⏳ अपलोड हो रहा है…");
    try{ const img=await shrink(f,1000,0.6); if(img.length>700000) return toast("फ़ाइल बहुत बड़ी है"); const nm=$("#dN").value.trim()||"डॉक्यूमेंट";
      await addDoc(collection(db,"tDocs"),{uid:user.uid,name:nm.slice(0,40),img,at:serverTimestamp()}); $("#dN").value=""; e.target.value=""; toast("✅ डॉक्यूमेंट जुड़ गया");
      mailCopy("📄 ग्राहक डॉक्यूमेंट — "+me.name,{"ग्राहक":me.name,"मोबाइल":me.mobile,"डॉक्यूमेंट":nm,"समय":new Date().toLocaleString("hi-IN"),"देखें":"MASTER CONNECTOR → 🧳 टूर"},me.mail);
    }catch(_){ toast("अपलोड नहीं हुआ, दोबारा करें"); } };
}
onAuthStateChanged(auth,u=>{ if(!u) return showAuth(false); if(!String(u.email||"").endsWith("@"+DOM)){ app.innerHTML=`<div class="card">यह ग्राहक ऐप है। वर्कर/एडमिन MASTER CONNECTOR इस्तेमाल करें। <button class="sec sm" id="o2">लॉग आउट</button></div>`; $("#o2").onclick=()=>signOut(auth); return; } showHome(u); });
</script></body></html>
