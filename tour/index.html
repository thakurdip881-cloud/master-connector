  GUIDE=reg?"नया रजिस्ट्रेशन। अपना पूरा नाम, मोबाइल नंबर, जीमेल और आईडी भरें। फिर पासवर्ड बनाएँ। सबसे नीचे अपने दोस्त का आठ अंक का आईडी भरें, जिसने आपको लिंक भेजा। लिंक से आए हैं तो यह अपने-आप भरा होगा। अभी नहीं पता तो सात दिन के अंदर भर सकते हैं। आखिर में सहमति पर टिक लगाकर रजिस्टर करें दबाएँ।":"लॉगिन। अपना मोबाइल नंबर और पासवर्ड डालकर लॉगिन करें दबाएँ। पहली बार आए हैं तो ऊपर नया रजिस्ट्रेशन दबाएँ।";
  $("#tL").onclick=()=>{ custRecDrop(); showAuth(false); }; $("#tR").onclick=()=>showAuth(true);
  if(reg) custRecStart();
  if(!reg){ $("#lEye").onclick=()=>{ const p=$("#lP"); p.type=p.type==="password"?"text":"password"; };
    $("#lGo").onclick=async()=>{ const m=mob($("#lM").value), p=$("#lP").value.trim(); if(!m) return toast("सही मोबाइल नंबर डालें"); if(!p) return toast("पासवर्ड डालें");
      const b=$("#lGo"); b.disabled=true; try{ await signInWithEmailAndPassword(auth,m+"@"+DOM,p); try{ const L=JSON.parse(localStorage.getItem("tourLast")||"{}"); L.id=m; L.pw=$("#lS").checked?p:""; localStorage.setItem("tourLast",JSON.stringify(L)); }catch(_){} }catch(e){ toast(errM(e)); } b.disabled=false; }; return; }
  const fixI=()=>{ const t=$("#rIt").value; $("#rI").inputMode=t==="aadhaar"?"numeric":"text"; $("#rI").placeholder=t==="aadhaar"?"1234 5678 9012":t==="pan"?"ABCDE1234F":""; $("#rIh").textContent=t==="aadhaar"?"आधार: सुरक्षा के लिए सिर्फ़ आखिरी 4 अंक सेव होंगे।":""; $("#rI").value=""; };
  $("#rIt").onchange=fixI;
  $("#rI").oninput=e=>{ if($("#rIt").value!=="aadhaar") return; const d=e.target.value.replace(/\D/g,"").slice(0,12); e.target.value=d.replace(/(\d{4})(?=\d)/g,"$1 "); };
  $("#rGo").onclick=async()=>{ const name=$("#rN").value.trim(), m=mob($("#rM").value), wa=mob($("#rW").value)||m, mail=$("#rE").value.trim().toLowerCase(), tg=$("#rT").value.trim().replace(/^@?/,""), it=$("#rIt").value, raw=$("#rI").value.replace(/[\s-]/g,"").toUpperCase(), p=$("#rP").value;
    if(name.length<3) return toast("पूरा नाम लिखें"); if(!m) return toast("सही 10 अंक का मोबाइल नंबर डालें"); if($("#rW").value && !mob($("#rW").value)) return toast("WhatsApp नंबर सही नहीं");
    if(!/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/.test(mail)) return toast("सही Gmail लिखें"); if(tg && !/^[A-Za-z0-9_]{5,32}$/.test(tg)) return toast("Telegram ID सही नहीं");
    if(it==="aadhaar" && !/^[2-9]\d{11}$/.test(raw)) return toast("आधार 12 अंक का होना चाहिए"); if(it==="pan" && !/^[A-Z]{5}\d{4}[A-Z]$/.test(raw)) return toast("PAN सही नहीं"); if(raw.length<5) return toast("ID नंबर सही डालें");
    if(p.length<6) return toast("पासवर्ड कम से कम 6 अक्षर"); if(p!==$("#rP2").value) return toast("दोनों पासवर्ड एक जैसे नहीं"); if(!$("#rC").checked) return toast("सहमति पर ✔ लगाएँ");
    const rc=$("#rRef").value.replace(/[^A-Za-z0-9]/g,"").toUpperCase(); let refUid="";
    if(rc){ if(!/^(\d{8}|DIP[A-Z0-9]{4,6})$/.test(rc)) return toast("दोस्त का ID 8 अंक का होना चाहिए (जैसे 13174393)"); try{ const g=await getDoc(doc(db,"refCodes",rc)); if(!g.exists()) return toast("यह ID नहीं मिला — अपने दोस्त से दोबारा पूछें"); refUid=g.data().uid; }catch(_){ return toast("रेफर ID जाँच नहीं हो पाई, इंटरनेट देखें"); } }
    else if(REF && !/^(\d{8}|DIP.*)$/i.test(REF)) refUid=REF;   // पुराना लंबा link
    const idNo=it==="aadhaar"?"XXXX-XXXX-"+raw.slice(-4):raw, b=$("#rGo"); b.disabled=true; b.textContent="रजिस्टर हो रहा है…";
    try{ const c=await createUserWithEmailAndPassword(auth,m+"@"+DOM,p);
      const rec={uid:c.user.uid,name,mobile:m,wa,mail,tg:tg?"@"+tg:"",idType:it,idNo,consent:true,at:serverTimestamp(),...(rc&&refUid?{refCode:rc}:{})};
      try{ sessionStorage.setItem("tourNew","1"); }catch(_){}
      b.textContent="🎥 वीडियो भेजा जा रहा है…"; try{ const bl=await custRecFinish(); if(bl) await custVidUpload(c.user.uid,bl); }catch(_){}
      try{ await setDoc(doc(db,"tCustomers",c.user.uid),refUid?{...rec,ref:refUid}:rec); }catch(e1){ if(!refUid) throw e1; const {refCode,...r2}=rec; await setDoc(doc(db,"tCustomers",c.user.uid),r2); }
      try{ localStorage.setItem("tourLast",JSON.stringify({name,id:m,pw:$("#rS")&&$("#rS").checked?p:""})); }catch(_){}
      mailCopy("🧳 नया ग्राहक — "+name,{"नाम":name,"मोबाइल":m,"WhatsApp":wa,"Gmail":mail,"Telegram":tg?"@"+tg:"—","ID":it+": "+idNo,"रेफर ID":rc||(refUid?"पुराना link":"—"),"समय":new Date().toLocaleString("hi-IN")},mail);
      toast("✅ रजिस्ट्रेशन हो गया");
    }catch(e){ toast(errM(e)); b.disabled=false; b.textContent="✅ रजिस्टर करें"; } };
}

async function showHome(user){
  clear(); $("#out").classList.remove("hidden");
  let me=null; try{ const s=await getDoc(doc(db,"tCustomers",user.uid)); me=s.exists()?s.data():null; }catch(_){}
  if(!me){ app.innerHTML=`<div class="card">आपका ग्राहक रिकॉर्ड नहीं मिला। सपोर्ट से संपर्क करें।</div>`; return; }
  try{ const L=JSON.parse(localStorage.getItem("tourLast")||"{}"); localStorage.setItem("tourLast",JSON.stringify({...L,name:me.name,id:me.mobile})); }catch(_){}
  $("#who").textContent=me.name+" · ग्राहक";
  let cfg={}; try{ const c=await getDoc(doc(db,"tour","config")); cfg=c.exists()?c.data():{}; }catch(_){} if(!cfg.wa) cfg.wa="8691019233"; if(!cfg.tg1) cfg.tg1="@WorkforhomeIndia";
  const tgA=t=>String(t||"").replace(/^@/,""), custId="C"+String(me.mobile||"").slice(-4)+String(user.uid).slice(0,3).toUpperCase();
  // 🆔 दोस्त का ID: 7 दिन तक छूट (हर बार याद), 7 दिन बाद भरे बिना आगे बंद · भरते ही याद दिलाना बंद
  let refHtml="", refLeft=0;
  if(!me.ref){
    const days=Math.floor((Date.now()-(toD(me.at)?.getTime()||Date.now()))/864e5); refLeft=Math.max(0,7-days); const block=refLeft<=0;
    refHtml=`<div class="card" style="border:2px solid ${block?"#c0262d":"#d97706"};background:#fff7e6"><h3 style="margin:0">${block?"🔒 दोस्त का ID भरें — तभी आगे खुलेगा":"⏳ याद दिलाना: दोस्त का ID भरें"}</h3>
      <p style="margin:6px 0">जिस दोस्त ने आपको link भेजा, उससे उसका <b>8 अंक का ID</b> पूछें और नीचे भरें। ${block?"<b>7 दिन पूरे हो गए — ID भरे बिना आगे का काम बंद है।</b>":`अभी आप काम जारी रख सकते हैं — <b>${refLeft} दिन बाकी</b>, उसके बाद ID भरे बिना आगे का काम रुक जाएगा।`}</p>
      <p class="muted" style="margin:0 0 6px">🆔 आपका अपना ID: <b>${esc(custId)}</b> (यह आपका है, अलग है)</p>
      <label class="req">🆔 दोस्त का ID</label><input id="gRef" inputmode="numeric" maxlength="12" placeholder="13174393" value="${esc(/^(\d{8}|DIP[A-Z0-9]{4,6})$/i.test(REF)?REF.toUpperCase():"")}">
      <button id="gGo" class="ok" style="width:100%;margin-top:10px">✅ जमा करें</button>
      <a href="https://wa.me/91${esc(cfg.wa)}?text=${encodeURIComponent("नमस्ते, मुझे दोस्त का ID चाहिए — "+me.name+" ("+me.mobile+")")}" target="_blank" rel="noopener"><button class="sec" style="width:100%;margin-top:8px">💬 ID नहीं पता? WhatsApp पर पूछें</button></a></div>`;
    if(block){
      GUIDE="नमस्ते "+me.name+"। सात दिन पूरे हो गए हैं और आपके दोस्त का आईडी अभी नहीं भरा है। जिस दोस्त ने आपको लिंक भेजा, उससे आठ अंक का आईडी पूछें, खाने में भरें और जमा करें दबाएँ। आईडी भरते ही आगे का काम खुल जाएगा।";
      app.innerHTML=refHtml; refHook(); return; }
  }
  function refHook(){ const gb=$("#gGo"); if(!gb) return; gb.onclick=async()=>{ const rc=$("#gRef").value.replace(/[^A-Za-z0-9]/g,"").toUpperCase(); if(!/^(\d{8}|DIP[A-Z0-9]{4,6})$/.test(rc)) return toast("दोस्त का ID 8 अंक का होना चाहिए (जैसे 13174393)");
      const b=$("#gGo"); b.disabled=true; b.textContent="जाँच हो रही है…";
      try{ const g=await getDoc(doc(db,"refCodes",rc)); if(!g.exists()){ toast("यह ID नहीं मिला — अपने दोस्त से दोबारा पूछें"); b.disabled=false; b.textContent="✅ जमा करें"; return; }
        await updateDoc(doc(db,"tCustomers",user.uid),{ref:g.data().uid,refCode:rc}); try{ sessionStorage.setItem("tourNew","1"); }catch(_){}
        mailCopy("🆔 ग्राहक ने दोस्त का ID भरा — "+me.name,{"ग्राहक":me.name,"मोबाइल":me.mobile,"दोस्त का ID":rc,"समय":new Date().toLocaleString("hi-IN")});
        toast("✅ ID जुड़ गया — याद दिलाना बंद"); showHome(user);
      }catch(e){ toast("जमा नहीं हुआ, इंटरनेट देखकर फिर कोशिश करें"); b.disabled=false; b.textContent="✅ जमा करें"; } }; }
  GUIDE=(refHtml?"नमस्ते "+me.name+"। एक काम बाकी है। जिस दोस्त ने आपको लिंक भेजा, उससे उसका आठ अंक का आईडी पूछकर ऊपर के खाने में भरें। अभी "+refLeft+" दिन बाकी हैं, तब तक आप काम जारी रख सकते हैं। ":"")+"यह आपका DIP Tour and Travels खाता है। ऊपर आपका ग्राहक आईडी लिखा है। नीचे के बटन से व्हाट्सऐप या टेलीग्राम पर हमसे बात करें। सूचना वाले हिस्से में नई जानकारी आती रहेगी।";
  app.innerHTML=refHtml+`
  ${(()=>{ let n=""; try{ n=sessionStorage.getItem("tourNew"); sessionStorage.removeItem("tourNew"); }catch(_){} return n?`<div class="card" style="border:2px solid #0e8a6a;background:#e8f6f1"><h3 style="margin:0">✅ आपका अकाउंट खुल गया!</h3><p style="margin:6px 0 0">🆔 आपका ग्राहक ID: <b>${esc(custId)}</b>${me.refCode?`<br>👥 दोस्त का ID: <b>${esc(me.refCode)}</b>`:""}</p></div>`:""; })()}
  <div class="card"><h3>👤 मेरी जानकारी</h3><p class="muted" style="margin:0 0 4px">🆔 ग्राहक ID: <b>${esc(custId)}</b>${me.refCode?` · 👥 दोस्त का ID: <b>${esc(me.refCode)}</b>`:""}</p><p style="margin:0">${esc(me.name)}<br><span class="muted">📱 ${esc(me.mobile)} · WhatsApp ${esc(me.wa)}<br>✉️ ${esc(me.mail)}${me.tg?` · ✈️ ${esc(me.tg)}`:""}<br>🪪 ${esc(me.idType)}: ${esc(me.idNo)}</span></p></div>
  <div class="card" id="ntc" style="border:2px solid #0e8a6a"><h3>📢 DIP Tour & Travels की सूचना</h3><div id="nList" class="list"><p class="muted">लोड हो रहा है…</p></div></div>
  <div class="card"><h3>💬 बात करें</h3><div class="chat" id="chat"></div><div class="row" style="margin-top:6px"><input id="mT" maxlength="500" placeholder="संदेश लिखें…" style="flex:1"><button id="mS" style="flex:none;width:auto">भेजें</button></div></div>
  <div class="card"><h3>📄 मेरे डॉक्यूमेंट</h3><label class="sec" style="display:block;text-align:center;padding:12px;border-radius:10px;background:#e8eef7;color:var(--pri);cursor:pointer">📤 फ़ोटो/डॉक्यूमेंट जोड़ें<input id="dF" type="file" accept="image/*" style="display:none"></label><input id="dN" placeholder="नाम (जैसे: आधार, टिकट)" maxlength="40" style="margin-top:6px"><div id="docs" class="list" style="margin-top:8px"></div></div>
  <div class="card sup"><h3>📞 सपोर्ट</h3>
    ${cfg.tg1?`<a href="https://t.me/${esc(tgA(cfg.tg1))}" target="_blank" rel="noopener"><button style="background:#229ED9">✈️ Telegram पर बात करें</button></a>`:""}
    ${cfg.tg2?`<a href="https://t.me/${esc(tgA(cfg.tg2))}" target="_blank" rel="noopener"><button style="background:#229ED9">✈️ Telegram सपोर्ट 2</button></a>`:""}
    ${cfg.wa?`<a href="https://wa.me/91${esc(cfg.wa)}?text=${encodeURIComponent("नमस्ते DIP Tour & Travels, मैं "+me.name+" ("+me.mobile+")")}" target="_blank" rel="noopener"><button class="ok">💬 WhatsApp पर बात करें</button></a>`:""}
    ${[["fb","📘 Facebook","#1877F2"],["ig","📸 Instagram","#C13584"],["yt","▶️ YouTube","#FF0000"],["x","𝕏 X (Twitter)","#111"],["web","🌐 वेबसाइट","#0b5d4b"]].map(([k,l,c])=>/^https?:\/\//.test(cfg[k]||"")?`<a href="${esc(cfg[k])}" target="_blank" rel="noopener"><button style="background:${c}">${l}</button></a>`:"").join("")}
    ${cfg.phone?`<a href="tel:+91${esc(cfg.phone)}"><button class="sec">📞 कॉल करें</button></a>`:""}</div>`;
  refHook();
  subs.push(onSnapshot(query(collection(db,"tNotice"),limit(30)),s=>{ const r=s.docs.map(d=>d.data()).sort((a,b)=>(toD(b.at)||new Date())-(toD(a.at)||new Date())).slice(0,10);
    const yt=l=>{ const m=String(l).match(/(?:youtu\.be\/|v=|shorts\/)([\w-]{11})/); return m?m[1]:""; };
    $("#nList").innerHTML=r.map(n=>{ const ok=/^https?:\/\//.test(n.link||""), y=ok&&yt(n.link); return `<div>${n.text?`<p style="margin:0 0 4px;white-space:pre-wrap">${esc(n.text)}</p>`:""}${y?`<a href="${esc(n.link)}" target="_blank" rel="noopener"><img src="https://i.ytimg.com/vi/${y}/mqdefault.jpg" style="width:100%;border-radius:10px" alt="YouTube"></a>`:""}${ok?`<a href="${esc(n.link)}" target="_blank" rel="noopener">${/wa\.me|whatsapp/.test(n.link)?"💬 WhatsApp खोलें":y?"▶️ YouTube पर देखें":"🔗 लिंक खोलें"}</a>`:""}<br><span class="muted">${fT(n.at)}</span></div>`; }).join("")||`<p class="muted">अभी कोई सूचना नहीं</p>`; },()=>{ const e=$("#ntc"); if(e) e.classList.add("hidden"); }));
  subs.push(onSnapshot(query(collection(db,"tMsgs"),where("uid","==",user.uid),limit(300)),s=>{ const r=s.docs.map(d=>d.data()).sort((a,b)=>(toD(a.at)||new Date())-(toD(b.at)||new Date()));
    const c=$("#chat"); c.innerHTML=r.map(m=>`<div class="msg ${m.from==="c"?"me":"them"}">${esc(m.text)}<small>${m.from==="c"?"आप":"DIP Tour"} · ${fT(m.at)}</small></div>`).join("")||`<p class="muted">यहाँ DIP Tour & Travels से सीधे बात करें</p>`; c.scrollTop=c.scrollHeight; },()=>{}));
  subs.push(onSnapshot(query(collection(db,"tDocs"),where("uid","==",user.uid),limit(50)),s=>{ $("#docs").innerHTML=s.docs.map(d=>{ const x=d.data(); return `<div class="between"><span>📄 ${esc(x.name||"डॉक्यूमेंट")}<br><span class="muted">${fT(x.at)}</span></span>${/^data:image\/jpeg;base64,/.test(x.img||"")?`<img src="${x.img}" style="width:48px;height:48px;object-fit:cover;border-radius:8px">`:""}</div>`; }).join("")||`<p class="muted">अभी कोई डॉक्यूमेंट नहीं</p>`; },()=>{}));
  $("#mS").onclick=async()=>{ const t=$("#mT").value.trim(); if(!t) return; $("#mS").disabled=true;
    try{ await addDoc(collection(db,"tMsgs"),{uid:user.uid,from:"c",text:t.slice(0,500),at:serverTimestamp()}); $("#mT").value=""; mailCopy("💬 ग्राहक संदेश — "+me.name,{"ग्राहक":me.name,"मोबाइल":me.mobile,"संदेश":t,"समय":new Date().toLocaleString("hi-IN")},me.mail); }catch(e){ toast(errM(e)); } $("#mS").disabled=false; };
  $("#mT").onkeydown=e=>{ if(e.key==="Enter") $("#mS").click(); };
  $("#dF").onchange=async e=>{ const f=e.target.files[0]; if(!f) return; toast("⏳ अपलोड हो रहा है…");
    try{ const img=await shrink(f,1000,0.6); if(img.length>700000) return toast("फ़ाइल बहुत बड़ी है"); const nm=$("#dN").value.trim()||"डॉक्यूमेंट";
      await addDoc(collection(db,"tDocs"),{uid:user.uid,name:nm.slice(0,40),img,at:serverTimestamp()}); $("#dN").value=""; e.target.value=""; toast("✅ डॉक्यूमेंट जुड़ गया");
      mailCopy("📄 ग्राहक डॉक्यूमेंट — "+me.name,{"ग्राहक":me.name,"मोबाइल":me.mobile,"डॉक्यूमेंट":nm,"समय":new Date().toLocaleString("hi-IN"),"देखें":"MASTER CONNECTOR → 🧳 टूर"},me.mail);
    }catch(_){ toast("अपलोड नहीं हुआ, दोबारा करें"); } };
}
onAuthStateChanged(auth,u=>{ if(!u) return showAuth(false); if(!String(u.email||"").endsWith("@"+DOM)){ app.innerHTML=`<div class="card">यह ग्राहक ऐप है। वर्कर/एडमिन MASTER CONNECTOR इस्तेमाल करें। <button class="sec sm" id="o2">लॉग आउट</button></div>`; $("#o2").onclick=()=>signOut(auth); return; } showHome(u); });
</script></body></html>
